<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>ServiceNow CSA Full Quiz (English)</title>
  <style>
    :root { --accent:#2563eb; --ok:#16a34a; --ng:#dc2626; --bg:#f8fafc; --card:#fff; --text:#0f172a; }
    body { font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; background: var(--bg); color: var(--text); line-height: 1.6; margin: 0; padding: 2rem 1rem; }
    .container { max-width: 920px; margin: 0 auto; }
    .card { background: var(--card); border: 1px solid #e5e7eb; border-radius: 12px; padding: 1rem 1.25rem; box-shadow: 0 2px 8px rgba(0,0,0,0.04); margin-bottom: 1rem; }
    h1 { font-size: 1.5rem; margin: 0 0 .75rem; }
    .question-title { font-weight: 600; margin-bottom: .5rem; }
    .options label { display:block; padding:.45rem .6rem; border-radius: 8px; cursor:pointer; }
    .options label:hover { background:#f1f5f9; }
    .actions { display:flex; gap:.5rem; margin-top:.75rem; flex-wrap:wrap; }
    button { background: var(--accent); color:#fff; border:none; border-radius:8px; padding:.5rem .9rem; font-weight:600; cursor:pointer; }
    button.secondary { background:#64748b; }
    .feedback { margin-top:.5rem; font-weight:600; }
    .feedback.ok { color: var(--ok); }
    .feedback.ng { color: var(--ng); }
    .hidden { display:none; }
    .explain { background:#f8fafc; border:1px dashed #cbd5e1; border-radius:8px; padding:.75rem; margin-top:.5rem; white-space:pre-wrap; }
    .meta { display:flex; justify-content:space-between; align-items:center; font-size:.9rem; color:#475569; }
    .progress { height:6px; background:#e5e7eb; border-radius:999px; overflow:hidden; margin:.5rem 0 1rem; }
    .progress > div { height:100%; width:0; background: var(--accent); transition: width .25s ease; }
    .summary { font-weight:600; }
    .is-selected { outline:2px solid #33415544; }
    .is-correct { background:#dcfce7; }
    .is-wrongselected { background:#fee2e2; }
    .disabled { opacity:.7; pointer-events:none; }
    .toolbar { display:flex; gap:.75rem; align-items:center; flex-wrap:wrap; margin:.5rem 0 0; }
    .badge { display:inline-flex; gap:.35rem; align-items:center; font-size:.85rem; border:1px solid #cbd5e1; padding:.2rem .5rem; border-radius:8px; color:#334155; background:#f1f5f9; }
  </style>
</head>
<body>
  <div class="container">
    <h1>ServiceNow CSA Full Quiz (English)</h1>

    <div class="toolbar card">
      <label class="badge"><input type="checkbox" id="rand-questions" checked /> Randomize question order</label>
      <label class="badge"><input type="checkbox" id="rand-options" /> Randomize answer choices</label>
      <span class="badge">Block size: 60</span>
      <div class="badge">Block <span id="block-index">1</span>/<span id="block-total">-</span>
        <button id="block-prev" class="secondary" style="margin-left:.5rem">◀ Prev 60</button>
        <button id="block-next" class="secondary">Next 60 ▶</button>
      </div>
      <button id="reshuffle-btn" class="secondary">Re-shuffle</button>
    </div>

    <div class="card" id="quiz-card">
      <div class="meta">
        <div id="counter">Q <span id="qnum">1</span> / <span id="qtotal">-</span> (this block)</div>
        <div class="summary">Correct: <span id="score">0</span></div>
      </div>
      <div class="progress" aria-hidden="true"><div id="bar"></div></div>

      <div id="question-block"></div>
      <div class="actions" id="controls">
        <button id="submit-btn">Submit Answer</button>
        <button id="next-btn" class="secondary" disabled>Next Question →</button>
        <button id="show-explain-btn" class="secondary hidden">💡 Show Explanation</button>
        <button id="reset-btn" class="secondary">Reset</button>
        <label class="badge"><input type="checkbox" id="auto-next" /> Auto-advance after answer</label>
      </div>

      <div id="feedback" class="feedback hidden" aria-live="polite"></div>
      <div id="discussion" class="explain hidden" aria-live="polite"></div>
    </div>

    <div class="card hidden" id="result-card">
      <h2>Results (this block)</h2>
      <p>Score: <strong id="final-score"></strong> / <span id="final-total"></span></p>
      <div class="actions">
        <button id="retry-btn" class="secondary">Retry these 60</button>
        <button id="goto-next-block">Next 60 ▶</button>
      </div>
    </div>
  </div>

  <script>
const quizData = {
  title: "ServiceNow CSA Full Quiz",
  questions: [
    { id: 'q1', type: 'single', text: 'Which of the following components can be found in a Service Catalog?', options: [
      { value: 'a', label: 'Order Guides, Exchange Rates, and Calendars' },
      { value: 'b', label: 'Order Guides, Catalog Items, and Interceptors' },
      { value: 'c', label: 'Catalog Items, Asset Contracts, and Task Surveys' },
      { value: 'd', label: 'Record Producers, Order Guides, and Catalog Items' }
    ], correct: ['d'], discussion: 'D is correct. A Service Catalog contains: Record Producers (alternative way to add information through the catalog, e.g., creating incidents), Order Guides (bundle multiple catalog items into one request), and Catalog Items (individual items users can request).' },

    { id: 'q2', type: 'single', text: 'When a field is coalesced during an import, which of the following statements is true?', options: [
      { value: 'a', label: 'If a match is found using the coalesce field, the existing record is updated with the imported information' },
      { value: 'b', label: 'If a match is not found using the coalesce field, the system will not create a transform map' },
      { value: 'c', label: 'If a match is found using the coalesce field, the system creates a new record' },
      { value: 'd', label: 'If a match is not found using the coalesce field, the existing record is updated with the imported information' }
    ], correct: ['a'], discussion: 'A is correct. If an existing record with a matching value is found in the target table, that record is updated. If no matching record is found, a new record is created in the target table.' },

    { id: 'q3', type: 'single', text: 'Which statement correctly describes the function of metrics in ServiceNow reporting?', options: [
      { value: 'a', label: 'Metrics are report gauges used on homepages that display real-time data' },
      { value: 'b', label: 'Metrics are time measurements used to report on the effectiveness of workflows and SLAs' },
      { value: 'c', label: 'Metrics are used to measure and evaluate the effectiveness of IT service management processes' },
      { value: 'd', label: 'Metrics are comparative measurements used to report on the effectiveness of flows and SLAs' }
    ], correct: ['c'], discussion: 'C is correct. Metrics are created to evaluate changes to fields on tasks — they measure and evaluate the effectiveness of ITSM processes, such as calculating the time taken to resolve incidents.' },

    { id: 'q4', type: 'single', text: 'The display order of Service Catalog items is controlled using which of the following?', options: [
      { value: 'a', label: 'The "Default Value" field on the catalog item form' },
      { value: 'b', label: 'The "Order" field on the catalog item form' },
      { value: 'c', label: 'The Order field on the variable form' },
      { value: 'd', label: 'The "Choices" field on the variable form' }
    ], correct: ['c'], discussion: 'C is correct. The Order field on the variable form controls the display sequence of variables in a catalog item.' },

    { id: 'q5', type: 'multi', text: 'From which two different locations within the platform can you create a report? (Choose 2)', requiredCount: 2, options: [
      { value: 'a', label: 'A list column heading' },
      { value: 'b', label: 'The Metrics module' },
      { value: 'c', label: 'The Statistics module' },
      { value: 'd', label: 'The View/Run module' }
    ], correct: ['a', 'd'], discussion: 'A and D are correct. Reports can be created from a list column heading or from the View/Run module.' },

    { id: 'q6', type: 'multi', text: 'Knowledge base search results can be sorted by which of the following? (Choose 3)', requiredCount: 3, options: [
      { value: 'a', label: 'Most recent update' },
      { value: 'b', label: 'Popularity' },
      { value: 'c', label: 'Relevance' },
      { value: 'd', label: 'Assigned to' },
      { value: 'e', label: 'Number of views' }
    ], correct: ['a', 'c', 'e'], discussion: 'A, C, and E are correct. Knowledge base search results can be sorted by Most Recent Update, Relevance, and Number of Views.' },

    { id: 'q7', type: 'single', text: 'What is the correct sequence to view the fulfillment stage task list for an order placed by a user?', options: [
      { value: 'a', label: 'RITM (number) > REQ (number) > PROCUREMENT (number)' },
      { value: 'b', label: 'REQ (number) > RITM (number) > Procurement (number)' },
      { value: 'c', label: 'REQ (number) > RITM (number) > TASK (number)' },
      { value: 'd', label: 'FULFILLMENT (number) > RITM (number) > TASK (number)' }
    ], correct: ['c'], discussion: 'C is correct. REQ contains RITMs; RITMs contain SCTASKs. When a catalog item is ordered, a single RITM is generated for each item, grouped under a parent REQ. Workflows may create SCTASK records as children of the RITM.' },

    { id: 'q8', type: 'single', text: 'Which term describes application menus or modules that a user wants to access quickly and frequently?', options: [
      { value: 'a', label: 'Breadcrumbs' },
      { value: 'b', label: 'Favorites' },
      { value: 'c', label: 'Tags' },
      { value: 'd', label: 'Bookmarks' }
    ], correct: ['b'], discussion: 'B is correct. Favorites allow users to quickly access frequently used application menus or modules.' },

    { id: 'q9', type: 'single', text: 'What is generated from the Service Catalog when a user orders an item or service?', options: [
      { value: 'a', label: 'A Change Request' },
      { value: 'b', label: 'An Order Guide' },
      { value: 'c', label: 'A Request' },
      { value: 'd', label: 'An SLA' }
    ], correct: ['c'], discussion: 'C is correct. When a user places an order, a Request (REQ) record is generated from the Service Catalog.' },

    { id: 'q10', type: 'multi', text: 'From the User menu, which actions can a user select? (Choose 3)', requiredCount: 3, options: [
      { value: 'a', label: 'Send a notification' },
      { value: 'b', label: 'Log out of ServiceNow' },
      { value: 'c', label: 'Elevate Role' },
      { value: 'd', label: 'Impersonate User' },
      { value: 'e', label: 'Order from Service Catalog' },
      { value: 'f', label: 'Approve a record' }
    ], correct: ['b', 'c', 'd'], discussion: 'B, C, and D are correct. From the User menu, a user can: Log out, Elevate Role (requires security_admin), and Impersonate User (requires admin).' },

    { id: 'q11', type: 'single', text: 'Buttons, form links, and context menu items are all examples of which feature?', options: [
      { value: 'a', label: 'Business Rules' },
      { value: 'b', label: 'UI Actions' },
      { value: 'c', label: 'Client Scripts' },
      { value: 'd', label: 'UI Policies' }
    ], correct: ['b'], discussion: 'B is correct. UI Actions define buttons, links, and context menu items that perform specific actions when clicked.' },

    { id: 'q12', type: 'single', text: 'Regarding the Service Catalog, which of the following is true about catalog items?', options: [
      { value: 'a', label: 'They run in the background' },
      { value: 'b', label: 'They are building blocks' },
      { value: 'c', label: 'They are optional' },
      { value: 'd', label: 'They provide options' }
    ], correct: ['b'], discussion: 'B is correct. Catalog items are the fundamental building blocks of a Service Catalog, representing individual services or products that users can request.' },

    { id: 'q13', type: 'single', text: 'Table access control rules are processed in the following order:', options: [
      { value: 'a', label: 'Any table name (wildcard), parent table name, table name' },
      { value: 'b', label: 'Table name, parent table name, any table name (wildcard)' },
      { value: 'c', label: 'Parent table name, table name, any table name (wildcard)' },
      { value: 'd', label: 'Any table name (wildcard), table name, parent table name' }
    ], correct: ['b'], discussion: 'B is correct. ACL rules are evaluated from most specific to most general: 1) Table name match (e.g., incident), 2) Parent table name match (e.g., task), 3) Any table (*) match.' },

    { id: 'q14', type: 'single', text: 'What is the platform name for the User table?', options: [
      { value: 'a', label: 'u_users' },
      { value: 'b', label: 'sys_users' },
      { value: 'c', label: 'x_users' },
      { value: 'd', label: 'sys_user' }
    ], correct: ['d'], discussion: 'D is correct. The User table platform name is sys_user. User records are stored in the Users [sys_user] table.' },

    { id: 'q15', type: 'single', text: 'The REQ number in Service Catalog represents:', options: [
      { value: 'a', label: 'The order number' },
      { value: 'b', label: 'A stage' },
      { value: 'c', label: 'A task to be completed' },
      { value: 'd', label: 'An individual item in an order' }
    ], correct: ['a'], discussion: 'A is correct. REQ represents the order number. A single REQ can contain multiple RITMs (Requested Items).' },

    { id: 'q16', type: 'single', text: 'Which of the following is NOT shown in the History section of the Application Navigator?', options: [
      { value: 'a', label: 'Records' },
      { value: 'b', label: 'UI Pages' },
      { value: 'c', label: 'Lists' },
      { value: 'd', label: 'Forms' }
    ], correct: ['b'], discussion: 'B is correct. UI Pages are not tracked in the History section. Lists and forms appear in history, but UI pages and other non-standard interfaces are not tracked.' },

    { id: 'q17', type: 'single', text: 'Which statement reflects ServiceNow\'s recommendation about update sets?', options: [
      { value: 'a', label: 'Do not use the Default update set when moving customizations between instances' },
      { value: 'b', label: 'Before moving customizations between instances, ensure both instances are running different versions' },
      { value: 'c', label: 'Update sets should be tested in production before applying to development' },
      { value: 'd', label: 'The Default update set can be used but must be exported as XML first' }
    ], correct: ['a'], discussion: 'A is correct. ServiceNow recommends using named update sets rather than the Default update set when moving customizations between instances.' },

    { id: 'q18', type: 'single', text: 'Which of the following best describes a "role" in ServiceNow?', options: [
      { value: 'a', label: 'A set of permissions that define what a user can and cannot do' },
      { value: 'b', label: 'A user group based on department' },
      { value: 'c', label: 'A workflow step assigned to a user' },
      { value: 'd', label: 'A category of catalog items' }
    ], correct: ['a'], discussion: 'A is correct. A role is a collection of permissions granted to users to define what they can and cannot access or do in ServiceNow.' },

    { id: 'q19', type: 'single', text: 'Which type of script is used to make fields mandatory, read-only, or hidden based on conditions, and runs on the client side?', options: [
      { value: 'a', label: 'Business Rule' },
      { value: 'b', label: 'Client Script' },
      { value: 'c', label: 'Script Include' },
      { value: 'd', label: 'UI Script' }
    ], correct: ['b'], discussion: 'B is correct. Client Scripts run in the browser and can dynamically change form behavior based on conditions.' },

    { id: 'q20', type: 'single', text: 'What is the correct way to navigate to a specific record using the Application Navigator filter?', options: [
      { value: 'a', label: 'Type the table name followed by .list to see all records' },
      { value: 'b', label: 'Type the record number directly into any search field' },
      { value: 'c', label: 'Use the global search bar at the top of the page' },
      { value: 'd', label: 'Both A and C are correct' }
    ], correct: ['d'], discussion: 'D is correct. You can navigate to records using the Application Navigator filter (tablename.list) or the global search bar.' },

    { id: 'q21', type: 'single', text: 'What are the components of a flow in Flow Designer?', options: [
      { value: 'a', label: 'Triggers, Actions, and Flow Logic' },
      { value: 'b', label: 'Triggers, Conditions, and Scripts' },
      { value: 'c', label: 'Events, Tasks, and Approvals' },
      { value: 'd', label: 'Workflows, Subflows, and Actions' }
    ], correct: ['a'], discussion: 'A is correct. Flows in Flow Designer consist of Triggers (what starts the flow), Actions (what the flow does), and Flow Logic (conditions and branching).' },

    { id: 'q22', type: 'single', text: 'Which module would you use to view all available knowledge bases?', options: [
      { value: 'a', label: 'Knowledge > Home' },
      { value: 'b', label: 'Self-Service > Knowledge' },
      { value: 'c', label: 'Knowledge > All' },
      { value: 'd', label: 'Knowledge > Knowledge Bases' }
    ], correct: ['b'], discussion: 'B is correct. End users access available knowledge bases through Self-Service > Knowledge.' },

    { id: 'q23', type: 'single', text: 'What is a Configuration Item (CI)?', options: [
      { value: 'a', label: 'Any component that needs to be managed to deliver a service' },
      { value: 'b', label: 'A template for creating catalog items' },
      { value: 'c', label: 'A hardware asset tracked in the asset module' },
      { value: 'd', label: 'A configurable field in a ServiceNow form' }
    ], correct: ['a'], discussion: 'A is correct. A Configuration Item (CI) is any component that needs to be managed in order to deliver an IT service.' },

    { id: 'q24', type: 'single', text: 'Which statement about access control lists (ACLs) in ServiceNow is correct?', options: [
      { value: 'a', label: 'ACLs are only applied to table-level access' },
      { value: 'b', label: 'ACLs can protect tables, records, and fields' },
      { value: 'c', label: 'ACLs can only be defined by the security_admin role' },
      { value: 'd', label: 'ACLs are evaluated from most general to most specific' }
    ], correct: ['b'], discussion: 'B is correct. ACLs in ServiceNow can protect tables, individual records, and specific fields.' },

    { id: 'q25', type: 'single', text: 'Which of the following is a feature of the Service Portal?', options: [
      { value: 'a', label: 'It is the same as the standard ServiceNow interface' },
      { value: 'b', label: 'It provides a consumer-grade self-service experience for end users' },
      { value: 'c', label: 'It can only be accessed by administrators' },
      { value: 'd', label: 'It replaces the Application Navigator' }
    ], correct: ['b'], discussion: 'B is correct. The Service Portal provides a consumer-grade, self-service experience designed for end users to submit requests, search knowledge, and track requests.' },

    { id: 'q26', type: 'single', text: 'What is the purpose of a Transform Map in ServiceNow?', options: [
      { value: 'a', label: 'To map fields from an import set table to a target table' },
      { value: 'b', label: 'To transform workflow steps into flow actions' },
      { value: 'c', label: 'To convert report types between formats' },
      { value: 'd', label: 'To migrate update sets between instances' }
    ], correct: ['a'], discussion: 'A is correct. A Transform Map defines the field relationships between an import set (staging) table and the target table in ServiceNow.' },

    { id: 'q27', type: 'single', text: 'What is the difference between a "group" and a "role" in ServiceNow?', options: [
      { value: 'a', label: 'Groups contain users; roles contain permissions. Roles are assigned to groups or users.' },
      { value: 'b', label: 'Roles contain users; groups contain permissions.' },
      { value: 'c', label: 'Groups and roles are interchangeable terms in ServiceNow.' },
      { value: 'd', label: 'Groups are only used for assignment; roles are used for notifications.' }
    ], correct: ['a'], discussion: 'A is correct. Groups are collections of users. Roles are collections of permissions. Roles can be assigned to users directly or inherited through group membership.' },

    { id: 'q28', type: 'single', text: 'Which ServiceNow application is primarily used to load data into ServiceNow?', options: [
      { value: 'a', label: 'Import Hub' },
      { value: 'b', label: 'System Import Sets' },
      { value: 'c', label: 'Data Import Configuration' },
      { value: 'd', label: 'Import Manager' }
    ], correct: ['b'], discussion: 'B is correct. System Import Sets is the primary application used for loading data into ServiceNow.' },

    { id: 'q29', type: 'single', text: 'What is the purpose of a Business Rule in ServiceNow?', options: [
      { value: 'a', label: 'To define the layout of form fields' },
      { value: 'b', label: 'To run server-side logic when records are displayed, inserted, updated, deleted, or queried' },
      { value: 'c', label: 'To control which fields are visible to end users' },
      { value: 'd', label: 'To create automated approval workflows' }
    ], correct: ['b'], discussion: 'B is correct. Business Rules are server-side scripts that run when records are displayed, inserted, updated, deleted, or queried.' },

    { id: 'q30', type: 'single', text: 'What does "dot-walking" allow you to do in ServiceNow?', options: [
      { value: 'a', label: 'Navigate through related records to access fields on reference tables' },
      { value: 'b', label: 'Create a breadcrumb trail of recently visited records' },
      { value: 'c', label: 'Walk through each step in a workflow visually' },
      { value: 'd', label: 'Apply filters using multiple conditions' }
    ], correct: ['a'], discussion: 'A is correct. Dot-walking allows you to traverse relationships between tables to access fields on related records.' },

    { id: 'q31', type: 'single', text: 'Which ServiceNow feature provides a visual, drag-and-drop interface for managing personal tasks?', options: [
      { value: 'a', label: 'Service Desk' },
      { value: 'b', label: 'Virtual Agent Homepage' },
      { value: 'c', label: 'Visual Task Board' },
      { value: 'd', label: 'Personal Task Tracker' }
    ], correct: ['c'], discussion: 'C is correct. Visual Task Boards provide a visual, drag-and-drop Kanban-style interface for managing personal tasks.' },

    { id: 'q32', type: 'single', text: 'Which type of field displays a Boolean value as a checkbox?', options: [
      { value: 'a', label: 'Yes/No' },
      { value: 'b', label: 'True/False' },
      { value: 'c', label: 'On/Off' },
      { value: 'd', label: 'Binary' }
    ], correct: ['b'], discussion: 'B is correct. The True/False field type displays as a checkbox in ServiceNow.' },

    { id: 'q33', type: 'single', text: 'What is the CMDB used for in ServiceNow?', options: [
      { value: 'a', label: 'To store all email notification templates' },
      { value: 'b', label: 'To provide a logical model of the enterprise infrastructure by identifying, controlling, and verifying CIs' },
      { value: 'c', label: 'To manage user authentication and access control' },
      { value: 'd', label: 'To store import set data before transformation' }
    ], correct: ['b'], discussion: 'B is correct. The Configuration Management Database (CMDB) provides a logical model of the enterprise infrastructure by identifying, controlling, maintaining, and verifying Configuration Items (CIs).' },

    { id: 'q34', type: 'single', text: 'Which of the following can be used to quickly filter a list to show only records matching a specific value?', options: [
      { value: 'a', label: 'Right-click a value in the list and select "Show Matching"' },
      { value: 'b', label: 'Click the funnel icon and type the value' },
      { value: 'c', label: 'Double-click the column header' },
      { value: 'd', label: 'Use the global search bar' }
    ], correct: ['a'], discussion: 'A is correct. Right-clicking a value in a list and selecting "Show Matching" quickly filters the list to show records matching that value.' },

    { id: 'q35', type: 'single', text: 'What is the first step in the data import process using Import Sets?', options: [
      { value: 'a', label: 'Run the data scrubber' },
      { value: 'b', label: 'Configure coalescing' },
      { value: 'c', label: 'Select the Import Set' },
      { value: 'd', label: 'Load Data' }
    ], correct: ['d'], discussion: 'D is correct. The first step when importing spreadsheet data is to Load Data into the staging (import set) table.' },

    { id: 'q36', type: 'single', text: 'Which module is used to create a new notification in ServiceNow?', options: [
      { value: 'a', label: 'System Notification > Email > Notifications' },
      { value: 'b', label: 'Administration > Notifications Overview' },
      { value: 'c', label: 'System Properties > Email > Settings' },
      { value: 'd', label: 'User Settings > Email > Notifications' }
    ], correct: ['a'], discussion: 'A is correct. New notifications are created via System Notification > Email > Notifications.' },

    { id: 'q37', type: 'single', text: 'Which of the following correctly describes the Incident table relationship to the Task table?', options: [
      { value: 'a', label: 'The Incident table has a one-to-many relationship with the Task table' },
      { value: 'b', label: 'The Incident table is derived/extended from the Task table' },
      { value: 'c', label: 'The Incident table is linked to the Task table via the INC number' },
      { value: 'd', label: 'The Incident table has a many-to-many relationship with the Task table' }
    ], correct: ['b'], discussion: 'B is correct. The Incident table extends the Task table — it is a child table that inherits fields and functionality from the Task table.' },

    { id: 'q38', type: 'single', text: 'What is the primary difference between Performance Analytics and Reporting?', options: [
      { value: 'a', label: 'Performance Analytics captures snapshots of data over time; Reports show data only as of the time the report is run' },
      { value: 'b', label: 'Performance Analytics can show trends but Reports cannot' },
      { value: 'c', label: 'Reports can be scheduled but Performance Analytics cannot' },
      { value: 'd', label: 'Performance Analytics data can be published to dashboards but reports cannot' }
    ], correct: ['a'], discussion: 'A is correct. Performance Analytics captures periodic snapshots to generate accurate historical trends, while Reports show a point-in-time snapshot of current data.' },

    { id: 'q39', type: 'single', text: 'Which feature allows non-technical users to orchestrate business processes across services?', options: [
      { value: 'a', label: 'Flow Manager' },
      { value: 'b', label: 'Flow Designer' },
      { value: 'c', label: 'Flow Editor' },
      { value: 'd', label: 'Workflow Editor' }
    ], correct: ['b'], discussion: 'B is correct. Flow Designer provides a low-code interface that allows non-technical users to automate processes and create workflows.' },

    { id: 'q40', type: 'single', text: 'What is an Order Guide in the Service Catalog?', options: [
      { value: 'a', label: 'A guide for administrators to configure catalog items' },
      { value: 'b', label: 'A catalog feature that bundles multiple catalog items into a single request' },
      { value: 'c', label: 'A document explaining how to complete a service request' },
      { value: 'd', label: 'A template for creating catalog items' }
    ], correct: ['b'], discussion: 'B is correct. An Order Guide allows multiple catalog items to be bundled together into a single request, useful for onboarding scenarios where multiple items are needed at once.' },

    { id: 'q41', type: 'single', text: 'What is the purpose of the "Impersonate User" feature?', options: [
      { value: 'a', label: 'To permanently take over another user\'s account' },
      { value: 'b', label: 'To temporarily act as another user for testing or troubleshooting purposes' },
      { value: 'c', label: 'To allow a user to grant their permissions to another user' },
      { value: 'd', label: 'To view another user\'s personal settings' }
    ], correct: ['b'], discussion: 'B is correct. Impersonate User allows an admin to temporarily act as another user to test what they see and troubleshoot issues.' },

    { id: 'q42', type: 'single', text: 'Which of the following is the correct sequence to apply an update set to an instance?', options: [
      { value: 'a', label: 'Retrieve, Preview, Commit' },
      { value: 'b', label: 'Specify, Transform, Apply' },
      { value: 'c', label: 'Retrieve, Evaluate, Apply' },
      { value: 'd', label: 'Retrieve, Test, Push' }
    ], correct: ['a'], discussion: 'A is correct. The steps to apply an update set are: Retrieve (from source instance), Preview (check for conflicts), Commit (apply changes).' },

    { id: 'q43', type: 'single', text: 'When creating a new notification, which three items must be defined? (Choose 3)', requiredCount: 3, options: [
      { value: 'a', label: 'The associated knowledge base' },
      { value: 'b', label: 'How inactive user accounts are handled' },
      { value: 'c', label: 'The condition under which the notification is sent' },
      { value: 'd', label: 'Who receives the notification' },
      { value: 'e', label: 'The content of the notification' }
    ], correct: ['c', 'd', 'e'], discussion: 'C, D, and E are correct. When creating a notification, you must define: When (the condition), Who (recipients), and What (the notification content).' },

    { id: 'q44', type: 'single', text: 'Which of the following correctly describes what a Record Producer does?', options: [
      { value: 'a', label: 'Creates catalog items for the Service Catalog' },
      { value: 'b', label: 'Provides an alternative way to create task-based records (such as incidents) through the Service Catalog' },
      { value: 'c', label: 'Generates automated reports on catalog usage' },
      { value: 'd', label: 'Produces configuration records from CI data' }
    ], correct: ['b'], discussion: 'B is correct. A Record Producer provides an alternative way to create task-based records (e.g., Incidents, Changes) through the Service Catalog interface.' },

    { id: 'q45', type: 'single', text: 'Which module is used to customize the banner image, text, and colors of an instance?', options: [
      { value: 'a', label: 'System UI > UI Page > Branding' },
      { value: 'b', label: 'Service Portal > Portals > Branding' },
      { value: 'c', label: 'System Properties > Basic Configuration UI16' },
      { value: 'd', label: 'System Properties > Branding' }
    ], correct: ['c'], discussion: 'C is correct. The banner image, text, and colors are customized via System Properties > Basic Configuration UI16.' },

    { id: 'q46', type: 'single', text: 'How are table access control rules processed?', options: [
      { value: 'a', label: 'Table name, parent table name, wildcard (*)' },
      { value: 'b', label: 'Wildcard (*), parent table name, table name' },
      { value: 'c', label: 'Parent table name, table name, wildcard (*)' },
      { value: 'd', label: 'Wildcard (*), table name, parent table name' }
    ], correct: ['a'], discussion: 'A is correct. ACL rules are evaluated from most specific to least specific: table name first, then parent table name, then wildcard (*).' },

    { id: 'q47', type: 'single', text: 'What type of users in ServiceNow have clearly defined paths and workflows, holding one or more roles such as ITIL and approver_user?', options: [
      { value: 'a', label: 'Workflow Users' },
      { value: 'b', label: 'Request Fulfillers' },
      { value: 'c', label: 'ITSM Users' },
      { value: 'd', label: 'Approval Managers' },
      { value: 'e', label: 'Service Desk Users' },
      { value: 'f', label: 'Process Users (Fulfillers)' }
    ], correct: ['f'], discussion: 'F is correct. Process Users (Fulfillers) are a defined persona in ServiceNow with clearly defined paths and workflows. They hold one or more roles (e.g., itil, approver_user) and have full feature access based on assigned roles.' },

    { id: 'q48', type: 'single', text: 'Which of the following scripts runs in the browser?', options: [
      { value: 'a', label: 'Script Include scripts' },
      { value: 'b', label: 'Access Control scripts' },
      { value: 'c', label: 'Business Rule scripts' },
      { value: 'd', label: 'UI Policies and Client Scripts' }
    ], correct: ['d'], discussion: 'D is correct. UI Policies and Client Scripts both run on the client side (in the browser).' },

    { id: 'q49', type: 'single', text: 'Which of the following correctly describes the order in which access controls are evaluated?', options: [
      { value: 'a', label: 'Field level (most specific to most general); then Table level (most specific to most general)' },
      { value: 'b', label: 'Field level (most general to most specific); then Row level (most specific to most general)' },
      { value: 'c', label: 'Table level (most specific to most general); then Field level (most specific to most general)' },
      { value: 'd', label: 'Table level (most specific to most general); then Record level (most specific to most general)' }
    ], correct: ['c'], discussion: 'C is correct. Access controls are always evaluated at the table level first (most specific to most general), then at the field level (most specific to most general).' },

    { id: 'q50', type: 'single', text: 'Which ServiceNow feature helps automatically assign high-priority service requests to the appropriate assignment group or team member?', options: [
      { value: 'a', label: 'Assignment Rules' },
      { value: 'b', label: 'User Policies' },
      { value: 'c', label: 'Predictive Intelligence' },
      { value: 'd', label: 'UI Policies' }
    ], correct: ['a'], discussion: 'A is correct. Assignment Rules automatically assign tasks and records to the appropriate assignment group or individual based on predefined criteria.' },

    { id: 'q51', type: 'single', text: 'What is the section in Report Designer used to specify the groupings and calculations performed on data?', options: [
      { value: 'a', label: 'Style' },
      { value: 'b', label: 'Grouping' },
      { value: 'c', label: 'Configure' },
      { value: 'd', label: 'Formatting' },
      { value: 'e', label: 'Data' }
    ], correct: ['c'], discussion: 'C is correct. The "Configure" section of the Report Designer is where you specify groupings and calculations. The four sections are: Data, Type, Configure, and Style.' },

    { id: 'q52', type: 'single', text: 'What icon do you use to change the color or icon of a Favorite?', options: [
      { value: 'a', label: 'Clock' },
      { value: 'b', label: 'Pencil' },
      { value: 'c', label: 'Triangle' },
      { value: 'd', label: 'Star' }
    ], correct: ['b'], discussion: 'B is correct. The pencil icon is used to edit Favorites (change color or icon). The star icon is used to add items to Favorites.' },

    { id: 'q53', type: 'single', text: 'What is the best way to experience a newly released ServiceNow application?', options: [
      { value: 'a', label: 'Search for a sales demo request form on the Wiki' },
      { value: 'b', label: 'Check the latest release notes on docs.servicenow.com' },
      { value: 'c', label: 'Activate the application plugin on your Personal Developer Instance (PDI)' },
      { value: 'd', label: 'Activate the application plugin on the company\'s production instance' }
    ], correct: ['c'], discussion: 'C is correct. The best way to get hands-on experience with a new application is to activate the application plugin on your Personal Developer Instance (PDI).' },

    { id: 'q54', type: 'single', text: 'When viewing a long list of records, how do you quickly filter to show only records where Short Description contains "email"?', options: [
      { value: 'a', label: 'Click the list magnifier to expand column search and type "email" in the Short Description field' },
      { value: 'b', label: 'Select text in the search box and type "email" then press Enter' },
      { value: 'c', label: 'Click the list magnifier and type "*email" in the Short Description column' },
      { value: 'd', label: 'Click the list magnifier and type "%email" in the Short Description field' }
    ], correct: ['c'], discussion: 'C is correct. "*email" is a wildcard search that returns records where Short Description contains the word "email". The % wildcard matches records ending with "email".' },

    { id: 'q55', type: 'single', text: 'In a many-to-many table relationship, which scenario is an example?', options: [
      { value: 'a', label: 'A vendor can sell multiple products, and a product can be sold by multiple vendors' },
      { value: 'b', label: 'A task can trigger multiple workflows, and a workflow can trigger multiple tasks' },
      { value: 'c', label: 'A request can contain multiple items, and items can be from any catalog item' },
      { value: 'd', label: 'A CI can belong to multiple classes, and a class can contain multiple CIs' }
    ], correct: ['a'], discussion: 'A is correct. A vendor selling multiple products and a product being sold by multiple vendors is a classic many-to-many relationship example, as described in ServiceNow training materials.' },

    { id: 'q56', type: 'single', text: 'Which icon in the Application Navigator would you double-click to expand and collapse all applications and modules?', options: [
      { value: 'a', label: 'Star' },
      { value: 'b', label: 'Clock' },
      { value: 'c', label: 'Application' },
      { value: 'd', label: 'Funnel' }
    ], correct: ['c'], discussion: 'C is correct. Double-clicking the Application icon expands and collapses all applications and modules in the Application Navigator.' },

    { id: 'q57', type: 'single', text: 'What do components that need to be managed to deliver a service represent in the CMDB context?', options: [
      { value: 'a', label: 'CSDM Items' },
      { value: 'b', label: 'CMDB' },
      { value: 'c', label: 'Configuration Items' },
      { value: 'd', label: 'Service Offerings' },
      { value: 'e', label: 'Assets' }
    ], correct: ['c'], discussion: 'C is correct. Configuration Items (CIs) are components that need to be managed in order to deliver IT services.' },

    { id: 'q58', type: 'single', text: 'To restrict a new Service Catalog item to only be visible to managers within the HR department, which method should you use?', options: [
      { value: 'a', label: 'Assign the Dept_Mgr role to the catalog content block' },
      { value: 'b', label: 'Add the "Department Manager" group to the User Criteria of the catalog item' },
      { value: 'c', label: 'Add the "Department Manager" group to the ACL of the catalog item' },
      { value: 'd', label: 'Publish the item only within the HR Service Catalog' },
      { value: 'e', label: 'Apply the Dept_Mgr ACL to the HR Service Catalog' }
    ], correct: ['b'], discussion: 'B is correct. Catalog items use User Criteria (not ACLs) to control visibility. Adding the "Department Manager" group to the User Criteria restricts visibility to that group.' },

    { id: 'q59', type: 'single', text: 'To create a filter condition that shows incidents where State is "Closed" AND Assignment Group is "Network", what should the user do after clicking the funnel icon?', options: [
      { value: 'a', label: 'Define first condition → click AND → define second condition → click Run' },
      { value: 'b', label: 'Define first condition → click AND → define second condition → press Enter' },
      { value: 'c', label: 'Define first condition; click OR; define second condition; press Enter' },
      { value: 'd', label: 'Define first condition; click > icon on breadcrumb; define second condition; click Run' }
    ], correct: ['a'], discussion: 'A is correct. When filtering with multiple AND conditions, you define the first condition, click AND, define the second condition, then click Run.' },

    { id: 'q60', type: 'single', text: 'What is the object name for an ACL rule specific to the incident table and the major_incident field?', options: [
      { value: 'a', label: 'Incident.Major_Incident' },
      { value: 'b', label: 'incident=>major_incident' },
      { value: 'c', label: 'incident<=>major_incident' },
      { value: 'd', label: 'incident||major_incident' },
      { value: 'e', label: 'incident.major_incident' }
    ], correct: ['e'], discussion: 'E is correct. ACL object names use lowercase and underscores: incident.major_incident (table name dot field name, all lowercase).' },

    { id: 'q61', type: 'single', text: 'Two departments (HR Onboarding and Facilities Management) both need to allow employees to request an event room setup service, using the same form and routing, but each has its own catalog. What is the best approach?', options: [
      { value: 'a', label: 'Create two catalog items and publish each to the appropriate catalog' },
      { value: 'b', label: 'Create one catalog item and publish it to both catalogs' },
      { value: 'c', label: 'Create one catalog item and publish it to a parent catalog accessible by both' },
      { value: 'd', label: 'Create one catalog item and control access via ACL' }
    ], correct: ['b'], discussion: 'B is correct. In ServiceNow, a single catalog item can be published to multiple catalogs, avoiding duplication while maintaining a single source of truth.' },

    { id: 'q62', type: 'single', text: 'After finishing high-security settings work, how do you return to the normal administrator security level?', options: [
      { value: 'a', label: 'Select Normal Role' },
      { value: 'b', label: 'Log out and log back in' },
      { value: 'c', label: 'Use System Administration > Normal Security module' },
      { value: 'd', label: 'Select the Global Update Set' },
      { value: 'e', label: 'End impersonation' }
    ], correct: ['b'], discussion: 'B is correct. Elevated roles (security_admin) end when the user logs out. The session ends the elevated privilege.' },

    { id: 'q63', type: 'single', text: 'Which type of field can look up values from another table?', options: [
      { value: 'a', label: 'Reference' },
      { value: 'b', label: 'Verity' },
      { value: 'c', label: 'Option' },
      { value: 'd', label: 'Choice' },
      { value: 'e', label: 'Dot-Walk' },
      { value: 'f', label: 'Lookup' }
    ], correct: ['a'], discussion: 'A is correct. A Reference field establishes a relationship between two tables and allows looking up values from another table.' },

    { id: 'q64', type: 'single', text: 'Which module would you use to create new automation for approvals, tasks, and notifications?', options: [
      { value: 'a', label: 'Process Automation > Flow Designer' },
      { value: 'b', label: 'Process Automation > Flow Management' },
      { value: 'c', label: 'Process Automation > Workflow Editor' },
      { value: 'd', label: 'Process Automation > Process Flows' },
      { value: 'e', label: 'Process Automation > Active Flows' }
    ], correct: ['a'], discussion: 'A is correct. Flow Designer is the module used to create new automation for approvals, tasks, notifications, and business logic.' },

    { id: 'q65', type: 'single', text: 'An analyst has been asked by a department manager to create a report. Where should the analyst start?', options: [
      { value: 'a', label: 'Reports Dashboard > New' },
      { value: 'b', label: 'Reports > Getting Started' },
      { value: 'c', label: 'Performance Analytics > Reports' },
      { value: 'd', label: 'Self-Service > Reports' },
      { value: 'e', label: 'Reports > Create New' }
    ], correct: ['e'], discussion: 'E is correct. To create a new report, navigate to Reports > Create New. Option B (Getting Started) goes to ServiceNow documentation, not the report creation interface.' },

    { id: 'q66', type: 'single', text: 'When importing spreadsheet data, in which step is data written to the receiving (target) table?', options: [
      { value: 'a', label: 'Run Transform' },
      { value: 'b', label: 'Run Import' },
      { value: 'c', label: 'Import Data Set' },
      { value: 'd', label: 'Execute Transform' },
      { value: 'e', label: 'Schedule Transform' }
    ], correct: ['a'], discussion: 'A is correct. The "Run Transform" step executes the transform map and writes data from the import set (staging) table to the target table.' },

    { id: 'q67', type: 'multi', text: 'How can you group records in a list by the "Category" column? (Choose 2)', requiredCount: 2, options: [
      { value: 'a', label: 'In the list context menu, select Group By > Category' },
      { value: 'b', label: 'In the Filter menu, select Group By > Category' },
      { value: 'c', label: 'Click the group icon and select Category' },
      { value: 'd', label: 'Type "tablename.group.category" in the navigator filter and press Enter' },
      { value: 'e', label: 'Right-click the Category column title in the context menu and select Group By Category' }
    ], correct: ['a', 'e'], discussion: 'A and E are correct. You can group by a column by using the list context menu (Group By > Category) or by right-clicking the column header and selecting Group By.' },

    { id: 'q68', type: 'single', text: 'Which collaboration tool, accessible via the bubble icon in the banner, is available?', options: [
      { value: 'a', label: 'Now Messenger' },
      { value: 'b', label: 'Agent Chat' },
      { value: 'c', label: 'Connect Chat' },
      { value: 'd', label: 'Now Collaboration' },
      { value: 'e', label: 'Live Feed' }
    ], correct: ['c'], discussion: 'C is correct. Connect Chat is accessible via the bubble icon in the banner. Note: In newer releases (San Diego+), Connect has been replaced by Sidebar.' },

    { id: 'q69', type: 'single', text: 'Which tab in a Knowledge Base record is used to define users who CANNOT write articles to the knowledge base?', options: [
      { value: 'a', label: 'Cannot Submit' },
      { value: 'b', label: 'Cannot Author' },
      { value: 'c', label: 'Cannot Contribute' },
      { value: 'd', label: 'Cannot Write' },
      { value: 'e', label: 'Read Only' }
    ], correct: ['c'], discussion: 'C is correct. The "Cannot Contribute" tab in the Knowledge Base record defines users who cannot write articles. This tab may need to be added via related list configuration.' },

    { id: 'q70', type: 'multi', text: 'Which features can update multiple records at once? (Choose 2)', requiredCount: 2, options: [
      { value: 'a', label: 'List Editor' },
      { value: 'b', label: 'Field Update Action' },
      { value: 'c', label: 'Bulk Record Update' },
      { value: 'd', label: 'Data Repair Dashboard' },
      { value: 'e', label: 'Update Selected Action' }
    ], correct: ['a', 'e'], discussion: 'A and E are correct. The List Editor and the Update Selected action (via the "Actions on selected rows" dropdown) can both update multiple records simultaneously.' },

    { id: 'q71', type: 'multi', text: 'By default, which knowledge workers can create and edit Knowledge Base categories? (Choose 2)', requiredCount: 2, options: [
      { value: 'a', label: 'Knowledge Author' },
      { value: 'b', label: 'Knowledge Contributor' },
      { value: 'c', label: 'Knowledge Controller' },
      { value: 'd', label: 'Knowledge Manager' },
      { value: 'e', label: 'Knowledge Category Admin' },
      { value: 'f', label: 'Knowledge Submitter' },
      { value: 'g', label: 'Knowledge Owner' },
      { value: 'h', label: 'Knowledge Taxonomy Owner' }
    ], correct: ['b', 'd'], discussion: 'B and D are correct. Knowledge Contributors can select and add/edit categories when enabled. Knowledge Managers can define knowledge categories to pre-populate the available category list.' },

    { id: 'q72', type: 'single', text: 'Which collaboration tool opens a sidebar to start a new conversation with other ServiceNow users?', options: [
      { value: 'a', label: 'Skype Now' },
      { value: 'b', label: 'Now Collaboration' },
      { value: 'c', label: 'Agent Messenger' },
      { value: 'd', label: 'Agent Chat' },
      { value: 'e', label: 'Connect Chat' }
    ], correct: ['e'], discussion: 'E is correct. Connect Chat opens a sidebar to start new conversations with other ServiceNow users.' },

    { id: 'q73', type: 'multi', text: 'Which modules can you use to view all fields for the Incident table? (Choose 2)', requiredCount: 2, options: [
      { value: 'a', label: 'Tables and Columns' },
      { value: 'b', label: 'Dictionary' },
      { value: 'c', label: 'Data Class Manager' },
      { value: 'd', label: 'Dictionary Dashboard' },
      { value: 'e', label: 'Database View' },
      { value: 'f', label: 'Schema' }
    ], correct: ['a', 'b'], discussion: 'A and B are correct. Both Tables and Columns and the Dictionary module can be used to view all fields for a table.' },

    { id: 'q74', type: 'single', text: 'Which flow component triggers a flow to run after a record has been created or updated?', options: [
      { value: 'a', label: 'Date-based trigger' },
      { value: 'b', label: 'Changed trigger' },
      { value: 'c', label: 'Record-based trigger' },
      { value: 'd', label: 'Application-based trigger' },
      { value: 'e', label: 'Updated date trigger' }
    ], correct: ['c'], discussion: 'C is correct. Record-based triggers start a flow when a record is created or updated.' },

    { id: 'q75', type: 'single', text: 'Which module is used to access available Knowledge Bases?', options: [
      { value: 'a', label: 'Knowledge > Home' },
      { value: 'b', label: 'Self-Service > Knowledge' },
      { value: 'c', label: 'Knowledge > All' },
      { value: 'd', label: 'Knowledge > Knowledge Bases' },
      { value: 'e', label: 'Knowledge > Overview' }
    ], correct: ['b'], discussion: 'B is correct. Self-Service > Knowledge is the module used to access available Knowledge Bases as an end user.' },

    { id: 'q76', type: 'single', text: 'A customer requires: (1) Incident Number to be read-only for all users in all lists and forms; (2) Short Description to be mandatory on insert for all applications. What type of policy would you use?', options: [
      { value: 'a', label: 'Data Quality Policy' },
      { value: 'b', label: 'Dictionary Design Policy' },
      { value: 'c', label: 'UI Data Policy' },
      { value: 'd', label: 'UI Policy' },
      { value: 'e', label: 'Field Criteria Policy' },
      { value: 'f', label: 'Data Policy' }
    ], correct: ['f'], discussion: 'F is correct. Data Policies apply to all data entering the platform regardless of source (forms, import sets, web services). UI Policies only apply to data entered via forms in a browser.' },

    { id: 'q77', type: 'single', text: 'Which utility is used to import data from various data sources and map it to ServiceNow tables?', options: [
      { value: 'a', label: 'Transform Set' },
      { value: 'b', label: 'Data Pack' },
      { value: 'c', label: 'Update Set' },
      { value: 'd', label: 'Import Set' }
    ], correct: ['d'], discussion: 'D is correct. Import Sets is the tool used to import data from various data sources and map it to ServiceNow tables.' },

    { id: 'q78', type: 'single', text: 'When a policy is configured to apply to all data entering the platform (via UI, Import Sets, or Web Services), where does it run by default?', options: [
      { value: 'a', label: 'Client' },
      { value: 'b', label: 'Network' },
      { value: 'c', label: 'Browser' },
      { value: 'd', label: 'Server' }
    ], correct: ['d'], discussion: 'D is correct. Data Policies run on the server side, ensuring consistent enforcement regardless of how data enters the platform.' },

    { id: 'q79', type: 'single', text: 'How can you describe the relationship between the Incident table and the Task table?', options: [
      { value: 'a', label: 'Incident table has a one-to-many relationship with the Task table' },
      { value: 'b', label: 'Incident table is extended from (derived from) the Task table' },
      { value: 'c', label: 'Incident table is related to Task table via INC number' },
      { value: 'd', label: 'Incident table has a many-to-many relationship with the Task table' }
    ], correct: ['b'], discussion: 'B is correct. The Incident table extends the Task table, meaning it inherits all fields and properties from Task.' },

    { id: 'q80', type: 'single', text: 'Which flow component specifies when a flow should run?', options: [
      { value: 'a', label: 'Triggers and condition pills' },
      { value: 'b', label: 'Conditions and tables' },
      { value: 'c', label: 'Trigger criteria and clock' },
      { value: 'd', label: 'Triggers and conditions' },
      { value: 'e', label: 'Scope and trigger conditions' }
    ], correct: ['d'], discussion: 'D is correct. Triggers and conditions are the flow components that specify when a flow should run.' },

    { id: 'q81', type: 'single', text: 'Which section of Report Designer is used to specify the name of the report and its table or data source?', options: [
      { value: 'a', label: 'Type' },
      { value: 'b', label: 'Properties' },
      { value: 'c', label: 'Configure' },
      { value: 'd', label: 'Source' },
      { value: 'e', label: 'Data' }
    ], correct: ['e'], discussion: 'E is correct. The Data section is the first tab in Report Designer where you specify the report name and data source (table).' },

    { id: 'q82', type: 'single', text: 'To add the "Save" button to the form header in a new Incident record, what do you need to do?', options: [
      { value: 'a', label: 'Context Menu > Form Design > Add "Save" button' },
      { value: 'b', label: 'All > System Properties > UI Properties > Enable the "glide.ui.advanced" property' },
      { value: 'c', label: 'All > System Properties > UI Properties > Enable "Save" button' },
      { value: 'd', label: 'Context Menu > Form Layout > Add "Save" button' }
    ], correct: ['c'], discussion: 'C is correct. To show the Save button on forms, go to All > System Properties > UI Properties and enable the "Show Save, Insert, and Insert and Stay buttons on the form" option.' },

    { id: 'q83', type: 'single', text: 'Which feature ensures data integrity when importing data using Import Sets and Web Services?', options: [
      { value: 'a', label: 'UI Policy' },
      { value: 'b', label: 'Data Policy' },
      { value: 'c', label: 'Business Rule' },
      { value: 'd', label: 'Client Script' },
      { value: 'e', label: 'CSDM' }
    ], correct: ['b'], discussion: 'B is correct. Data Policies apply to all data entering the platform, including Import Sets and Web Services, ensuring data integrity.' },

    { id: 'q84', type: 'single', text: 'In Flow Designer, what initiates the execution of a flow?', options: [
      { value: 'a', label: 'Flow Logic' },
      { value: 'b', label: 'An existing subflow' },
      { value: 'c', label: 'An execution data pill' },
      { value: 'd', label: 'A trigger' }
    ], correct: ['d'], discussion: 'D is correct. In Flow Designer, a trigger initiates the execution of a flow. Triggers can be record-based, date-based, or application-based.' },

    { id: 'q85', type: 'single', text: 'What is the name of the string that displays filter conditions?', options: [
      { value: 'a', label: 'Breadcrumb' },
      { value: 'b', label: 'Selection' },
      { value: 'c', label: 'Menu' },
      { value: 'd', label: 'Topic' }
    ], correct: ['a'], discussion: 'A is correct. In ServiceNow, the breadcrumb is the string that displays the current filter conditions applied to a list.' },

    { id: 'q86', type: 'single', text: 'Which system property is added and set to true to log impersonation events in the system log?', options: [
      { value: 'a', label: 'glide.sys.all_impersonation' },
      { value: 'b', label: 'glide.user_setting' },
      { value: 'c', label: 'glide.sys.log_impersonation' },
      { value: 'd', label: 'glide.sys.log_impersonation' },
      { value: 'e', label: 'glide.sys.admin_login' }
    ], correct: ['d'], discussion: 'D is correct. Set glide.sys.log_impersonation to true to enable logging of impersonation events in the system log.' },

    { id: 'q87', type: 'single', text: 'What is the process that enables users in an organization to create, categorize, review, approve, and view important information in a centralized location?', options: [
      { value: 'a', label: 'Self-Service Administration' },
      { value: 'b', label: 'Knowledge Management' },
      { value: 'c', label: 'Business Information Management' },
      { value: 'd', label: 'Information Portal Administration' },
      { value: 'e', label: 'Knowledge-Centered Administration' }
    ], correct: ['b'], discussion: 'B is correct. Knowledge Management enables organizations to create, categorize, review, approve, and view important information in a centralized shared location.' },

    { id: 'q88', type: 'single', text: 'A colleague wants to rearrange the columns in their My Work list. After navigating to the list, where should they go to select and arrange the columns?', options: [
      { value: 'a', label: 'Right-click any column header, then Context Menu > Configure > List Layout' },
      { value: 'b', label: 'Click the list context menu > Configure > List Layout' },
      { value: 'c', label: 'Click the list context menu > Personalize List' },
      { value: 'd', label: 'Click Personalize List' }
    ], correct: ['d'], discussion: 'D is correct. To personalize your own list view (not change it for everyone), click the gear icon (labeled "Personalize list") in the list header to select and arrange columns.' },

    { id: 'q89', type: 'single', text: 'You are viewing a list of active incidents and want to exclude incidents with a "Resolved" state. What should you do?', options: [
      { value: 'a', label: 'In the search, select State and type "not Resolved" then press Enter' },
      { value: 'b', label: 'Right-click the State column title and select Exclude Filter > Resolved' },
      { value: 'c', label: 'Right-click the "Resolved" value in the record list and select "Exclude"' },
      { value: 'd', label: 'Right-click the "Resolved" value in the record list and select "Filter Out"' }
    ], correct: ['c'], discussion: 'C is correct. Right-clicking a value in the list and selecting "Exclude" will add an exclusion filter for that value.' },

    { id: 'q90', type: 'single', text: 'Which role inherits all permissions from the catalog role and user_criteria_admin role, and also has permission to create items and services?', options: [
      { value: 'a', label: 'System Administrator [sys_admin]' },
      { value: 'b', label: 'Catalog Admin [catalog_admin]' },
      { value: 'c', label: 'Catalog Writer [sn_catalog_write]' },
      { value: 'd', label: 'Item Admin [sn_item_admin]' }
    ], correct: ['b'], discussion: 'B is correct. The catalog_admin role inherits from both the catalog and user_criteria_admin roles and also has permission to create items and services.' },

    { id: 'q91', type: 'single', text: 'Which component of the ServiceNow infrastructure defines all tables and fields in the system?', options: [
      { value: 'a', label: 'Schema' },
      { value: 'b', label: 'Field Map' },
      { value: 'c', label: 'Table Class Manager' },
      { value: 'd', label: 'Dictionary' },
      { value: 'e', label: 'Data Atlas' }
    ], correct: ['d'], discussion: 'D is correct. The Dictionary defines all tables and fields in the ServiceNow platform.' },

    { id: 'q92', type: 'multi', text: 'Which data integrity settings can be achieved using UI Policies? (Choose 3)', requiredCount: 3, options: [
      { value: 'a', label: 'Set a field to accept data in an expected format' },
      { value: 'b', label: 'Set a field to accept data of n number of characters' },
      { value: 'c', label: 'Set a field to hidden' },
      { value: 'd', label: 'Set a field to read-only' },
      { value: 'e', label: 'Set a field to mandatory' }
    ], correct: ['c', 'd', 'e'], discussion: 'C, D, and E are correct. UI Policies can set fields to hidden, read-only, or mandatory. They do not control data format or character limits (those are dictionary attributes).' },

    { id: 'q93', type: 'single', text: 'A customer wants to validate on a form that a submission is valid using a client script. Which client script would you recommend?', options: [
      { value: 'a', label: 'onSubmit()' },
      { value: 'b', label: 'onSubmission()' },
      { value: 'c', label: 'onUpdate()' },
      { value: 'd', label: 'onLoad()' }
    ], correct: ['a'], discussion: 'A is correct. onSubmit() is the client script type used to validate data before the form is submitted. onSubmission() does not exist.' },

    { id: 'q94', type: 'multi', text: 'An order was placed from the Service Catalog. Two records are created as a result. Which two records are associated with this new order item? (Choose 2)', requiredCount: 2, options: [
      { value: 'a', label: 'A record in the sc_req_item table' },
      { value: 'b', label: 'An sc_task record' },
      { value: 'c', label: 'An Incident record' },
      { value: 'd', label: 'A Change record' },
      { value: 'e', label: 'A Problem record' }
    ], correct: ['a', 'b'], discussion: 'A and B are correct. When a catalog item is ordered, an RITM (sc_req_item) is created, and SCTASK (sc_task) records may be created by the workflow.' },

    { id: 'q95', type: 'single', text: 'To customize the column layout in a list, which action do you perform?', options: [
      { value: 'a', label: 'Context Menu > View > Customize' },
      { value: 'b', label: 'Click gear icon > Personalize window options > Select appropriate columns' },
      { value: 'c', label: 'Select a column to customize and choose the customize option on the right side of the header' },
      { value: 'd', label: 'Select a column, click the edit icon (pencil), and choose the customize option' }
    ], correct: ['b'], discussion: 'B is correct. Click the gear icon (Personalize List) in the list header to select and arrange the columns you want to display.' },

    { id: 'q96', type: 'single', text: 'After placing a new office equipment order through the Service Catalog, how do you view the list of requests?', options: [
      { value: 'a', label: 'All > Tables and Columns > Task' },
      { value: 'b', label: 'Type "requests.list" in the navigation filter and press Enter' },
      { value: 'c', label: 'All > Service Catalog > Requests' },
      { value: 'd', label: 'All > Service Catalog > Open Records > Items' }
    ], correct: ['d'], discussion: 'D is correct. To view the list of orders/requests: All > Service Catalog > Open Records > Items. This shows RITM records with associated REQ values.' },

    { id: 'q97', type: 'single', text: 'To access the table configuration page from a form, which path do you select?', options: [
      { value: 'a', label: 'Form Context Menu > View > Show Table' },
      { value: 'b', label: 'Form Context Menu > View > Table' },
      { value: 'c', label: 'Form Context Menu > Configure > Dictionary' },
      { value: 'd', label: 'Form Context Menu > Configure > Table' }
    ], correct: ['d'], discussion: 'D is correct. Navigate to Form Context Menu > Configure > Table to access the table configuration page.' },

    { id: 'q98', type: 'single', text: 'Which admin role is required to change high-security settings?', options: [
      { value: 'a', label: 'high_sec_admin' },
      { value: 'b', label: 'sn_acl_admin' },
      { value: 'c', label: 'admin' },
      { value: 'd', label: 'security_admin' }
    ], correct: ['d'], discussion: 'D is correct. The security_admin role is required to change high-security settings (ACL modifications).' },

    { id: 'q99', type: 'single', text: 'What is the most common role that provides access to almost all features, functions, and data in the platform?', options: [
      { value: 'a', label: 'Super User [sn_super_user]' },
      { value: 'b', label: 'Security Admin [security_admin]' },
      { value: 'c', label: 'System Administrator [admin]' },
      { value: 'd', label: 'Base Admin [base_admin]' },
      { value: 'e', label: 'System Manager [sys_manager]' }
    ], correct: ['c'], discussion: 'C is correct. The System Administrator [admin] role provides access to almost all features, functions, and data in the platform.' },

    { id: 'q100', type: 'single', text: 'To move multiple update sets at once, what do you do to facilitate the move?', options: [
      { value: 'a', label: 'Preview' },
      { value: 'b', label: 'Batch' },
      { value: 'c', label: 'List' },
      { value: 'd', label: 'Map' }
    ], correct: ['b'], discussion: 'B is correct. Batch update sets allow you to group multiple update sets so they can be previewed and committed together as a single unit.' },

    { id: 'q101', type: 'single', text: 'After making changes to a report, where do you click to check the results without saving?', options: [
      { value: 'a', label: 'Preview' },
      { value: 'b', label: 'Test' },
      { value: 'c', label: 'Run' },
      { value: 'd', label: 'Try it' },
      { value: 'e', label: 'Execute' }
    ], correct: ['c'], discussion: 'C is correct. Click "Run" to execute the report and see results based on current settings without saving.' },

    { id: 'q102', type: 'single', text: 'Which framework can automatically populate the "Priority" and "Category" fields based on the value in the "Short Description" field?', options: [
      { value: 'a', label: 'Predictive Intelligence' },
      { value: 'b', label: 'Assignment Rules' },
      { value: 'c', label: 'CSDM' },
      { value: 'd', label: 'Actions' },
      { value: 'e', label: 'UI Policies' }
    ], correct: ['a'], discussion: 'A is correct. Predictive Intelligence uses machine learning algorithms to automatically populate field values (like Priority and Category) based on text input like Short Description.' },

    { id: 'q103', type: 'single', text: 'Which testing framework is used to test ServiceNow applications?', options: [
      { value: 'a', label: 'Test Driven Framework (TDF)' },
      { value: 'b', label: 'Junit' },
      { value: 'c', label: 'Selenium' },
      { value: 'd', label: 'Automated Test Framework (ATF)' }
    ], correct: ['d'], discussion: 'D is correct. The Automated Test Framework (ATF) is ServiceNow\'s built-in testing framework for testing applications.' },

    { id: 'q104', type: 'single', text: 'Which can create task-based records from the Service Catalog?', options: [
      { value: 'a', label: 'Assignment Rules' },
      { value: 'b', label: 'Flow Designer' },
      { value: 'c', label: 'UI Builder' },
      { value: 'd', label: 'Record Producer' }
    ], correct: ['d'], discussion: 'D is correct. Record Producers allow creating task-based records (Incidents, Changes, etc.) from the Service Catalog interface.' },

    { id: 'q105', type: 'single', text: 'Which module is used to access available reports?', options: [
      { value: 'a', label: 'Self-Service > My Reports' },
      { value: 'b', label: 'Self-Service > My Dashboards' },
      { value: 'c', label: 'Reports > View / Run' },
      { value: 'd', label: 'Reports > Homepage' },
      { value: 'e', label: 'Reports > Overview' }
    ], correct: ['c'], discussion: 'C is correct. Reports > View/Run is the module used to access available reports.' },

    { id: 'q106', type: 'single', text: 'Security rules that restrict what data users can view and interact with are called what?', options: [
      { value: 'a', label: 'CRUD Rules' },
      { value: 'b', label: 'Access Control Rules' },
      { value: 'c', label: 'Role Assignment Rules' },
      { value: 'd', label: 'Scripted User Rules' },
      { value: 'e', label: 'User Authentication Rules' }
    ], correct: ['b'], discussion: 'B is correct. Access Control Rules (ACL Rules) restrict what data users can view and interact with in ServiceNow.' },

    { id: 'q107', type: 'multi', text: 'A new IT employee needs to perform work assigned to the Network and Hardware groups. How do you configure access? (Choose 3)', requiredCount: 3, options: [
      { value: 'a', label: 'Add the user account to the Hardware group' },
      { value: 'b', label: 'Add the user account to the IT Knowledge Base' },
      { value: 'c', label: 'Create a user account' },
      { value: 'd', label: 'Add the user account to the ITIL group' },
      { value: 'e', label: 'Add the user account to the Network group' },
      { value: 'f', label: 'Add the user account to an ACL' }
    ], correct: ['a', 'c', 'e'], discussion: 'A, C, and E are correct. Create a user account, then add the user to the Network group and the Hardware group. Roles should be inherited through group membership.' },

    { id: 'q108', type: 'single', text: 'What is specified in an Access Control Rule?', options: [
      { value: 'a', label: 'Groups, condition expressions, and workflows' },
      { value: 'b', label: 'Table schema, CRUD, and user authentication' },
      { value: 'c', label: 'The object and operation being protected; the permissions required to access the object' },
      { value: 'd', label: 'security_admin' }
    ], correct: ['c'], discussion: 'C is correct. Each ACL rule specifies: the object and operation being protected, and the permissions required to access that object.' },

    { id: 'q109', type: 'single', text: 'Which icon do you double-click to expand and collapse the full list of applications and modules?', options: [
      { value: 'a', label: 'Star' },
      { value: 'b', label: 'Clock' },
      { value: 'c', label: 'Application' },
      { value: 'd', label: 'Funnel' }
    ], correct: ['c'], discussion: 'C is correct. Double-clicking the Application icon expands and collapses all application menus in the navigator.' },

    { id: 'q110', type: 'single', text: 'What are the components that need to be managed to deliver a service called?', options: [
      { value: 'a', label: 'CSDM Items' },
      { value: 'b', label: 'CMDB' },
      { value: 'c', label: 'Configuration Items' },
      { value: 'd', label: 'Service Offerings' },
      { value: 'e', label: 'Assets' }
    ], correct: ['c'], discussion: 'C is correct. Configuration Items (CIs) are the components that need to be managed in order to deliver an IT service — this is the ITIL definition.' },

    { id: 'q111', type: 'multi', text: 'What are the three security modules commonly used by system administrators? (Choose 3)', requiredCount: 3, options: [
      { value: 'a', label: 'System Properties > Security' },
      { value: 'b', label: 'Utilities > Security Migration' },
      { value: 'c', label: 'System Security > Security' },
      { value: 'd', label: 'Self-Service > My Access' },
      { value: 'e', label: 'System Security > Access Control (ACL)' },
      { value: 'f', label: 'Password Management > Security Questions' },
      { value: 'g', label: 'System Security > High Security Settings' }
    ], correct: ['a', 'e', 'g'], discussion: 'A, E, and G are correct. The three commonly used security modules are: System Properties > Security, System Security > Access Control (ACL), and System Security > High Security Settings.' },

    { id: 'q112', type: 'multi', text: 'When testing a catalog item that has a manager approval flow, which best practices should you follow? (Choose 3)', requiredCount: 3, options: [
      { value: 'a', label: 'Ensure the latest flow is activated' },
      { value: 'b', label: 'Use instance incognito mode to quickly switch between requester and approver' },
      { value: 'c', label: 'Impersonate the requester to verify the form works correctly' },
      { value: 'd', label: 'Ensure a manager is specified on the requester\'s user record' },
      { value: 'e', label: 'Create and select a test update set before starting the test case' },
      { value: 'f', label: 'Use admin account to approve items quickly' }
    ], correct: ['a', 'c', 'd'], discussion: 'A, C, and D are correct. Best practices: (A) Activate the latest flow version, (C) Impersonate the requester to test from user perspective, (D) Ensure manager is set on the requester\'s user record for approval routing.' },

    { id: 'q113', type: 'single', text: 'What is the no-code method to control whether form fields are mandatory or read-only?', options: [
      { value: 'a', label: 'UI Actions' },
      { value: 'b', label: 'Client Scripts' },
      { value: 'c', label: 'UI Scripts' },
      { value: 'd', label: 'UI Rules' },
      { value: 'e', label: 'UI Policies' }
    ], correct: ['e'], discussion: 'E is correct. UI Policies are the no-code method to control field visibility, mandatory status, and read-only status on forms.' },

    { id: 'q114', type: 'single', text: 'To move multiple update sets at once, what do you use to facilitate the move?', options: [
      { value: 'a', label: 'Batch' },
      { value: 'b', label: 'Validate' },
      { value: 'c', label: 'Test' },
      { value: 'd', label: 'Preview' }
    ], correct: ['a'], discussion: 'A is correct. Batch update sets allow you to group multiple update sets together so they can be previewed and committed at once.' },

    { id: 'q115', type: 'single', text: 'What is the section in Report Designer used to specify groupings and calculations on data?', options: [
      { value: 'a', label: 'Style' },
      { value: 'b', label: 'Grouping' },
      { value: 'c', label: 'Configure' },
      { value: 'd', label: 'Formatting' },
      { value: 'e', label: 'Data' }
    ], correct: ['c'], discussion: 'C is correct. The Configure section in Report Designer is where you specify groupings and calculations (aggregations).' },

    { id: 'q116', type: 'single', text: 'Which module would you use to create new reports on approvals, tasks, and notifications?', options: [
      { value: 'a', label: 'Process Automation > Flow Designer' },
      { value: 'b', label: 'Process Automation > Flow Management' },
      { value: 'c', label: 'Process Automation > Workflow Editor' },
      { value: 'd', label: 'Process Automation > Process Flows' }
    ], correct: ['a'], discussion: 'A is correct. Flow Designer is used to create new automation for approvals, tasks, and notifications.' },

    { id: 'q117', type: 'single', text: 'Which module is used to access available reports in ServiceNow?', options: [
      { value: 'a', label: 'Self Service > My Reports' },
      { value: 'b', label: 'Reports > Getting Started' },
      { value: 'c', label: 'Performance Analytics > Reports' },
      { value: 'd', label: 'Self-Service > Reports' },
      { value: 'e', label: 'Reports > View/Run' }
    ], correct: ['e'], discussion: 'E is correct. Reports > View/Run lists all available reports and allows creation of new ones.' },

    { id: 'q118', type: 'single', text: 'What is the process to apply an update set to an instance?', options: [
      { value: 'a', label: 'Retrieve, Preview, Commit' },
      { value: 'b', label: 'Specify, Transform, Apply' },
      { value: 'c', label: 'Retrieve, Evaluate, Apply' },
      { value: 'd', label: 'Retrieve, Test, Push' },
      { value: 'e', label: 'Pull, Review, Push' }
    ], correct: ['a'], discussion: 'A is correct. The update set application process: Retrieve (import from source), Preview (check conflicts), Commit (apply changes).' },

    { id: 'q119', type: 'single', text: 'In which step of the spreadsheet data import process is data written to the receiving table?', options: [
      { value: 'a', label: 'Run Transform' },
      { value: 'b', label: 'Run Import' },
      { value: 'c', label: 'Import Data Set' },
      { value: 'd', label: 'Execute Transform' },
      { value: 'e', label: 'Schedule Transform' }
    ], correct: ['a'], discussion: 'A is correct. "Run Transform" is the step that moves data from the import set (staging) table to the target (receiving) table.' },

    { id: 'q120', type: 'multi', text: 'How can you group records in a list by the "Category" column? (Choose 2)', requiredCount: 2, options: [
      { value: 'a', label: 'In the list context menu, select Group By > Category' },
      { value: 'b', label: 'In the Filter menu, select Group By > Category' },
      { value: 'c', label: 'Click the group icon and select Category' },
      { value: 'd', label: 'Type "tablename.group.category" in the navigator filter' },
      { value: 'e', label: 'Right-click the Category column title and select Group By Category' }
    ], correct: ['a', 'e'], discussion: 'A and E are correct. You can group by using the list context menu or right-clicking the column header to select Group By.' },

    { id: 'q121', type: 'single', text: 'From the banner, which collaboration tool is available via the bubble icon?', options: [
      { value: 'a', label: 'Now Messenger' },
      { value: 'b', label: 'Agent Chat' },
      { value: 'c', label: 'Connect Chat' },
      { value: 'd', label: 'Now Collaboration' },
      { value: 'e', label: 'Live Feed' }
    ], correct: ['c'], discussion: 'C is correct. Connect Chat is available via the bubble icon in the banner.' },

    { id: 'q122', type: 'single', text: 'Which tab in a Knowledge Base record is used to define users who CANNOT write articles to the knowledge base?', options: [
      { value: 'a', label: 'Cannot Submit' },
      { value: 'b', label: 'Cannot Author' },
      { value: 'c', label: 'Cannot Contribute' },
      { value: 'd', label: 'Cannot Write' },
      { value: 'e', label: 'Read Only' }
    ], correct: ['c'], discussion: 'C is correct. The "Cannot Contribute" tab defines users who cannot author articles in the knowledge base.' },

    { id: 'q123', type: 'multi', text: 'Which features allow updating multiple records at once? (Choose 2)', requiredCount: 2, options: [
      { value: 'a', label: 'List Editor' },
      { value: 'b', label: 'Field Update Action' },
      { value: 'c', label: 'Bulk Record Update' },
      { value: 'd', label: 'Data Repair Dashboard' },
      { value: 'e', label: 'Update Selected Action' }
    ], correct: ['a', 'e'], discussion: 'A and E are correct. The List Editor and Update Selected action both support updating multiple records simultaneously.' },

    { id: 'q124', type: 'multi', text: 'By default, which knowledge workers can create and edit Knowledge Base categories? (Choose 2)', requiredCount: 2, options: [
      { value: 'a', label: 'Knowledge Author' },
      { value: 'b', label: 'Knowledge Contributor' },
      { value: 'c', label: 'Knowledge Controller' },
      { value: 'd', label: 'Knowledge Manager' },
      { value: 'e', label: 'Knowledge Category Admin' }
    ], correct: ['b', 'd'], discussion: 'B and D are correct. Knowledge Contributors can add/edit categories; Knowledge Managers can define available categories.' },

    { id: 'q125', type: 'single', text: 'Which collaboration tool opens a sidebar to start new conversations with other ServiceNow users?', options: [
      { value: 'a', label: 'Skype Now' },
      { value: 'b', label: 'Now Collaboration' },
      { value: 'c', label: 'Agent Messenger' },
      { value: 'd', label: 'Agent Chat' },
      { value: 'e', label: 'Connect Chat' }
