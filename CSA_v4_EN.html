    ], correct: ['e'], discussion: 'E is correct. Connect Chat opens the sidebar for conversations with other ServiceNow users.' },

    { id: 'q126', type: 'multi', text: 'Which modules can display all fields for the Incident table? (Choose 2)', requiredCount: 2, options: [
      { value: 'a', label: 'Tables and Columns' },
      { value: 'b', label: 'Dictionary' },
      { value: 'c', label: 'Data Class Manager' },
      { value: 'd', label: 'Dictionary Dashboard' },
      { value: 'e', label: 'Database View' },
      { value: 'f', label: 'Schema' }
    ], correct: ['a', 'b'], discussion: 'A and B are correct. Tables and Columns and the Dictionary module can both display all fields for a table.' },

    { id: 'q127', type: 'single', text: 'Which flow component triggers a flow after a record has been created or updated?', options: [
      { value: 'a', label: 'Date-based trigger' },
      { value: 'b', label: 'Changed trigger' },
      { value: 'c', label: 'Record-based trigger' },
      { value: 'd', label: 'Application-based trigger' }
    ], correct: ['c'], discussion: 'C is correct. Record-based triggers fire when a record is created or updated.' },

    { id: 'q128', type: 'single', text: 'Which type of field is Boolean and displays as a checkbox?', options: [
      { value: 'a', label: 'Yes/No' },
      { value: 'b', label: 'True/False' },
      { value: 'c', label: 'On/Off' },
      { value: 'd', label: 'Binary' }
    ], correct: ['b'], discussion: 'B is correct. The True/False field type is Boolean and displays as a checkbox.' },

    { id: 'q129', type: 'single', text: 'What is the primary difference between Performance Analytics and Reports?', options: [
      { value: 'a', label: 'Performance Analytics includes snapshots of data over time; Reports show data only at the time the report is run' },
      { value: 'b', label: 'Performance Analytics can show trends but Reports cannot' },
      { value: 'c', label: 'Reports can be scheduled but Performance Analytics cannot' },
      { value: 'd', label: 'Performance Analytics can be published to dashboards but Reports cannot' }
    ], correct: ['a'], discussion: 'A is correct. Performance Analytics captures periodic data snapshots to generate accurate historical trends, while Reports show a point-in-time view.' },

    { id: 'q130', type: 'single', text: 'A customer wants to change Priority field labels from "1-Critical" to "P1, P2, P3, P4" for all tasks. After right-clicking the Priority field, what do you select?', options: [
      { value: 'a', label: 'Configure List' },
      { value: 'b', label: 'Show Options' },
      { value: 'c', label: 'Configure Tasks' },
      { value: 'd', label: 'Show Choices' },
      { value: 'e', label: 'Show Choice List' },
      { value: 'f', label: 'Configure Options' }
    ], correct: ['e'], discussion: 'E is correct. Right-clicking the Priority field and selecting "Show Choice List" opens the list of defined choices where you can edit the labels.' },

    { id: 'q131', type: 'single', text: 'When designing a flow, how do you reference data from a record within the flow?', options: [
      { value: 'a', label: 'Drag the table icon into the flow definition' },
      { value: 'b', label: 'Use the condition builder to specify the required values' },
      { value: 'c', label: 'Specify the source table in the data pill related list' },
      { value: 'd', label: 'Drag a data pill into the flow definition' },
      { value: 'e', label: 'Use the slash bucket to add a table reference' }
    ], correct: ['d'], discussion: 'D is correct. Data pills are dragged into the flow definition to reference data from records.' },

    { id: 'q132', type: 'multi', text: 'In the Report page, which sections show reports for different user audiences? (Choose 4)', requiredCount: 4, options: [
      { value: 'a', label: 'Group' },
      { value: 'b', label: 'Department' },
      { value: 'c', label: 'My Reports' },
      { value: 'd', label: 'Team' },
      { value: 'e', label: 'Dashboard' },
      { value: 'f', label: 'Global' },
      { value: 'g', label: 'Administration' },
      { value: 'h', label: 'Analytics' },
      { value: 'i', label: 'All' },
      { value: 'j', label: 'Company' }
    ], correct: ['a', 'c', 'f', 'i'], discussion: 'A, C, F, and I are correct. The Reports > View/Run page has four sections: My Reports, Group, Global, and All.' },

    { id: 'q133', type: 'single', text: 'Which tool is used to define the field relationship between an import set table and a target table?', options: [
      { value: 'a', label: 'Transform Schema' },
      { value: 'b', label: 'Schema Map' },
      { value: 'c', label: 'Dictionary Map' },
      { value: 'd', label: 'Transform Map' },
      { value: 'e', label: 'Field Transform Tool' },
      { value: 'f', label: 'Import Designer' }
    ], correct: ['d'], discussion: 'D is correct. A Transform Map defines the field relationships between the import set (staging) table and the target table.' },

    { id: 'q134', type: 'single', text: 'Which ServiceNow feature helps users get information, make decisions, and complete common work tasks through a messaging interface?', options: [
      { value: 'a', label: 'Agent Workspace' },
      { value: 'b', label: 'Chatbot' },
      { value: 'c', label: 'Virtual Agent' },
      { value: 'd', label: 'Knowledge Chat' },
      { value: 'e', label: 'Now Support' }
    ], correct: ['c'], discussion: 'C is correct. Virtual Agent is a conversational platform that helps users get information, make decisions, and perform common tasks through a messaging interface.' },

    { id: 'q135', type: 'single', text: 'Which feature can automate business logic (approvals, task notifications, record operations) for specific applications or processes?', options: [
      { value: 'a', label: 'Flows' },
      { value: 'b', label: 'Action Sequences' },
      { value: 'c', label: 'Action Sets' },
      { value: 'd', label: 'Task Flows' },
      { value: 'e', label: 'Flow Diagrams' }
    ], correct: ['a'], discussion: 'A is correct. Flows (in Flow Designer) automate business logic including approvals, notifications, and record operations.' },

    { id: 'q136', type: 'multi', text: 'From a form, where can you click to add additional fields? (Choose 2)', requiredCount: 2, options: [
      { value: 'a', label: 'Context Menu > Form > Layout' },
      { value: 'b', label: 'Context Menu > Configure > Form Layout' },
      { value: 'c', label: 'Context Menu > Configure > Form Design' },
      { value: 'd', label: 'Right-click header > Add > Field' },
      { value: 'e', label: 'Context Menu > Form > Designer' },
      { value: 'f', label: 'Right-click header > Configure > UX Dashboard' }
    ], correct: ['b', 'c'], discussion: 'B and C are correct. Additional fields can be added via Context Menu > Configure > Form Layout or Configure > Form Design.' },

    { id: 'q137', type: 'single', text: 'Which module is used to customize the banner image, text, and colors of the platform?', options: [
      { value: 'a', label: 'System UI > UI Pages > Branding' },
      { value: 'b', label: 'Service Portal > Portals > Branding' },
      { value: 'c', label: 'System Properties > Basic Configuration UI16' },
      { value: 'd', label: 'System Properties > Branding' },
      { value: 'e', label: 'Homepage Administration > Pages > Branding' }
    ], correct: ['c'], discussion: 'C is correct. System Properties > Basic Configuration UI16 is used to customize the banner image, text, and colors.' },

    { id: 'q138', type: 'single', text: 'Which database provides a logical model of enterprise infrastructure by identifying, controlling, maintaining, and verifying CIs?', options: [
      { value: 'a', label: 'IMDB' },
      { value: 'b', label: 'ITSM' },
      { value: 'c', label: 'CSDM' },
      { value: 'd', label: 'CMDB' },
      { value: 'e', label: 'LDAP' }
    ], correct: ['d'], discussion: 'D is correct. The CMDB (Configuration Management Database) provides a logical model of enterprise infrastructure.' },

    { id: 'q139', type: 'single', text: 'Which module is used as the first step in the data import process?', options: [
      { value: 'a', label: 'Data Integration' },
      { value: 'b', label: 'Data Transform' },
      { value: 'c', label: 'Data Import' },
      { value: 'd', label: 'Load Data' }
    ], correct: ['d'], discussion: 'D is correct. "Load Data" is the first step in the import process, staging the data in an import set table.' },

    { id: 'q140', type: 'single', text: 'When there is little technical knowledge available, which utility would you use to orchestrate business processes across services?', options: [
      { value: 'a', label: 'Flow Manager' },
      { value: 'b', label: 'Flow Designer' },
      { value: 'c', label: 'Flow Editor' },
      { value: 'd', label: 'Workflow Editor' },
      { value: 'e', label: 'Workflow Designer' }
    ], correct: ['b'], discussion: 'B is correct. Flow Designer provides a low-code interface suitable for users with limited technical knowledge to orchestrate business processes.' },

    { id: 'q141', type: 'single', text: 'When a user reports that a module does not appear in the Application Navigator, how do you check what modules that user sees?', options: [
      { value: 'a', label: 'Check the user\'s password and log in with their account' },
      { value: 'b', label: 'Start a Connect Chat session' },
      { value: 'c', label: 'Install the Bomgar plugin' },
      { value: 'd', label: 'Impersonate the user' },
      { value: 'e', label: 'Launch a NowChat window' }
    ], correct: ['d'], discussion: 'D is correct. Impersonating the user allows you to see exactly what they see in the platform.' },

    { id: 'q142', type: 'single', text: 'What is the primary difference between Performance Analytics and Reporting?', options: [
      { value: 'a', label: 'Performance Analytics contains snapshots of data over time; Reports show current data only' },
      { value: 'b', label: 'Performance Analytics can show trends; Reports cannot' },
      { value: 'c', label: 'Reports can be scheduled; Performance Analytics cannot' },
      { value: 'd', label: 'Performance Analytics KPIs can be shown; Reports cannot show KPIs' }
    ], correct: ['a'], discussion: 'A is correct. Performance Analytics captures historical snapshots over time; reports show current/real-time data.' },

    { id: 'q143', type: 'single', text: 'Which steps are used to import data using Import Sets? (Correct order)', options: [
      { value: 'a', label: 'Select source file; run auto-mapping; transform data; clean up target table' },
      { value: 'b', label: 'Identify source; import transform map; run transformer; validate import' },
      { value: 'c', label: 'Configure LDAP; test map; create update set; run import; apply update set' },
      { value: 'd', label: 'Load data; create transform map; transform data; clean up import table' }
    ], correct: ['d'], discussion: 'D is correct. The import set process: Load Data (stage data) > Create Transform Map (define field mappings) > Transform Data (move to target table) > Clean up import table.' },

    { id: 'q144', type: 'single', text: 'Which type of script runs in the browser?', options: [
      { value: 'a', label: 'Script Include scripts' },
      { value: 'b', label: 'Access Control scripts' },
      { value: 'c', label: 'Business Rule scripts' },
      { value: 'd', label: 'UI Policies and Client Scripts' }
    ], correct: ['d'], discussion: 'D is correct. UI Policies and Client Scripts are client-side scripts that run in the browser.' },

    { id: 'q145', type: 'multi', text: 'Which two modules can you use to create a new table? (Choose 2)', requiredCount: 2, options: [
      { value: 'a', label: 'Dictionary' },
      { value: 'b', label: 'Schema Map' },
      { value: 'c', label: 'Tables' },
      { value: 'd', label: 'Tables and Columns' }
    ], correct: ['c', 'd'], discussion: 'C and D are correct. New tables can be created from the Tables module or the Tables and Columns module.' },

    { id: 'q146', type: 'single', text: 'Which of the following describes the primary operations on tables in the ServiceNow platform?', options: [
      { value: 'a', label: 'Create, Read, Upload, Delete' },
      { value: 'b', label: 'Capture, Evaluate, Write, Develop' },
      { value: 'c', label: 'Create, Evaluate, Update, Delete' },
      { value: 'd', label: 'Create, Read, Write, Delete' }
    ], correct: ['d'], discussion: 'D is correct. In ServiceNow, the operations are Create, Read, Write (not Update), Delete — sometimes called CRWD. "Write" is used instead of "Update" in the ACL context.' },

    { id: 'q147', type: 'single', text: 'How is a user defined in ServiceNow?', options: [
      { value: 'a', label: 'A user is a record stored in the [sys_user_profile] profile table' },
      { value: 'b', label: 'A user is a record stored in the User [sys_user] table' },
      { value: 'c', label: 'A user is a record stored in the User Preference [sys_user_preference] table' },
      { value: 'd', label: 'A user is a field in an LDAP integration' }
    ], correct: ['b'], discussion: 'B is correct. Users in ServiceNow are records stored in the User [sys_user] table.' },

    { id: 'q148', type: 'single', text: 'Which ServiceNow utility provides a service desk agent with the ability to track which CIs supporting a service have active problems?', options: [
      { value: 'a', label: 'CI Dependency View' },
      { value: 'b', label: 'Event Management Homepage' },
      { value: 'c', label: 'Service Dashboard' },
      { value: 'd', label: 'CI Health Dashboard' }
    ], correct: ['a'], discussion: 'A is correct. The CI Dependency View allows service desk agents to track which CIs supporting a service have active problems.' },

    { id: 'q149', type: 'single', text: 'To use Flow Designer to reference record data within a flow, how do you do it?', options: [
      { value: 'a', label: 'Drag the table icon into the flow definition' },
      { value: 'b', label: 'Use the condition builder' },
      { value: 'c', label: 'Specify the source table in the data pill' },
      { value: 'd', label: 'Drag a data pill into the flow definition' }
    ], correct: ['d'], discussion: 'D is correct. Data pills are dragged into the flow definition to reference specific record data.' },

    { id: 'q150', type: 'single', text: 'Which instance resource provides access to guided tours, information about actions, and instructions on using inputs and outputs in a flow?', options: [
      { value: 'a', label: 'Documentation' },
      { value: 'b', label: 'Community' },
      { value: 'c', label: 'Help Panel (question mark icon)' },
      { value: 'd', label: 'Wiki' }
    ], correct: ['c'], discussion: 'C is correct. The Help Panel (question mark icon) provides guided tours, action information, and instructions on using inputs and outputs within flows.' },

    { id: 'q151', type: 'single', text: 'What are the four benefits of assigning work tasks to a group rather than an individual? (Choose 4)', requiredCount: 4, options: [
      { value: 'a', label: 'Group members can select their own tasks from "My Group\'s Work"' },
      { value: 'b', label: 'Groups can assign tasks to users based on on-call schedules' },
      { value: 'c', label: 'Site support members can select tasks based on location' },
      { value: 'd', label: 'Groups can assign tasks to users based on skills' },
      { value: 'e', label: 'Group members can avoid tasks with approaching SLA breaches' },
      { value: 'f', label: 'Groups can assign tasks to users based on availability' }
    ], correct: ['a', 'b', 'd', 'f'], discussion: 'A, B, D, and F are correct. Benefits of group assignment: members can select from My Group\'s Work, tasks can be assigned based on on-call schedules, skills, and availability.' },

    { id: 'q152', type: 'single', text: 'Which ServiceNow feature allows you to include data from secondary related tables in a report?', options: [
      { value: 'a', label: 'SQL' },
      { value: 'b', label: 'Dot-walking' },
      { value: 'c', label: 'Outer Join' },
      { value: 'd', label: 'Join' }
    ], correct: ['b'], discussion: 'B is correct. Dot-walking allows you to traverse reference fields to access data from related tables in reports and other contexts.' },

    { id: 'q153', type: 'single', text: 'Which attributes can be managed using System Properties > Basic Configuration UI16? (Choose 5)', requiredCount: 5, options: [
      { value: 'a', label: 'Browser tab title' },
      { value: 'b', label: 'Module text color' },
      { value: 'c', label: 'Recommended browser' },
      { value: 'd', label: 'Base theme' },

      { value: 'f', label: 'Animation style' },
      { value: 'g', label: 'Header background color' },
      { value: 'h', label: 'Banner image' }
    ], correct: ['a', 'd', 'f', 'g', 'h'], discussion: 'A, D, F, G, and H are correct. UI16 Basic Configuration manages: Browser tab title, Base theme, Animation style, Header background color, and Banner image.' },

    { id: 'q154', type: 'single', text: 'A service catalog option is needed so users can click "Get Help" and describe their issue, which then creates an Incident and routes it to the service desk. Which method should you use?', options: [
      { value: 'a', label: 'Record Producer' },
      { value: 'b', label: 'Create a Catalog Item' },
      { value: 'c', label: 'Create an Order Guide' },
      { value: 'd', label: 'Create a Content Item' }
    ], correct: ['a'], discussion: 'A is correct. A Record Producer creates task-based records (like Incidents) through the Service Catalog interface.' },

    { id: 'q155', type: 'single', text: 'What is the result of the ACL evaluation order?', options: [
      { value: 'a', label: 'Ensures the user has field access before table access is considered' },
      { value: 'b', label: 'Ensures users can start working as quickly as possible' },
      { value: 'c', label: 'Ensures the user has application access before evaluating module access' },
      { value: 'd', label: 'Ensures the user has table access before evaluating field access' }
    ], correct: ['d'], discussion: 'D is correct. ACL evaluation checks table-level access first, then field-level access (from most specific to most general at each level).' },

    { id: 'q156', type: 'single', text: 'Which tool graphically displays a CI and its relationships with other CIs?', options: [
      { value: 'a', label: 'Schema Map' },
      { value: 'b', label: 'Dependency View' },
      { value: 'c', label: 'Dependency Map' },
      { value: 'd', label: 'Database View' }
    ], correct: ['b'], discussion: 'B is correct. The Dependency View graphically displays a CI and its relationships with other CIs in the infrastructure.' },

    { id: 'q157', type: 'single', text: 'What are examples of core tables in the ServiceNow platform?', options: [
      { value: 'a', label: 'Configuration, Connection, Chat' },
      { value: 'b', label: 'Team, Party, Recognition' },
      { value: 'c', label: 'User, Task, Incident' },
      { value: 'd', label: 'Work, Caller, Timecard' }
    ], correct: ['c'], discussion: 'C is correct. User, Task, and Incident are examples of core tables in ServiceNow.' },

    { id: 'q158', type: 'single', text: 'Which tab in the Knowledge Base record identifies the set of users who can read articles in that knowledge base?', options: [
      { value: 'a', label: 'Access List' },
      { value: 'b', label: 'Can Access' },
      { value: 'c', label: 'Accessible' },
      { value: 'd', label: 'Can Read' }
    ], correct: ['d'], discussion: 'D is correct. The "Can Read" tab in the Knowledge Base record defines which users can read articles in that knowledge base.' },

    { id: 'q159', type: 'multi', text: 'What are the main components of the Form Design interface? (Choose 3)', requiredCount: 3, options: [
      { value: 'a', label: 'Field Layout' },
      { value: 'b', label: 'Page Header' },
      { value: 'c', label: 'Field Navigator' },
      { value: 'd', label: 'Field Picker' },
      { value: 'e', label: 'Form Layout' }
    ], correct: ['b', 'c', 'e'], discussion: 'B, C, and E are correct. The Form Design interface consists of: Page Header, Field Navigator, and Form Layout.' },

    { id: 'q160', type: 'single', text: 'What is used to determine user access to a Knowledge Base or Knowledge Articles?', options: [
      { value: 'a', label: 'sn_kb_read, sn_article_read' },
      { value: 'b', label: 'Privacy settings' },
      { value: 'c', label: 'Read access flag' },
      { value: 'd', label: 'User Criteria' }
    ], correct: ['d'], discussion: 'D is correct. User Criteria determines who can access Knowledge Bases and Knowledge Articles.' },

    { id: 'q161', type: 'multi', text: 'What are the three primary tables in the Enterprise CMDB? (Choose 3)', requiredCount: 3, options: [
      { value: 'a', label: 'cmdb' },
      { value: 'b', label: 'sn_cmdb_bak' },
      { value: 'c', label: 'cmdb_rel_ci' },
      { value: 'd', label: 'sn_cmdb' },
      { value: 'e', label: 'cmdb_bak' },
      { value: 'f', label: 'cmdb_ci' },
      { value: 'g', label: 'sn_cmdb_ci' }
    ], correct: ['a', 'c', 'f'], discussion: 'A, C, and F are correct. The three primary CMDB tables are: cmdb, cmdb_rel_ci (CI Relationships), and cmdb_ci (Configuration Items).' },

    { id: 'q162', type: 'single', text: 'What is the best practice regarding the Default update set when moving customizations between instances?', options: [
      { value: 'a', label: 'Merge the default update set before moving it between instances' },
      { value: 'b', label: 'Submit the default update set to the application repository' },
      { value: 'c', label: 'Do not use the Default update set to move customizations between instances' },
      { value: 'd', label: 'Limit the Default update set to a maximum of 20 records for troubleshooting' }
    ], correct: ['c'], discussion: 'C is correct. The Default update set should NOT be used to move customizations between instances. Named update sets should be used instead.' },

    { id: 'q163', type: 'single', text: 'Where in a ServiceNow instance can you find the "Impersonate User" option?', options: [
      { value: 'a', label: 'Modules' },
      { value: 'b', label: 'Content Frame' },
      { value: 'c', label: 'Application Navigator' },
      { value: 'd', label: 'Banner' }
    ], correct: ['d'], discussion: 'D is correct. The "Impersonate User" option is found in the Banner area (via the user avatar/menu).' },

    { id: 'q164', type: 'single', text: 'If a knowledge base has no access details specified, which users can read articles in that knowledge base?', options: [
      { value: 'a', label: 'ITIL users' },
      { value: 'b', label: 'All users with the article permalink' },
      { value: 'c', label: 'All active users' },
      { value: 'd', label: 'No users' },
      { value: 'e', label: 'Users with the kb_user role' }
    ], correct: ['c'], discussion: 'C is correct. If no access details are specified for a knowledge base, all active users can read the articles in it.' },

    { id: 'q165', type: 'single', text: 'To allow ITIL users to create Incident records, how should an access control be defined?', options: [
      { value: 'a', label: 'Name: incident.None; Operation: create; Role: itil' },
      { value: 'b', label: 'Name: incident.Any; Operation: write; Permission: itil' },
      { value: 'c', label: 'Name: incident:*; Permission: write; Role: itil' },
      { value: 'd', label: 'Name: incident.None; Permission: create; Role: itil' },
      { value: 'e', label: 'Name: incident:*; Operation: write; Permission: itil' }
    ], correct: ['a'], discussion: 'A is correct. The ACL definition: Name: incident.None (table-level, no specific field); Operation: create; Role: itil.' },

    { id: 'q166', type: 'single', text: 'Which Service Catalog feature is used to organize items into logical groups?', options: [
      { value: 'a', label: 'Categories' },
      { value: 'b', label: 'Variable Sets' },
      { value: 'c', label: 'Sections' },
      { value: 'd', label: 'Catalog Items' }
    ], correct: ['a'], discussion: 'A is correct. Categories are used in the Service Catalog to organize items into logical groups.' },

    { id: 'q167', type: 'multi', text: 'Which three workflows are built into the ServiceNow platform? (Choose 3)', requiredCount: 3, options: [
      { value: 'a', label: 'Federal Workflows' },
      { value: 'b', label: 'Customer Workflows' },
      { value: 'c', label: 'Infrastructure Workflows' },
      { value: 'd', label: 'Manufacturing Workflows' },
      { value: 'e', label: 'Employee Workflows' },
      { value: 'f', label: 'IT Workflows' }
    ], correct: ['b', 'e', 'f'], discussion: 'B, E, and F are correct. ServiceNow\'s built-in workflow categories are: Customer Workflows, Employee Workflows, and IT Workflows.' },

    { id: 'q168', type: 'single', text: 'An IT manager is responsible for the Network and Hardware assignment groups (5 members each). Tasks are not showing in Service Desk > My Group Work. What is likely the cause?', options: [
      { value: 'a', label: 'The "Manager" field on the assignment groups is blank' },
      { value: 'b', label: 'The manager does not have the ITIL role' },
      { value: 'c', label: 'The manager is not a member of the Service Desk group' },
      { value: 'd', label: 'The manager is not a member of the Network and Hardware groups' }
    ], correct: ['d'], discussion: 'D is correct. "My Group Work" shows unassigned tasks for groups the user is a member of. If the manager isn\'t a member of the Network and Hardware groups, those tasks won\'t appear.' },

    { id: 'q169', type: 'multi', text: 'An employee needs to order a tablet and select standard accessory options. What approach do you take? (Choose 3)', requiredCount: 3, options: [
      { value: 'a', label: 'Create a catalog item for the tablet and add a variable set for the accessory options' },
      { value: 'b', label: 'Create a record producer with checkbox variables for each accessory' },
      { value: 'c', label: 'Select the option to show an "Add Accessories" button in shopping cart settings' },
      { value: 'd', label: 'Create separate catalog items for the tablet, case, cleaner, stand, and protector' },
      { value: 'e', label: 'Create a catalog item for the tablet and add checkbox variables for each accessory' }
    ], correct: ['a', 'd', 'e'], discussion: 'A, D, and E are correct. Valid approaches include creating a tablet catalog item with a variable set (A), with checkbox variables (E), or creating individual catalog items for each option (D).' },

    { id: 'q170', type: 'single', text: 'Which ServiceNow utility provides the most current interactive graphical interface to visualize CIs and their relationships?', options: [
      { value: 'a', label: 'Dependency View' },
      { value: 'b', label: 'CI Class Map' },
      { value: 'c', label: 'Business Service Map' },
      { value: 'd', label: 'CSDM Schema' }
    ], correct: ['a'], discussion: 'A is correct. The Dependency View provides the most current interactive graphical interface for visualizing CIs and their relationships (built on D3 and Angular).' },

    { id: 'q171', type: 'single', text: 'What is a group in ServiceNow?', options: [
      { value: 'a', label: 'A collection of subject matter experts (SMEs)' },
      { value: 'b', label: 'A team of users' },
      { value: 'c', label: 'An escalation pod' },
      { value: 'd', label: 'A collection of users' },
      { value: 'e', label: 'A department' }
    ], correct: ['d'], discussion: 'D is correct. A group is a collection of users. Users can belong to multiple groups across different teams or departments.' },

    { id: 'q172', type: 'multi', text: 'In the Report page, which sections show reports for different audiences? (Choose 4)', requiredCount: 4, options: [
      { value: 'a', label: 'Group' },
      { value: 'b', label: 'Department' },
      { value: 'c', label: 'My Reports' },
      { value: 'd', label: 'Team' },
      { value: 'e', label: 'Global' },
      { value: 'f', label: 'All' }
    ], correct: ['a', 'c', 'e', 'f'], discussion: 'A, C, E, and F are correct. The report visibility sections are: My Reports, Group, Global, and All.' },

    { id: 'q173', type: 'single', text: 'A filter condition has elements based on a table, the user\'s access rights, and the table\'s columns. What are these elements called?', options: [
      { value: 'a', label: 'Labels' },

    { id: 'q174', type: 'single', text: 'A user needs to order a new iPhone with 2-level approval, and both approver and user should be notified automatically at each approval stage. Which feature manages approvals and notifications?', options: [
      { value: 'a', label: 'Approval Chain' },
      { value: 'b', label: 'Flow' },
      { value: 'c', label: 'Approver Delegate' },
      { value: 'd', label: 'Parent-Child Approver' },
      { value: 'e', label: 'Approval Criteria' }
    ], correct: ['b'], discussion: 'B is correct. A Flow (in Flow Designer) manages multi-stage approvals and automated notifications at each stage.' },

    { id: 'q175', type: 'single', text: 'Which table do groups get stored in?', options: [
      { value: 'a', label: 'User Groups [user_groups]' },
      { value: 'b', label: 'Groups [sys_user_groups]' },
      { value: 'c', label: 'Groups [sn_sys_user_group]' },
      { value: 'd', label: 'Groups [sys_user_group]' },
      { value: 'e', label: 'User Groups [sn_user_groups]' }
    ], correct: ['d'], discussion: 'D is correct. Groups are stored in the Groups [sys_user_group] table.' },

    { id: 'q176', type: 'multi', text: 'When managing tags, what visibility options are available? (Choose 3)', requiredCount: 3, options: [
      { value: 'a', label: 'Groups and users' },
      { value: 'b', label: 'Me' },
      { value: 'c', label: 'Roles and permissions' },
      { value: 'd', label: 'Everyone' },
      { value: 'e', label: 'Admins' }
    ], correct: ['a', 'b', 'd'], discussion: 'A, B, and D are correct. Tag visibility options are: Groups and Users, Me (just yourself), and Everyone.' },

    { id: 'q177', type: 'single', text: 'Which module allows an administrator to define where imported data from any ServiceNow table is stored?', options: [
      { value: 'a', label: 'Field Transform' },
      { value: 'b', label: 'Schema Map' },
      { value: 'c', label: 'Transform Map' },
      { value: 'd', label: 'Import Map' }
    ], correct: ['c'], discussion: 'C is correct. The Transform Map module allows administrators to define where imported data goes in the target table.' },

    { id: 'q178', type: 'single', text: 'Which icon on the form header is used to access form templates?', options: [
      { value: 'a', label: 'Stamp' },
      { value: 'b', label: 'Page' },
      { value: 'c', label: 'More Options (...)' },
      { value: 'd', label: 'Clip' }
    ], correct: ['c'], discussion: 'C is correct. The More Options (...) icon in the form header is used to access form templates (via Toggle Template Bar).' },

    { id: 'q179', type: 'single', text: 'When using the Data Pill Picker, which key is used to dot-walk to fields in other tables?', options: [
      { value: 'a', label: 'Plus, Minus' },
      { value: 'b', label: 'Ctrl <, Ctrl >' },
      { value: 'c', label: 'Arrow keys' },
      { value: 'd', label: 'Ctrl C, Ctrl V' },
      { value: 'e', label: 'Shift F4, Shift F5' }
    ], correct: ['c'], discussion: 'C is correct. Arrow keys are used to dot-walk to fields in other tables when using the Data Pill Picker.' },

    { id: 'q180', type: 'single', text: 'In what order are access controls evaluated?', options: [
      { value: 'a', label: 'Field level (most specific to most general); then Table level (most specific to most general)' },
      { value: 'b', label: 'Field level (most general to most specific); then Row level (most specific to most general)' },
      { value: 'c', label: 'Table level (most specific to most general); then Field level (most specific to most general)' },
      { value: 'd', label: 'Table level (most specific to most general); then Record level (most specific to most general)' }
    ], correct: ['c'], discussion: 'C is correct. Access controls are evaluated: Table level first (most specific to most general), then Field level (most specific to most general).' },

    { id: 'q181', type: 'single', text: 'Which instance resource provides access to guided tours, action information, and instructions about inputs and outputs within a flow?', options: [
      { value: 'a', label: 'Documentation' },
      { value: 'b', label: 'Community' },
      { value: 'c', label: 'Help Panel (question mark icon)' },
      { value: 'd', label: 'Wiki' }
    ], correct: ['c'], discussion: 'C is correct. The Help Panel provides guided tours and contextual help within Flow Designer.' },

    { id: 'q182', type: 'single', text: 'Which section of Report Designer specifies the report name and table/data source?', options: [
      { value: 'a', label: 'Style' },
      { value: 'b', label: 'Grouping' },
      { value: 'c', label: 'Configure' },
      { value: 'd', label: 'Source' },
      { value: 'e', label: 'Data' }
    ], correct: ['e'], discussion: 'E is correct. The Data section is the first tab in Report Designer, where you enter the report name and select the data source (table).' },

    { id: 'q183', type: 'single', text: 'To display a "Save" button on the form header, what action do you need to take?', options: [
      { value: 'a', label: 'Context Menu > Form Design > Add Save button' },
      { value: 'b', label: 'All > System Properties > UI Properties > Enable the glide.ui.advanced property' },
      { value: 'c', label: 'All > System Properties > UI Properties > Enable Save button' },
      { value: 'd', label: 'Context Menu > Form Layout > Add Save button' }
    ], correct: ['c'], discussion: 'C is correct. Enable the Save button through System Properties > UI Properties. The underlying property is glide.ui.advanced.' },

    { id: 'q184', type: 'single', text: 'Which ensures data integrity when importing data via Import Sets and Web Services?', options: [
      { value: 'a', label: 'UI Policy' },
      { value: 'b', label: 'Data Policy' },
      { value: 'c', label: 'Business Rule' },
      { value: 'd', label: 'Client Script' },
      { value: 'e', label: 'CSDM' }
    ], correct: ['b'], discussion: 'B is correct. Data Policies apply to all data entering the platform regardless of source, including Import Sets and Web Services.' },

    { id: 'q185', type: 'single', text: 'What initiates the execution of a flow in Flow Designer?', options: [
      { value: 'a', label: 'Flow Logic' },
      { value: 'b', label: 'An existing subflow' },
      { value: 'c', label: 'An execution data pill' },
      { value: 'd', label: 'A trigger' }
    ], correct: ['d'], discussion: 'D is correct. Triggers initiate the execution of flows in Flow Designer.' },

    { id: 'q186', type: 'single', text: 'What is the string that displays filter conditions called?', options: [
      { value: 'a', label: 'Breadcrumb' },
      { value: 'b', label: 'Selection' },
      { value: 'c', label: 'Menu' },
      { value: 'd', label: 'Topic' }
    ], correct: ['a'], discussion: 'A is correct. The Breadcrumb is the string that displays the active filter conditions in a list view.' },

    { id: 'q187', type: 'single', text: 'Which system property is set to true to log impersonation events?', options: [
      { value: 'a', label: 'glide.sys.all_impersonation' },
      { value: 'b', label: 'glide.user_setting' },
      { value: 'c', label: 'glide.sys.log_impersonation' },
      { value: 'd', label: 'glide.sys.admin_login' }
    ], correct: ['c'], discussion: 'C is correct. Setting glide.sys.log_impersonation to true enables logging of impersonation events in the system log.' },

    { id: 'q188', type: 'single', text: 'What process enables users to create, categorize, review, approve, and view important information in a centralized shared location?', options: [
      { value: 'a', label: 'Self-Service Administration' },
      { value: 'b', label: 'Knowledge Management' },
      { value: 'c', label: 'Business Information Management' },
      { value: 'd', label: 'Information Portal Administration' },
      { value: 'e', label: 'Knowledge-Centered Administration' }
    ], correct: ['b'], discussion: 'B is correct. Knowledge Management enables creation, categorization, review, approval, and viewing of important information in a centralized location.' },

    { id: 'q189', type: 'single', text: 'A colleague wants to rearrange columns in their My Work list. Where do they go after navigating to the list?', options: [
      { value: 'a', label: 'Right-click any column header, then Context Menu > Configure > List Layout' },
      { value: 'b', label: 'Click the list context menu > Configure > List Layout' },
      { value: 'c', label: 'Click the list context menu > Personalize List' },
      { value: 'd', label: 'Click Personalize List (gear icon)' }
    ], correct: ['d'], discussion: 'D is correct. The gear icon (Personalize List) allows individual users to rearrange and select columns for their personal view without affecting other users.' },

    { id: 'q190', type: 'single', text: 'You are viewing active incidents and want to exclude "Resolved" state incidents. What do you do?', options: [
      { value: 'a', label: 'In the search, select State and type "not Resolved" then press Enter' },
      { value: 'b', label: 'Right-click State column title and select Exclude Filter > Resolved' },
      { value: 'c', label: 'Right-click the "Resolved" value in the list and select "Exclude"' },
      { value: 'd', label: 'Right-click the "Resolved" value and select "Filter Out"' }
    ], correct: ['c'], discussion: 'C is correct. Right-clicking a value in the list and selecting "Exclude" filters out records with that value.' },

    { id: 'q191', type: 'single', text: 'Which role inherits all permissions from the catalog role and user_criteria_admin role, plus has permission to create items and services?', options: [
      { value: 'a', label: 'System Administrator [sys_admin]' },
      { value: 'b', label: 'Catalog Admin [catalog_admin]' },
      { value: 'c', label: 'Catalog Writer [sn_catalog_write]' },
      { value: 'd', label: 'Item Admin [sn_item_admin]' }
    ], correct: ['b'], discussion: 'B is correct. The catalog_admin role inherits from catalog and user_criteria_admin roles, and also allows creating items and services.' },

    { id: 'q192', type: 'single', text: 'Which ServiceNow infrastructure component defines all tables and fields in the system?', options: [
      { value: 'a', label: 'Schema' },
      { value: 'b', label: 'Field Map' },
      { value: 'c', label: 'Table Class Manager' },
      { value: 'd', label: 'Dictionary' },
      { value: 'e', label: 'Data Atlas' }
    ], correct: ['d'], discussion: 'D is correct. The Dictionary defines all tables and fields in the ServiceNow system.' },

    { id: 'q193', type: 'multi', text: 'Which data integrity settings can be achieved using UI Policies? (Choose 3)', requiredCount: 3, options: [
      { value: 'a', label: 'Set a field to accept data in an expected format' },
      { value: 'b', label: 'Set a field to accept data of N number of characters' },
      { value: 'c', label: 'Set a field to hidden' },
      { value: 'd', label: 'Set a field to read-only' },
      { value: 'e', label: 'Set a field to mandatory' }
    ], correct: ['c', 'd', 'e'], discussion: 'C, D, and E are correct. UI Policies can control: field visibility (hidden), read-only status, and mandatory status.' },

    { id: 'q194', type: 'single', text: 'To validate submission data on a form using a client script, which type would you recommend?', options: [
      { value: 'a', label: 'onSubmit()' },
      { value: 'b', label: 'onSubmission()' },
      { value: 'c', label: 'onUpdate()' },
      { value: 'd', label: 'onLoad()' }
    ], correct: ['a'], discussion: 'A is correct. The onSubmit() client script type runs when a form is submitted, allowing validation before the record is saved.' },

    { id: 'q195', type: 'multi', text: 'An order was placed from the Service Catalog, creating two records. Which two records are associated? (Choose 2)', requiredCount: 2, options: [
      { value: 'a', label: 'A record in the sc_req_item table' },
      { value: 'b', label: 'An sc_task record' },
      { value: 'c', label: 'An Incident record' },
      { value: 'd', label: 'A Change record' },
      { value: 'e', label: 'A Problem record' }
    ], correct: ['a', 'b'], discussion: 'A and B are correct. A catalog order creates an RITM (sc_req_item) and may create SCTASKs (sc_task) through the workflow.' },

    { id: 'q196', type: 'single', text: 'To customize column layout in a list, which action do you perform?', options: [
      { value: 'a', label: 'Context Menu > View > Customize' },
      { value: 'b', label: 'Click gear icon > Personalize window options > Select appropriate columns' },
      { value: 'c', label: 'Select a column and choose customize on the right side of the header' },
      { value: 'd', label: 'Select column, click the pencil icon, and choose customize option' }
    ], correct: ['b'], discussion: 'B is correct. Click the gear icon (Personalize List) and select the columns you want to display.' },

    { id: 'q197', type: 'single', text: 'After a new office equipment order via Service Catalog, how do you view the list of requests?', options: [
      { value: 'a', label: 'All > Tables and Columns > Task' },
      { value: 'b', label: 'Type "requests.list" in the navigation filter' },
      { value: 'c', label: 'All > Service Catalog > Requests' },
      { value: 'd', label: 'All > Service Catalog > Open Records > Items' }
    ], correct: ['d'], discussion: 'D is correct. Navigate to All > Service Catalog > Open Records > Items to view the RITM records with their associated REQ details.' },

    { id: 'q198', type: 'single', text: 'To access the table configuration page from a form, which path do you select?', options: [
      { value: 'a', label: 'Form Context Menu > View > Show Table' },
      { value: 'b', label: 'Form Context Menu > View > Table' },
      { value: 'c', label: 'Form Context Menu > Configure > Dictionary' },
      { value: 'd', label: 'Form Context Menu > Configure > Table' }
    ], correct: ['d'], discussion: 'D is correct. Context Menu > Configure > Table accesses the table configuration page from a form.' },

    { id: 'q199', type: 'single', text: 'Which admin role is required to change high-security settings?', options: [
      { value: 'a', label: 'high_sec_admin' },
      { value: 'b', label: 'sn_acl_admin' },
      { value: 'c', label: 'admin' },
      { value: 'd', label: 'security_admin' }
    ], correct: ['d'], discussion: 'D is correct. The security_admin role is required to change high-security settings and modify ACLs.' },

    { id: 'q200', type: 'single', text: 'What is the most common role giving access to almost all features and data in the platform?', options: [
      { value: 'a', label: 'Super User [sn_super_user]' },
      { value: 'b', label: 'Security Admin [security_admin]' },
      { value: 'c', label: 'System Administrator [admin]' },
      { value: 'd', label: 'Base Admin [base_admin]' },
      { value: 'e', label: 'System Manager [sys_manager]' }
    ], correct: ['c'], discussion: 'C is correct. The System Administrator [admin] role has access to almost all platform features, functions, and data.' },

    { id: 'q201', type: 'single', text: 'To move multiple update sets at once, what do you use?', options: [
      { value: 'a', label: 'Preview' },
      { value: 'b', label: 'Batch' },
      { value: 'c', label: 'List' },
      { value: 'd', label: 'Map' }
    ], correct: ['b'], discussion: 'B is correct. Batch update sets group multiple update sets so they can be previewed and committed together.' },

    { id: 'q202', type: 'single', text: 'After making changes to a report, to check results without saving, where do you click?', options: [
      { value: 'a', label: 'Preview' },
      { value: 'b', label: 'Test' },
      { value: 'c', label: 'Run' },
      { value: 'd', label: 'Try it' }
    ], correct: ['c'], discussion: 'C is correct. Clicking "Run" executes the report with current settings without saving changes.' },

    { id: 'q203', type: 'single', text: 'Which framework can automatically populate Priority and Category fields based on the value in Short Description?', options: [
      { value: 'a', label: 'Predictive Intelligence' },
      { value: 'b', label: 'Assignment Rules' },
      { value: 'c', label: 'CSDM' },
      { value: 'd', label: 'Actions' },
      { value: 'e', label: 'UI Policies' }
    ], correct: ['a'], discussion: 'A is correct. Predictive Intelligence uses machine learning to automatically populate field values based on text inputs like Short Description.' },

    { id: 'q204', type: 'single', text: 'Which testing framework is used for ServiceNow applications?', options: [
      { value: 'a', label: 'Test Driven Framework (TDF)' },
      { value: 'b', label: 'Junit' },
      { value: 'c', label: 'Selenium' },
      { value: 'd', label: 'Automated Test Framework (ATF)' }
    ], correct: ['d'], discussion: 'D is correct. ATF (Automated Test Framework) is ServiceNow\'s built-in testing framework.' },

    { id: 'q205', type: 'single', text: 'Which can create task-based records from the Service Catalog?', options: [
      { value: 'a', label: 'Assignment Rules' },
      { value: 'b', label: 'Flow Designer' },
      { value: 'c', label: 'UI Builder' },
      { value: 'd', label: 'Record Producer' }
    ], correct: ['d'], discussion: 'D is correct. Record Producers create task-based records (Incidents, Changes, etc.) through the Service Catalog.' },

    { id: 'q206', type: 'single', text: 'Which module is used to access available reports in ServiceNow?', options: [
      { value: 'a', label: 'Self-Service > My Reports' },
      { value: 'b', label: 'Self-Service > My Dashboards' },
      { value: 'c', label: 'Reports > View / Run' },
      { value: 'd', label: 'Reports > Homepage' },
      { value: 'e', label: 'Reports > Overview' }
    ], correct: ['c'], discussion: 'C is correct. Reports > View/Run is the module to access and run existing reports.' },

    { id: 'q207', type: 'single', text: 'Security rules that restrict what data users can view and interact with are called what?', options: [
      { value: 'a', label: 'CRUD Rules' },
      { value: 'b', label: 'Access Control Rules' },
      { value: 'c', label: 'Role Assignment Rules' },
      { value: 'd', label: 'Scripted User Rules' }
    ], correct: ['b'], discussion: 'B is correct. Access Control Rules (ACL Rules) define what data users can view and interact with.' },

    { id: 'q208', type: 'multi', text: 'A new IT employee needs to work in the Network and Hardware groups. How do you configure access? (Choose 3)', requiredCount: 3, options: [
      { value: 'a', label: 'Add the user account to the Hardware group' },
      { value: 'b', label: 'Add the user account to the IT Knowledge Base' },
      { value: 'c', label: 'Create a user account' },
      { value: 'd', label: 'Add the user account to the ITIL group' },
      { value: 'e', label: 'Add the user account to the Network group' },
      { value: 'f', label: 'Add the user account to an ACL' }
    ], correct: ['a', 'c', 'e'], discussion: 'A, C, and E are correct. Create a user account, then add to Network group and Hardware group (roles are inherited via group membership).' },

    { id: 'q209', type: 'single', text: 'A customer wants to change the default task list layout. After navigating to the list, where do you click to meet this requirement?', options: [
      { value: 'a', label: 'Click list context menu > Personalize List' },
      { value: 'b', label: 'Click list context menu > Configure > Columns' },
      { value: 'c', label: 'Right-click the list gear icon > Configure > Columns' },
      { value: 'd', label: 'Right-click any column header, then Context Menu > Configure > List Layout' }
    ], correct: ['d'], discussion: 'D is correct. To change the default list layout for everyone: right-click any column header > Configure > List Layout.' },

    { id: 'q210', type: 'single', text: 'Which ServiceNow feature can deliver knowledge articles through a conversational messaging interface?', options: [
      { value: 'a', label: 'Agent Assist' },
      { value: 'b', label: 'Virtual Agent' },
      { value: 'c', label: 'Now Messenger' },
      { value: 'd', label: 'Instance Chat' }
    ], correct: ['b'], discussion: 'B is correct. Virtual Agent delivers knowledge articles and other content through a conversational messaging interface.' },

    { id: 'q211', type: 'single', text: 'Which element in the form header allows access to form templates?', options: [
      { value: 'a', label: 'Stamp' },
      { value: 'b', label: 'More Options (...)' },
      { value: 'c', label: 'Page' },
      { value: 'd', label: 'Clip' }
    ], correct: ['b'], discussion: 'B is correct. The More Options (...) button in the form header provides access to form templates via Toggle Template Bar.' },

    { id: 'q212', type: 'single', text: 'What is a group in ServiceNow?', options: [
      { value: 'a', label: 'A collection of subject matter experts' },
      { value: 'b', label: 'A department' },
      { value: 'c', label: 'An escalation pod' },
      { value: 'd', label: 'A collection of users' },
      { value: 'e', label: 'A collection of tasks' }
    ], correct: ['d'], discussion: 'D is correct. A group is a collection of users in ServiceNow.' },

    { id: 'q213', type: 'single', text: 'Which ServiceNow utility provides the most current interactive graphical interface for visualizing CIs and their relationships?', options: [
      { value: 'a', label: 'Flow Design' },
      { value: 'b', label: 'CI Class Map' },
      { value: 'c', label: 'Dependency View' },
      { value: 'd', label: 'Business Service Map' }
    ], correct: ['c'], discussion: 'C is correct. The Dependency View is the modern interactive graphical interface for visualizing CIs and their relationships.' },

    { id: 'q214', type: 'single', text: 'What icon do you use to change the Favorites label?', options: [
      { value: 'a', label: 'Star' },
      { value: 'b', label: 'Clock' },
      { value: 'c', label: 'Triangle' },
      { value: 'd', label: 'Pencil' }
    ], correct: ['d'], discussion: 'D is correct. The pencil icon is used to edit (change) the Favorites label.' },

    { id: 'q215', type: 'single', text: 'Which tool is used to define field relationships between an import set table and a target table?', options: [
      { value: 'a', label: 'Schema Map' },
      { value: 'b', label: 'Field Transform Tool' },
      { value: 'c', label: 'Transform Map' },
      { value: 'd', label: 'Transform Schema' }
    ], correct: ['c'], discussion: 'C is correct. A Transform Map defines field mappings between the import set table and the target table.' },

    { id: 'q216', type: 'single', text: 'When moving homepages or dashboards between instances, what must you remember?', options: [
      { value: 'a', label: 'Download both PDF and XML files' },
      { value: 'b', label: 'They cannot be moved via update sets' },
      { value: 'c', label: 'The platform automatically adds them to update sets' },
      { value: 'd', label: 'Add them manually to update sets' }
    ], correct: ['d'], discussion: 'D is correct. Homepages and dashboards are NOT automatically captured in update sets; you must manually add them.' },

    { id: 'q217', type: 'single', text: 'Which can create task-based records from the Service Catalog?', options: [
      { value: 'a', label: 'Record Producer' },
      { value: 'b', label: 'UI Builder' },
      { value: 'c', label: 'Assignment Rules' },
      { value: 'd', label: 'UI Actions' },
      { value: 'e', label: 'Flow Designer' }
    ], correct: ['a'], discussion: 'A is correct. Record Producers create task-based records (such as Incidents) through the Service Catalog.' },

    { id: 'q218', type: 'single', text: 'Which tab in a Knowledge Base record defines users who CAN write articles to that knowledge base?', options: [
      { value: 'a', label: 'Cannot Submit' },
      { value: 'b', label: 'Cannot Author' },
      { value: 'c', label: 'Can Read' },
      { value: 'd', label: 'Can Write' },
      { value: 'e', label: 'Can Contribute' }
    ], correct: ['e'], discussion: 'E is correct. The "Can Contribute" tab defines users who have write access to contribute articles to the knowledge base.' },

    { id: 'q219', type: 'single', text: 'Which type of script runs in the browser?', options: [
      { value: 'a', label: 'UI Policies' },
      { value: 'b', label: 'Script Include scripts' },
      { value: 'c', label: 'Access Control scripts' },
      { value: 'd', label: 'Business Rule scripts' }
    ], correct: ['a'], discussion: 'A is correct. UI Policies run on the client side (in the browser).' },

    { id: 'q220', type: 'single', text: 'To trace connections from an infrastructure item like a server to services that depend on that server, what do you use?', options: [
      { value: 'a', label: 'Auto-mapping Utility' },
      { value: 'b', label: 'Relationships' },
      { value: 'c', label: 'Service Tracer' },
      { value: 'd', label: 'Transform Map' }
    ], correct: ['b'], discussion: 'B is correct. Relationships in the CMDB are used to trace connections between CIs and the services that depend on them.' },

    { id: 'q221', type: 'single', text: 'Which section of a task record shows the most recent updates to a record?', options: [
      { value: 'a', label: 'Timeline' },
      { value: 'b', label: 'Related Lists' },
      { value: 'c', label: 'Activity Stream' },
      { value: 'd', label: 'Audit Log' }
    ], correct: ['c'], discussion: 'C is correct. The Activity Stream shows the most recent updates, comments, and history for a record.' },

    { id: 'q222', type: 'single', text: 'When using the CMDB, what are components that need to be managed to deliver services called?', options: [
      { value: 'a', label: 'Configuration Items' },
      { value: 'b', label: 'Assets' },
      { value: 'c', label: 'Catalog Items' },
      { value: 'd', label: 'Data Plows' },
      { value: 'e', label: 'Service Offerings' }
    ], correct: ['a'], discussion: 'A is correct. Configuration Items (CIs) are the managed components that are needed to deliver services.' },

    { id: 'q223', type: 'single', text: 'To apply a UI Policy to all views, which field in the definition record must be set to true?', options: [
      { value: 'a', label: 'Global' },
      { value: 'b', label: 'Reverse if False' },
      { value: 'c', label: 'On Load' },
      { value: 'd', label: 'Inherit' }
    ], correct: ['a'], discussion: 'A is correct. Setting the "Global" checkbox to true on a UI Policy applies it to all form views. If unchecked, it is view-specific.' },

    { id: 'q224', type: 'single', text: 'Which step in the data import process using Import Sets defines where input data columns from a spreadsheet are written in the target table?', options: [
      { value: 'a', label: 'Schedule Transform' },
      { value: 'b', label: 'Field Matching' },
      { value: 'c', label: 'Select Data Source' },
      { value: 'd', label: 'Create Transform Map' },
      { value: 'e', label: 'Load Data' }
    ], correct: ['d'], discussion: 'D is correct. Creating a Transform Map defines which import set fields map to which fields in the target table.' },

    { id: 'q225', type: 'single', text: 'Which of the following correctly describes data import steps using Import Sets?', options: [
      { value: 'a', label: 'Identify source; import transform map; run transformer; validate import' },
      { value: 'b', label: 'Select source file; run auto-mapping; transform data; clean up target table' },
      { value: 'c', label: 'Configure LDAP; test map; create update set; run import; apply update set' },
      { value: 'd', label: 'Load data; create transform map; transform data; clean up import table' }
    ], correct: ['d'], discussion: 'D is correct. The Import Set process: Load Data > Create Transform Map > Transform Data > Clean up.' },

    { id: 'q226', type: 'single', text: 'When importing from a spreadsheet, which step defines where columns from the input data are written in the target table?', options: [
      { value: 'a', label: 'Schedule Transform' },
      { value: 'b', label: 'Field Matching' },
      { value: 'c', label: 'Select Data Source' },
      { value: 'd', label: 'Create Transform Map' },
      { value: 'e', label: 'Load Data' }
    ], correct: ['d'], discussion: 'D is correct. The Transform Map defines the field-to-field mapping between the import set and target table.' },

    { id: 'q227', type: 'single', text: 'To apply a UI Policy to all views, which field must be set to true?', options: [
      { value: 'a', label: 'Global' },
      { value: 'b', label: 'Reverse if False' },
      { value: 'c', label: 'On Load' },
      { value: 'd', label: 'Inherit' }
    ], correct: ['a'], discussion: 'A is correct. The Global checkbox applies a UI Policy to all form views when enabled.' },

    { id: 'q228', type: 'single', text: 'Which steps are used to import data via Import Sets?', options: [
      { value: 'a', label: 'Select source file; run auto-mapping; transform data; clean target table' },
      { value: 'b', label: 'Identify source; import transform map; run transformer; validate import' },
      { value: 'c', label: 'Configure LDAP; test map; create update set; run import; apply update set' },

    const chkAuto = document.getElementById('auto-next');
    const chkRandQ = document.getElementById('rand-questions');
    const chkRandO = document.getElementById('rand-options');
    const btnReshuffle = document.getElementById('reshuffle-btn');
    const btnShowExplain = document.getElementById('show-explain-btn');
    const elBlockIndex = document.getElementById('block-index');
    const elBlockTotal = document.getElementById('block-total');
    const btnBlockPrev = document.getElementById('block-prev');
    const btnBlockNext = document.getElementById('block-next');
    const btnGotoNextBlock = document.getElementById('goto-next-block');

    function shuffle(arr) {
      const a = arr.slice();
      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
      }
      return a;
    }

    function buildGlobalOrder() {
      const qlist = baseQuiz.questions.map(q => ({
        id: q.id, type: q.type, text: q.text, requiredCount: q.requiredCount,
        options: q.options.slice(), correct: q.correct.slice(), discussion: q.discussion
      }));
      globalOrder = chkRandQ.checked ? shuffle(qlist) : qlist;
      blocks = [];
      for (let i = 0; i < globalOrder.length; i += BLOCK_SIZE) {
        const chunk = globalOrder.slice(i, i + BLOCK_SIZE);
        if (chkRandO.checked) chunk.forEach(q => { q.options = shuffle(q.options); });
        blocks.push(chunk);
      }
    }

    function loadBlock(index) {
      currentBlock = Math.max(0, Math.min(index, blocks.length - 1));
      quiz = { title: baseQuiz.title, questions: (blocks[currentBlock] || []) };
      current = 0; score = 0;
      elBlockIndex.textContent = (currentBlock + 1);
      elBlockTotal.textContent = blocks.length;
      render();
    }

    function render() {
      const q = quiz.questions[current];
      elQnum.textContent = (current + 1);
      elQtotal.textContent = quiz.questions.length;
      elBar.style.width = ((current) / quiz.questions.length * 100) + '%';
      elScore.textContent = score;
      elFeedback.classList.add('hidden');
      elDiscussion.classList.add('hidden');
      elDiscussion.textContent = '';
      btnShowExplain.classList.add('hidden');
      btnNext.disabled = true;
      elBlock.classList.remove('disabled');

      const pickInfo = (q.requiredCount && q.requiredCount > 0) ? ` (Choose ${q.requiredCount})` : (q.type === 'multi' ? ` (Choose ${q.correct.length})` : '');
      let html = `<div class="question-title">【Q${current+1}】${escapeHtml(q.text)} ${pickInfo}</div>`;
      html += '<div class="options">';
      if (q.type === 'multi' || (q.requiredCount && q.requiredCount !== 1)) {
        for (const o of q.options) {
          html += `<label data-value="${o.value}"><input type="checkbox" name="q_${q.id}" value="${o.value}"> ${escapeHtml(o.label)}</label>`;
        }
      } else {
        for (const o of q.options) {
          html += `<label data-value="${o.value}"><input type="radio" name="q_${q.id}" value="${o.value}"> ${escapeHtml(o.label)}</label>`;
        }
      }
      html += '</div>';
      elBlock.innerHTML = html;
    }

    function getInputs() {
      const q = quiz.questions[current];
      return [...document.querySelectorAll('input[name="q_' + q.id + '"]')];
    }
    function getSelected() { return getInputs().filter(i => i.checked).map(i => i.value); }

    function grade() {
      const q = quiz.questions[current];
      const selected = getSelected();
      const required = q.requiredCount || null;
      if (required && selected.length !== required) {
        showFeedback(`This question requires choosing ${required} answers (currently ${selected.length}). Please re-select.`, false);
        return;
      }
      if (selected.length === 0) { showFeedback('Please select at least one answer.', false); return; }
      const ok = (q.type === 'multi') ? exact(selected, q.correct) : (selected.length === 1 && q.correct.includes(selected[0]));
      const partial = overlap(selected, q.correct);
      if (ok) score++;
      highlightAfterGrade(q.correct, selected);
      showFeedback(ok ? '✅ Correct!' : (partial ? '⚠️ Partially correct. Try again.' : '❌ Incorrect.'), ok);
      showDiscussion(q.discussion);
      btnNext.disabled = false;
      if (chkAuto.checked) setTimeout(next, autoNextDelayMs);
    }

    function showFeedback(msg, ok) {
      elFeedback.textContent = msg;
      elFeedback.className = 'feedback ' + (ok ? 'ok' : 'ng');
      elFeedback.classList.remove('hidden');
    }
    function showDiscussion(text) {
      elDiscussion.textContent = text;
      elDiscussion.classList.add('hidden'); // hidden by default, revealed by button
      btnShowExplain.classList.remove('hidden');
      btnShowExplain.textContent = '💡 Show Explanation';
      for (const i of getInputs()) i.disabled = true;
      elBlock.classList.add('disabled');
    }
    function reset() { render(); elFeedback.classList.add('hidden'); elFeedback.textContent=''; elDiscussion.classList.add('hidden'); elDiscussion.textContent=''; btnShowExplain.classList.add('hidden'); btnNext.disabled = true; }
    function next() { if (current < quiz.questions.length - 1) { current++; render(); } else { finish(); } }
    function finish() {
      document.getElementById('quiz-card').classList.add('hidden');
      const res = document.getElementById('result-card');
      document.getElementById('final-score').textContent = String(score);
      document.getElementById('final-total').textContent = String(quiz.questions.length);
      res.classList.remove('hidden');
      elBar.style.width = '100%';
    }
    function retry() { current = 0; score = 0; render(); document.getElementById('result-card').classList.add('hidden'); document.getElementById('quiz-card').classList.remove('hidden'); }

    function gotoNextBlock() {
      if (currentBlock < blocks.length - 1) {
        loadBlock(currentBlock + 1);
        document.getElementById('result-card').classList.add('hidden');
        document.getElementById('quiz-card').classList.remove('hidden');
      }
    }

    function highlightAfterGrade(correct, selected) {
      const setC = new Set(correct), setS = new Set(selected);
      for (const input of getInputs()) {
        const label = input.parentElement; const v = input.value;
        if (setC.has(v)) label.classList.add('is-correct');
        if (setS.has(v)) label.classList.add('is-selected');
        if (setS.has(v) && !setC.has(v)) label.classList.add('is-wrongselected');
      }
    }
    function exact(selected, correct) { if (selected.length !== correct.length) return false; const s=new Set(selected), c=new Set(correct); for (const v of s) if (!c.has(v)) return false; return true; }
    function overlap(selected, correct) { const c=new Set(correct); return selected.some(v => c.has(v)); }
    function escapeHtml(str) { return String(str).replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;'); }

    document.getElementById('submit-btn').addEventListener('click', grade);
    document.getElementById('next-btn').addEventListener('click', next);
    document.getElementById('reset-btn').addEventListener('click', reset);
    document.getElementById('retry-btn').addEventListener('click', retry);
    btnShowExplain.addEventListener('click', () => {
      if (elDiscussion.classList.contains('hidden')) {
        elDiscussion.classList.remove('hidden');
        btnShowExplain.textContent = '🙈 Hide Explanation';
      } else {
        elDiscussion.classList.add('hidden');
        btnShowExplain.textContent = '💡 Show Explanation';
      }
    });
    btnReshuffle.addEventListener('click', () => { buildGlobalOrder(); loadBlock(currentBlock); });
    btnBlockPrev.addEventListener('click', () => { if (currentBlock > 0) loadBlock(currentBlock - 1); });
    btnBlockNext.addEventListener('click', () => { if (currentBlock < blocks.length - 1) loadBlock(currentBlock + 1); });
    btnGotoNextBlock.addEventListener('click', gotoNextBlock);

    function init() {
      buildGlobalOrder();
      loadBlock(0);
    }
    init();
  </script>
</body>
</html>
