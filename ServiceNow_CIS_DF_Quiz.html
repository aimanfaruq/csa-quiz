<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ServiceNow CIS-DF Quiz</title>
<style>
  :root {
    --blue:#3f6fe8;
    --blue-dark:#2f58bd;
    --ink:#12213a;
    --muted:#667085;
    --page:#f4f6fb;
    --card:#ffffff;
    --line:#dfe4ee;
    --soft:#eef1f7;
    --good:#177245;
    --good-bg:#eaf8f0;
    --bad:#b42318;
    --bad-bg:#fff0ee;
  }
  * { box-sizing:border-box; }
  body {
    margin:0;
    font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
    background:var(--page);
    color:var(--ink);
  }
  .topbar {
    background:var(--blue);
    color:#fff;
    font-size:clamp(20px,2vw,30px);
    font-weight:800;
    padding:20px 22px;
    letter-spacing:-.02em;
  }
  .wrap {
    width:min(1320px, calc(100% - 28px));
    margin:34px auto 60px;
  }
  .toolbar {
    background:rgba(255,255,255,.82);
    border:1px solid var(--line);
    border-radius:20px;
    padding:14px;
    box-shadow:0 2px 8px rgba(31,41,55,.05);
  }
  .toolbar-row {
    display:flex;
    flex-wrap:wrap;
    align-items:center;
    gap:12px;
  }
  .pill {
    display:flex;
    align-items:center;
    gap:10px;
    background:var(--soft);
    border-radius:999px;
    padding:12px 16px;
    font-size:17px;
    user-select:none;
  }
  .pill input { width:18px; height:18px; }
  button {
    font:inherit;
    border:1px solid #ccd4e3;
    background:#fff;
    color:#143162;
    border-radius:12px;
    padding:11px 18px;
    font-weight:700;
    cursor:pointer;
    box-shadow:0 1px 2px rgba(16,24,40,.04);
  }
  button:hover { background:#f8faff; }
  button.primary {
    background:var(--blue);
    color:#fff;
    border-color:var(--blue);
  }
  button.primary:hover { background:var(--blue-dark); }
  button.secondary {
    background:#6f7f9d;
    color:#fff;
    border-color:#6f7f9d;
  }
  button:disabled { opacity:.45; cursor:not-allowed; }
  .spacer { flex:1 1 auto; }
  .block-indicator {
    font-size:18px;
    padding:12px 14px;
    background:#f0f0f3;
    border-radius:12px;
    white-space:nowrap;
  }
  .score-row {
    margin-top:14px;
    display:flex;
    flex-wrap:wrap;
    gap:10px;
    align-items:center;
  }
  .score-chip {
    background:#e9ebf0;
    border-radius:10px;
    padding:9px 14px;
    font-size:16px;
  }
  .notice {
    margin-left:auto;
    color:#775b00;
    background:#fff8db;
    border:1px solid #f2dc88;
    border-radius:10px;
    padding:8px 12px;
    font-size:14px;
  }
  .card {
    background:var(--card);
    border:1px solid var(--line);
    border-radius:20px;
    padding:22px;
    margin-top:22px;
    box-shadow:0 2px 8px rgba(31,41,55,.05);
  }
  .qhead {
    font-size:22px;
    font-weight:800;
    margin-bottom:8px;
  }
  .meta {
    color:var(--muted);
    font-size:14px;
    margin-bottom:12px;
  }
  .question {
    font-size:18px;
    line-height:1.55;
    margin-bottom:16px;
    white-space:pre-wrap;
  }
  .choose-note {
    display:inline-block;
    margin-left:8px;
    padding:3px 8px;
    border-radius:999px;
    background:#edf2ff;
    color:#3158b6;
    font-size:13px;
    font-weight:700;
    vertical-align:middle;
  }
  .option {
    display:flex;
    align-items:flex-start;
    gap:13px;
    border:1px solid #d9dfeb;
    border-radius:13px;
    padding:14px 16px;
    margin:10px 0;
    cursor:pointer;
    background:#fff;
    transition:.12s ease;
  }
  .option:hover { background:#f8faff; border-color:#b9c6df; }
  .option input { width:19px; height:19px; margin-top:2px; flex:0 0 auto; }
  .option-label { line-height:1.45; font-size:17px; }
  .option.selected { border-color:#82a0ef; background:#f4f7ff; }
  .option.correct { border-color:#73c798; background:var(--good-bg); }
  .option.wrong { border-color:#ef9b93; background:var(--bad-bg); }
  .actions {
    display:flex;
    flex-wrap:wrap;
    gap:10px;
    margin-top:16px;
  }
  .nav {
    display:flex;
    gap:10px;
    margin-top:12px;
  }
  .feedback {
    display:none;
    margin-top:18px;
    border-radius:14px;
    padding:15px 16px;
    line-height:1.5;
  }
  .feedback.show { display:block; }
  .feedback.good { background:var(--good-bg); border:1px solid #a8dfbf; color:#135c3a; }
  .feedback.bad { background:var(--bad-bg); border:1px solid #f1b5ae; color:#8f2018; }
  .feedback strong { font-size:17px; }
  .source {
    margin-top:8px;
    font-size:14px;
    color:#4b5565;
  }
  .source a { color:#3158b6; font-weight:700; }
  .error {
    color:var(--bad);
    font-weight:700;
    margin-top:10px;
    min-height:20px;
  }
  details.skipped {
    margin-top:22px;
    background:#fff;
    border:1px solid var(--line);
    border-radius:14px;
    padding:14px 16px;
  }
  details.skipped summary { cursor:pointer; font-weight:750; }
  .skipped-list { margin:12px 0 0; padding-left:22px; }
  .skipped-list li { margin:8px 0; line-height:1.4; }
  .skipped-list a { color:#3158b6; }
  @media (max-width:720px) {
    .wrap { width:min(100% - 16px, 1320px); margin-top:16px; }
    .topbar { padding:16px; }
    .toolbar, .card { border-radius:14px; }
    .spacer { display:none; }
    .toolbar-row { align-items:stretch; }
    .pill, .block-indicator, .toolbar button { flex:1 1 auto; justify-content:center; text-align:center; }
    .notice { margin-left:0; width:100%; }
    .card { padding:16px; }
    .qhead { font-size:20px; }
    .question, .option-label { font-size:16px; }
  }
</style>
</head>
<body>
  <div class="topbar">ServiceNow CIS-DF Quiz App (60-question blocks / Question &amp; option shuffle)</div>

  <main class="wrap">
    <section class="toolbar">
      <div class="toolbar-row">
        <label class="pill"><input id="shuffleQuestions" type="checkbox" checked> Shuffle questions (default ON)</label>
        <label class="pill"><input id="shuffleOptions" type="checkbox" checked> Shuffle options (default ON)</label>
        <button id="reshuffle" class="secondary">Re-shuffle</button>
        <div class="spacer"></div>
        <div id="blockIndicator" class="block-indicator">Block 1 / 3</div>
        <button id="prevBlock">◀ Prev 60</button>
        <button id="nextBlock">Next 60 ▶</button>
      </div>
      <div class="score-row">
        <div id="correctCount" class="score-chip">Block correct count: 0</div>
        <div id="answeredCount" class="score-chip">Answered: 0 / 60</div>
        <button id="resetProgress">Reset progress</button>
        <div class="notice">178 usable questions • 14 drag/drop rows skipped because the Excel has no option/answer text for them.</div>
      </div>
    </section>

    <section class="card">
      <div id="qHead" class="qhead"></div>
      <div id="meta" class="meta"></div>
      <div id="question" class="question"></div>
      <div id="options"></div>

      <div class="actions">
        <button id="confirm" class="primary">Confirm</button>
        <button id="clear">Clear selection</button>
      </div>
      <div id="error" class="error"></div>
      <div id="feedback" class="feedback"></div>

      <div class="nav">
        <button id="prevQuestion" class="secondary">← Previous</button>
        <button id="nextQuestion" class="secondary">Next →</button>
      </div>
    </section>

    <details class="skipped">
      <summary>Skipped drag/drop questions (14)</summary>
      <ol id="skippedList" class="skipped-list"></ol>
    </details>
  </main>

<script>
const QUESTIONS = [{"id": "q1", "originalNumber": 1, "title": "Question #1 Topic 1", "topic": 1, "question": "A CMDB Administrator has built a number of Technology Management Service Offerings (Technical Service Offerings) based on Dynamic CI Groups to better maintain group alignment for the member CI. Which Groups are synced to CIs from the offering that has a relationship to a Dynamic CI Group? (Choose two.)", "options": [{"id": "A", "text": "Approval Group"}, {"id": "B", "text": "Managed by Group"}, {"id": "C", "text": "Support Group"}, {"id": "D", "text": "Owned by Group"}], "correct": ["B", "C"], "sourceLabel": "official", "sourceUrl": "https://www.examtopics.com/discussions/_/view/984774"}, {"id": "q3", "originalNumber": 3, "title": "Question #3 Topic 1", "topic": 1, "question": "A new custom class is needed to reflect a new application being managed in the CMDB. Which roles are minimally needed to add this custom CI class?", "options": [{"id": "A", "text": "A cmdb_inst_admin and personalize_form"}, {"id": "B", "text": "itil_admin and personalize_form"}, {"id": "C", "text": "data_classification_admin and personalize_dictionary"}, {"id": "D", "text": "sn_cmdb_admin and personalize_dictionary"}], "correct": ["D"], "sourceLabel": "official", "sourceUrl": "https://www.examtopics.com/discussions/_/view/984776"}, {"id": "q4", "originalNumber": 4, "title": "Question #4 Topic 1", "topic": 1, "question": "What is the relationship between an application and a server?", "options": [{"id": "A", "text": "Application>Used by::Uses>Server"}, {"id": "B", "text": "Application> Uses::Used by>Server"}, {"id": "C", "text": "Application>Runs::Runs On>Server"}, {"id": "D", "text": "Application>Runs on::Runs>Server"}], "correct": ["D"], "sourceLabel": "official", "sourceUrl": "https://www.examtopics.com/discussions/_/view/984777"}, {"id": "q5", "originalNumber": 5, "title": "Question #5 Topic 1", "topic": 1, "question": "User endpoint devices are imported into the CMDB and populate anaged CIs. As a result, which base system field on the incident form will be automatically populated after selecting a CI?", "options": [{"id": "A", "text": "Managed by group"}, {"id": "B", "text": "Approval group"}, {"id": "C", "text": "Assignment group"}, {"id": "D", "text": "Change group"}], "correct": ["C"], "sourceLabel": "official", "sourceUrl": "https://www.examtopics.com/discussions/_/view/984780"}, {"id": "q8", "originalNumber": 8, "title": "Question #8 Topic 1", "topic": 1, "question": "A Data Center Manager is working with the CMDB CI Class Manager to define the relationship between Application Servers and the Applications they host. The company has multiple Application Servers that host one or more Applications. Which describes the relationship between the Application Server table ([cmdb_ci_app_server]) and the Application table ([cmdb_ci_appl])?", "options": [{"id": "A", "text": "Many-to-one"}, {"id": "B", "text": "One-to-one"}, {"id": "C", "text": "One-to-many"}, {"id": "D", "text": "Many-to-many"}], "correct": ["D"], "sourceLabel": "official", "sourceUrl": "https://www.examtopics.com/discussions/_/view/984781"}, {"id": "q9", "originalNumber": 9, "title": "Question #9 Topic 1", "topic": 1, "question": "A CMDB Administrator needs to identify which attributes have been created specifically for the Windows Server class. Which tab in the Attributes section is used?", "options": [{"id": "A", "text": "All"}, {"id": "B", "text": "Derived"}, {"id": "C", "text": "Added"}, {"id": "D", "text": "Child"}], "correct": ["C"], "sourceLabel": "official", "sourceUrl": "https://www.examtopics.com/discussions/_/view/984782"}, {"id": "q10", "originalNumber": 10, "title": "Question #10 Topic 1", "topic": 1, "question": "An Asset Manager wants to ensure that Asset records and CI records are kept synchronized automatically. How does the Manager do this? (Choose two.)", "options": [{"id": "A", "text": "Ensure one-to-one physical mapping between Asset and CI"}, {"id": "B", "text": "Ensure that scheduled jobs are run during off-business hours to ensure sync happens"}, {"id": "C", "text": "Ensure that the business rule to update Asset fields on change on the CI table is active"}, {"id": "D", "text": "Ensure that the business rule to update CI fields on change on the asset table is active"}], "correct": ["C", "D"], "sourceLabel": "official", "sourceUrl": "https://www.examtopics.com/discussions/_/view/984783"}, {"id": "q11", "originalNumber": 11, "title": "Question #11 Topic 1", "topic": 1, "question": "The CMDB Configuration Management team has successfully developed a healthy and trusted CMDB. They have integrated discovered infrastructure data, accurately referenced non-discoverable data (such as change and support group information), and made the CMDB service-aware using Service Mapping. Which field on an Incident form is automatically populated after a CI is selected that references an appropriate support group?", "options": [{"id": "A", "text": "Support Group"}, {"id": "B", "text": "Approval Group"}, {"id": "C", "text": "Change Group"}, {"id": "D", "text": "Assignment Group"}, {"id": "E", "text": "Managed by Group"}], "correct": ["D"], "sourceLabel": "official", "sourceUrl": "https://www.examtopics.com/discussions/_/view/984784"}, {"id": "q12", "originalNumber": 12, "title": "Question #12 Topic 1", "topic": 1, "question": "A Configuration Management Process Owner is preparing solution options for presentation to the technical governance board for ingesting custom CIs to the CMDB. The solution needs to align with best practice, minimize the cost of future work (technical debt) and ensure compliance with future upgrades. Which solutions accomplish this? (Choose two.)", "options": [{"id": "A", "text": "Repurposing a base CI class and rename attributes, as required"}, {"id": "B", "text": "Extending an existing CI class table to accommodate the custom CI class attributes"}, {"id": "C", "text": "Installing or upgrading the ‘CMDB CI Class Models’ store application to find a suitable existing CI class accommodating any new attributes"}, {"id": "D", "text": "Extending an existing Asset class table to accommodate the custom CI class attributes"}], "correct": ["B", "C"], "sourceLabel": "official", "sourceUrl": "https://www.examtopics.com/discussions/_/view/984785"}, {"id": "q13", "originalNumber": 13, "title": "Question #13 Topic 1", "topic": 1, "question": "A CMDB Administrator wants only the CIs of Principal Classes to appear in CI reference fields, for example the CI reference fields accessible from an Incident Form. Where does the CMDB Administrator designate Principal Classes?", "options": [{"id": "A", "text": "CI Class Manager"}, {"id": "B", "text": "CMDB Workspace"}, {"id": "C", "text": "CMDB Data Manager"}, {"id": "D", "text": "System Properties"}], "correct": ["A"], "sourceLabel": "official", "sourceUrl": "https://www.examtopics.com/discussions/_/view/984786"}, {"id": "q14", "originalNumber": 14, "title": "Question #14 Topic 1", "topic": 1, "question": "A Configuration Manager is managing a CI class in the CMDB. The identification rule(s) needs an update. Where can the Configuration Manager view and configure the existing identification rule(s) for the class? (Choose two.)", "options": [{"id": "A", "text": "CI Identifiers module"}, {"id": "B", "text": "API Integrations"}, {"id": "C", "text": "IRE Application"}, {"id": "D", "text": "CI Class Manager"}], "correct": ["A", "D"], "sourceLabel": "official", "sourceUrl": "https://www.examtopics.com/discussions/_/view/992298"}, {"id": "q15", "originalNumber": 15, "title": "Question #15 Topic 1", "topic": 1, "question": "A CMDB Administrator wants to ensure that only relevant CIs from managed classes will be shown on Incident, Problem, and Change records. Which checkbox needs to be checked in the CI Class Manager for the CMDB Administrator to achieve the requested result?", "options": [{"id": "A", "text": "Principal Class"}, {"id": "B", "text": "Independent"}, {"id": "C", "text": "Main Record"}, {"id": "D", "text": "Extensible"}], "correct": ["A"], "sourceLabel": "official", "sourceUrl": "https://www.examtopics.com/discussions/_/view/992299"}, {"id": "q16", "originalNumber": 16, "title": "Question #16 Topic 1", "topic": 1, "question": "A Configuration Management team has decided to start taking advantage of the CMDB 360/Multisource CMDB functionality. Which system property must be enabled?", "options": [{"id": "A", "text": "glide.identification_engine.multisource_enabled"}, {"id": "B", "text": "glide.identification_engine.multisource.query.max.limit"}, {"id": "C", "text": "glide.identification_engine.multisource_non_cmdb_ci_enabled"}, {"id": "D", "text": "glide.identification_engine.multisource_cmdb_ci_enabled"}], "correct": ["A"], "sourceLabel": "official", "sourceUrl": "https://www.examtopics.com/discussions/_/view/992300"}, {"id": "q17", "originalNumber": 17, "title": "Question #17 Topic 1", "topic": 1, "question": "A CMDB Administrator is creating technical documentation for stakeholders, which includes a list of attributes, Identification and Reconciliation Engine (IRE) rules, and suggested relationships for several classes. Which central location does the CMDB Administrator use to collect this information?", "options": [{"id": "A", "text": "CI Class Manager"}, {"id": "B", "text": "CI Identifiers"}, {"id": "C", "text": "CMDB Workspace"}, {"id": "D", "text": "CMDB Data Manager"}], "correct": ["A"], "sourceLabel": "official", "sourceUrl": "https://www.examtopics.com/discussions/_/view/992301"}, {"id": "q18", "originalNumber": 18, "title": "Question #18 Topic 1", "topic": 1, "question": "A CMDB Administrator wants to configure IRE rules for the CMDB. The CMDB Administrator opens CI Class Manager and sees the Health Inclusions Rules tab available under a CI Class. How are these rules utilized by the IRE?", "options": [{"id": "A", "text": "To narrow the scope of CIs included in the identification process"}, {"id": "B", "text": "To reduce the data ingested into the CMDB"}, {"id": "C", "text": "To reconcile specific attributes based on data sources"}], "correct": ["A"], "sourceLabel": "official", "sourceUrl": "https://www.examtopics.com/discussions/_/view/992302"}, {"id": "q19", "originalNumber": 19, "title": "Question #19 Topic 1", "topic": 1, "question": "A Windows administration team wants a grouping of CIs using CMDB groups. Which methods can be used? (Choose two.)", "options": [{"id": "A", "text": "Tag-based queries"}, {"id": "B", "text": "Scripted queries"}, {"id": "C", "text": "Saved queries"}, {"id": "D", "text": "Encoded queries"}], "correct": ["C", "D"], "sourceLabel": "official", "sourceUrl": "https://www.examtopics.com/discussions/_/view/992303"}, {"id": "q20", "originalNumber": 20, "title": "Question #20 Topic 1", "topic": 1, "question": "A CMDB Administrator is managing group data from both the CI Class Manager and a Technical Service Offering for a specific class. Cl Class Manager:- Managed by Group = Enterprise IT ServicesTechnical Service Offering:- Managed by Group = Windows Support- Change Group = Change Management TeamWhat would be the Managed By Group for CIs from this class based on the configured values?", "options": [{"id": "A", "text": "Windows Support"}, {"id": "B", "text": "Enterprise IT Services"}, {"id": "C", "text": "Change Management Team"}], "correct": ["A"], "sourceLabel": "official", "sourceUrl": "https://www.examtopics.com/discussions/_/view/992304"}, {"id": "q21", "originalNumber": 21, "title": "Question #21 Topic 1", "topic": 1, "question": "A Configuration Manager wants to manage manually maintained data attributes of CIs. Which group values are automatically synchronized on CIs using Technology Management Offerings (Technical Service Offerings) and dynamic CI groups? (Choose two.)", "options": [{"id": "A", "text": "Change group"}, {"id": "B", "text": "Approval group"}, {"id": "C", "text": "Support group"}, {"id": "D", "text": "CMDB group"}], "correct": ["A", "C"], "sourceLabel": "official", "sourceUrl": "https://www.examtopics.com/discussions/_/view/992305"}, {"id": "q22", "originalNumber": 22, "title": "Question #22 Topic 1", "topic": 1, "question": "A CMDB Administrator is tasked with managing the CMDB and needs to define a new CI class to track a new type of equipment that has not been seen before. Which action adds a new CI class and ensures it integrates properly with the existing CMDB structure?", "options": [{"id": "A", "text": "Use Service Catalog to define the new CI class, as the CI Class Manager is only for service-related records and not for hardware CIs"}, {"id": "B", "text": "Edit an existing CI class under CI Class Manager and add new fields specific to the new equipment type"}, {"id": "C", "text": "Create a new CI class directly in the CI Class Manager and configure the table inheritance to ensure it inherits from a relevant parent class"}, {"id": "D", "text": "Use the CI Class Manager to create a new CI class but avoid setting up any inheritance, as CI classes should be independent of one another to maintain clarity"}], "correct": ["C"], "sourceLabel": "official", "sourceUrl": "https://www.examtopics.com/discussions/_/view/992306"}, {"id": "q23", "originalNumber": 23, "title": "Question #23 Topic 1", "topic": 1, "question": "A Configuration Manager needs to restrict the number of classes available in a Configuration Item reference field on an incident form. How does the Manager set Principal Classes?", "options": [{"id": "A", "text": "By using the Principal Class check box on the CI Class Manager's 'Basic Info' tab for a Class"}, {"id": "B", "text": "By using the Principal Class check box on the CI Class Manager's 'Attributes' tab for a Class"}, {"id": "C", "text": "By using the Principal Class attribute on the CI"}, {"id": "D", "text": "By using the Principal Class check box on the CMDB Workspace"}], "correct": ["A"], "sourceLabel": "official", "sourceUrl": "https://www.examtopics.com/discussions/_/view/992307"}, {"id": "q24", "originalNumber": 24, "title": "Question #24 Topic 1", "topic": 1, "question": "A CMDB Administrator aims to utilize CSDM life cycle field mappings to better align with CSDM best practices. What is the next step to take after selecting the Enable Life Cycle Sync button?", "options": [{"id": "A", "text": "Resolve any incomplete field mappings identified in the Discrepancy Report"}, {"id": "B", "text": "Fix the incorrect values in the Life Cycle Stage to match legacy values"}, {"id": "C", "text": "Activate the CSDM Life Cycle field mappings"}], "correct": ["A"], "sourceLabel": "official", "sourceUrl": "https://www.examtopics.com/discussions/_/view/992308"}, {"id": "q25", "originalNumber": 25, "title": "Question #25 Topic 1", "topic": 1, "question": "A CMDB Administrator needs to set a CI Class as a Principal Class. Which CI Class Manager tab would need to be accessed?", "options": [{"id": "A", "text": "Health > Attributes"}, {"id": "B", "text": "Class Info > Attributes"}, {"id": "C", "text": "Class Info > Basic Info"}], "correct": ["C"], "sourceLabel": "official", "sourceUrl": "https://www.examtopics.com/discussions/_/view/992309"}, {"id": "q26", "originalNumber": 26, "title": "Question #26 Topic 1", "topic": 1, "question": "A ServiceNow Administrator needs to create multiple new classes in the CMDB but wants to follow ServiceNow's best practices for naming CMDB tables to prevent technical debt. Which is the starting prefix for all custom CMDB tables?", "options": [{"id": "A", "text": "ci_cmdb"}, {"id": "B", "text": "cmdb_ci"}, {"id": "C", "text": "u_cmdb_ci"}, {"id": "D", "text": "u_ci_cmdb"}], "correct": ["C"], "sourceLabel": "official", "sourceUrl": "https://www.examtopics.com/discussions/_/view/992310"}, {"id": "q27", "originalNumber": 27, "title": "Question #27 Topic 1", "topic": 1, "question": "A Configuration Management team needs to prevent duplicate server records to avoid confusion among users. Server records are identified when they are processed via the Identification and Reconciliation Engine (IRE) using the configured identification rules. Where would these rules be configured?", "options": [{"id": "A", "text": "CMDB Workspace"}, {"id": "B", "text": "CMDB CI Class Manager"}, {"id": "C", "text": "CMDB Health Dashboard"}, {"id": "D", "text": "CMDB Data Manager"}], "correct": ["B"], "sourceLabel": "official", "sourceUrl": "https://www.examtopics.com/discussions/_/view/992311"}, {"id": "q28", "originalNumber": 28, "title": "Question #28 Topic 1", "topic": 1, "question": "A CMDB Administrator notices that CIs do not have a support group. How can the support group be automatically populated and maintained on the CI record?", "options": [{"id": "A", "text": "Technology Management Service Offering (Technical Service Offering)"}, {"id": "B", "text": "Technology Management Service (Technical Service)"}, {"id": "C", "text": "CI Class Manager"}, {"id": "D", "text": "Dynamic CI group"}], "correct": ["A"], "sourceLabel": "official", "sourceUrl": "https://www.examtopics.com/discussions/_/view/992312"}, {"id": "q29", "originalNumber": 29, "title": "Question #29 Topic 1", "topic": 1, "question": "Using CI Class Manager, the Tomcat identification rule has the following criterion attributes configured:• Class• Install DirectoryWhich identifier entry configuration option must be checked to attempt a match using the Application identification rule if no match is found using the Tomcat identification rule?", "options": [{"id": "A", "text": "Allow fallback to parent's rules"}, {"id": "B", "text": "Independent"}, {"id": "C", "text": "Applies to"}, {"id": "D", "text": "Criterion attributes"}], "correct": ["A"], "sourceLabel": "official", "sourceUrl": "https://www.examtopics.com/discussions/_/view/992313"}, {"id": "q30", "originalNumber": 30, "title": "Question #30 Topic 1", "topic": 1, "question": "A CMDB CI Class Owner has been asked to change the icon for the UNIX Server class. Which CI Class Manager tab can the owner use to change the icon for the class?", "options": [{"id": "A", "text": "CI List"}, {"id": "B", "text": "Basic Info"}, {"id": "C", "text": "Attributes"}, {"id": "D", "text": "Suggested Relationships"}], "correct": ["B"], "sourceLabel": "official", "sourceUrl": "https://www.examtopics.com/discussions/_/view/992314"}, {"id": "q31", "originalNumber": 31, "title": "Question #31 Topic 1", "topic": 1, "question": "A Configuration Manager is reviewing the life cycle of CIs to ensure data accuracy, consistency, and relevance. The manager reviews the legacy status values and their equivalent CSDM life cycle stage and life cycle stage status values. Where are these reviewed?", "options": [{"id": "A", "text": "Life cycle choice list"}, {"id": "B", "text": "Life cycle mappings"}, {"id": "C", "text": "Life cycle properties"}], "correct": ["B"], "sourceLabel": "official", "sourceUrl": "https://www.examtopics.com/discussions/_/view/992315"}, {"id": "q32", "originalNumber": 32, "title": "Question #32 Topic 1", "topic": 1, "question": "An organization is updating the CMDB to include new asset types like IoT devices. Relevant CI classes need to be added and outdated ones need to be removed from the Principal Class filter to ensure accurate display in ITSM processes. Which roles are needed to add or remove classes? (Choose two.)", "options": [{"id": "A", "text": "personalize_dictionary"}, {"id": "B", "text": "sn_csdm_admin"}, {"id": "C", "text": "sn_cmdb_admin"}, {"id": "D", "text": "cmdb_query_builder"}], "correct": ["A", "C"], "sourceLabel": "official", "sourceUrl": "https://www.examtopics.com/discussions/_/view/992316"}, {"id": "q33", "originalNumber": 33, "title": "Question #33 Topic 1", "topic": 1, "question": "An IT group has a requirement to upgrade all the Windows servers. There is a Dynamic CI Group containing all the Windows servers. What happens to the Dynamic CI Group when it is referenced from the Configuration Item field on a Change form?", "options": [{"id": "A", "text": "It displays all related CIs in the Impacted Services related list."}, {"id": "B", "text": "It calculates impact against the Dynamic CI Group."}, {"id": "C", "text": "It displays all related CIs in the Affected CIs related list."}], "correct": ["C"], "sourceLabel": "official", "sourceUrl": "https://www.examtopics.com/discussions/_/view/992317"}, {"id": "q34", "originalNumber": 34, "title": "Question #34 Topic 1", "topic": 1, "question": "A CMDB Administrator is working in the CI Class Manager on the Basic Info tab. How can the class be set as a Principal Class?", "options": [{"id": "A", "text": "Check the Principal Class check box"}, {"id": "B", "text": "Click the Principal Class UI Action button"}, {"id": "C", "text": "Select 'Yes' from the Principal Class choice list"}], "correct": ["A"], "sourceLabel": "official", "sourceUrl": "https://www.examtopics.com/discussions/_/view/992318"}, {"id": "q35", "originalNumber": 35, "title": "Question #35 Topic 1", "topic": 1, "question": "A global enterprise integrates data from multiple discovery sources such as ServiceNow Discovery, SCCM, AWS, and manual uploads to populate its CMDB. However, each discovery source categorizes the same CIs differently, leading to duplicate records and inconsistencies across the system. As a result, the CMDB team is struggling with data accuracy and standardization. What actions does the CMDB team take to resolve the issue? (Choose two.)", "options": [{"id": "A", "text": "Allow each discovery source to define its own CI class, even if it results in inconsistencies"}, {"id": "B", "text": "Implement and use identification and reconciliation rules to avoid duplicates and standardize CI classification"}, {"id": "C", "text": "Create a custom script to manually adjust incoming data before storing it in the CMDB"}, {"id": "D", "text": "Use CI Class Manager to establish standardized CI classes and attributes across all discovery sources"}], "correct": ["B", "D"], "sourceLabel": "official", "sourceUrl": "https://www.examtopics.com/discussions/_/view/992319"}, {"id": "q36", "originalNumber": 36, "title": "Question #36 Topic 1", "topic": 1, "question": "A CMDB CI Class Owner responsible for the Windows Servers needs to manage the Windows Server class. Which CI Class Manager feature will help the CI Class Owner streamline this task?", "options": [{"id": "A", "text": "Pinned Classes"}, {"id": "B", "text": "CI Favorites"}, {"id": "C", "text": "Search CI Classes"}], "correct": ["A"], "sourceLabel": "official", "sourceUrl": "https://www.examtopics.com/discussions/_/view/992320"}, {"id": "q37", "originalNumber": 37, "title": "Question #37 Topic 1", "topic": 1, "question": "The Change Management team in an organization wants to implement a Change across multiple CIs at the same time. Which field on the Change Request form needs to be populated with a dynamic CI group?", "options": [{"id": "A", "text": "Configuration Item"}, {"id": "B", "text": "Business Service"}, {"id": "C", "text": "Service Offering"}], "correct": ["A"], "sourceLabel": "official", "sourceUrl": "https://www.examtopics.com/discussions/_/view/992321"}, {"id": "q38", "originalNumber": 38, "title": "Question #38 Topic 1", "topic": 1, "question": "A CMDB Administrator needs to configure a new application identification rule that considers the potential for the same application installed more than once on the same server. Which is the best choice of a criterion attribute?", "options": [{"id": "A", "text": "Version"}, {"id": "B", "text": "Configuration File Name"}, {"id": "C", "text": "Port"}, {"id": "D", "text": "Configuration File Path"}, {"id": "E", "text": "Class"}], "correct": ["D"], "sourceLabel": "official", "sourceUrl": "https://www.examtopics.com/discussions/_/view/992322"}, {"id": "q39", "originalNumber": 39, "title": "Question #1 Topic 2", "topic": 2, "question": "The CMDB Administrator has set-up two Dynamic Reconcilliation Rules within the ServiceNow Production Instance. The ‘Server’ class has a Dynamic Reconciliation Rule of largest value for the RAM field. The ‘Windows Server’ class has a Dynamic Reconciliation Rule of most reported for the RAM field. Given the above data in the Multisource CMDB, which value would be added to the CMDB for RAM for a ‘Server’ CI?", "options": [{"id": "A", "text": "4.096 MB"}, {"id": "B", "text": "8.192 MB"}, {"id": "C", "text": "2.048 MB"}], "correct": ["B"], "sourceLabel": "official", "sourceUrl": "https://www.examtopics.com/discussions/_/view/984787"}, {"id": "q40", "originalNumber": 40, "title": "Question #2 Topic 2", "topic": 2, "question": "A CMDB Administrator needs to import external data into the CMDB. As the CMDB Administrator wants to reduce the risk for creating duplicates and to update information from unauthorized sources, it has to be ensured that the Identification and Reconciliation API will not be bypassed. What is the recommended method to import data into the CMDB utilizing the Identification and Reconciliation API?", "options": [{"id": "A", "text": "IntegrationHub ETL"}, {"id": "B", "text": "Table API (REST API or SOAP API)"}, {"id": "C", "text": "Import Sets and Transform Maps"}], "correct": ["A"], "sourceLabel": "official", "sourceUrl": "https://www.examtopics.com/discussions/_/view/984788"}, {"id": "q41", "originalNumber": 41, "title": "Question #3 Topic 2", "topic": 2, "question": "A Configuration Manager has configured a multiple data sources which are all authorized to update the same class and the same set of class attributes in the CMDB. What can the Configuration Manager do to control which data source should be authoritative source of truth for a specific class of set of class attributes?", "options": [{"id": "A", "text": "Assign a priority to each data source in the reconciliation rules"}, {"id": "B", "text": "Manually run the data source updates in the correct order"}, {"id": "C", "text": "Configure data refresh rules with a specific time period"}, {"id": "D", "text": "Assign a run order to each data source in the identification rules"}], "correct": ["A"], "sourceLabel": "official", "sourceUrl": "https://www.examtopics.com/discussions/_/view/984789"}, {"id": "q42", "originalNumber": 42, "title": "Question #4 Topic 2", "topic": 2, "question": "Which CMDB 360/Multisource CMDB the Dynamic Reconciliation Rules will also be enabled. Based on the request of the management, a CMDB Administrator has to set up multiple Dynamic Reconciliation Rules. Which are available ‘Dynamic Rule Types’ within the ‘Create Reconciliation Rule’ wizard? (Choose two.)", "options": [{"id": "A", "text": "Last Updated"}, {"id": "B", "text": "Smallest Value"}, {"id": "C", "text": "Last Created"}, {"id": "D", "text": "Most Reported"}], "correct": ["B", "D"], "sourceLabel": "official", "sourceUrl": "https://www.examtopics.com/discussions/_/view/984790"}, {"id": "q43", "originalNumber": 43, "title": "Question #5 Topic 2", "topic": 2, "question": "The following identification rule for a CI class has been defined:Two new CI records are imported into the hardware class of the CMDB:CI1: The name of this CI record matches the name of an existing CI record in the CMDB. CI2: The IP address of this CI record matches the IP address of an existing CI record in the CMDB. Which is correct based on the identification rule and the imported CI records?", "options": [{"id": "A", "text": "CI1 will be inserted as new record and CI2 will be updated with matching record."}, {"id": "B", "text": "CI1 will be updated with matching record and CI2 will be inserted as new record."}, {"id": "C", "text": "CI1 and CI2 both will be updated with matching records."}, {"id": "D", "text": "CI1 and CI2 both will be inserted as new records."}], "correct": ["B"], "sourceLabel": "official", "sourceUrl": "https://www.examtopics.com/discussions/_/view/984791"}, {"id": "q44", "originalNumber": 44, "title": "Question #6 Topic 2", "topic": 2, "question": "A customer wants recently imported server records to be automatically reclassified into more specific CMDB classes after being discovered using ServiceNow Discovery. During the discovery process, if existing Server [cmdb_ci_server] records are reclassified into the Linux [cmdb_ci_linux_server] and Windows Server [cmdb_ci_win_server] classes, which reclassification operation occurred?", "options": [{"id": "A", "text": "Class Upgrade"}, {"id": "B", "text": "Class Downgrade"}, {"id": "C", "text": "Class Switch"}], "correct": ["A"], "sourceLabel": "official", "sourceUrl": "https://www.examtopics.com/discussions/_/view/984792"}, {"id": "q45", "originalNumber": 45, "title": "Question #7 Topic 2", "topic": 2, "question": "A Platform Data Owner wants to improve data quality with a few reconciliation rules across the five discovery sources that are being used. The Data Owner knows the best option is to include CMDB 360/Multisource CMDB to manage and monitor discovery sources, but the company currently does not have a license for ITOM Discovery that is required for CMDB 360/Multisource CMDB. What can the Data Owner do in this case?", "options": [{"id": "A", "text": "ITOM Discovery needs to be purchased to take advantage of the multisource IRE Rules."}, {"id": "B", "text": "CMBD 360/Multisource is a platform product that can be used immediately."}, {"id": "C", "text": "The IRE reconciliation rules can use discovery source regardless of CMDB 360 being enabled."}], "correct": ["C"], "sourceLabel": "official", "sourceUrl": "https://www.examtopics.com/discussions/_/view/984793"}, {"id": "q46", "originalNumber": 46, "title": "Question #8 Topic 2", "topic": 2, "question": "Which ServiceNow solution creates automatic relationships?", "options": [{"id": "A", "text": "IntegrationHub ETL"}, {"id": "B", "text": "Discovery"}, {"id": "C", "text": "Workflow Studio"}, {"id": "D", "text": "Service Mapping"}], "correct": ["B"], "sourceLabel": "official", "sourceUrl": "https://www.examtopics.com/discussions/_/view/984794"}, {"id": "q47", "originalNumber": 47, "title": "Question #9 Topic 2", "topic": 2, "question": "The Apache Web Server Identification Rule is configured with the following Criterion attributes:Class -Configuration file -Version -Yesterday, an Apache Web Server CI was discovered as part of Service Mapping. Today, the application owner upgraded Apache to a different version and reran discovery of the service. What will happen in the CMDB?", "options": [{"id": "A", "text": "The existing Apache Web Server CI will be reconciled and its version will be updated."}, {"id": "B", "text": "A duplication error will occur."}, {"id": "C", "text": "The Apache Web Server CI will be reclassified as a Web Server CI."}, {"id": "D", "text": "A new Apache Web Server CI is created."}], "correct": ["D"], "sourceLabel": "official", "sourceUrl": "https://www.examtopics.com/discussions/_/view/984795"}, {"id": "q48", "originalNumber": 48, "title": "Question #10 Topic 2", "topic": 2, "question": "Configuration Management requires an accurate inventory of devices to be reflected in the CMDB. Which are common use cases for using Agent Client Collector (ACC)? (Choose two.)", "options": [{"id": "A", "text": "Network devices in the DMZ"}, {"id": "B", "text": "Devices that intermittently connect to the network"}, {"id": "C", "text": "Servers in the data center"}, {"id": "D", "text": "Devices in secure environments"}], "correct": ["B", "D"], "sourceLabel": "official", "sourceUrl": "https://www.examtopics.com/discussions/_/view/984796"}, {"id": "q49", "originalNumber": 49, "title": "Question #11 Topic 2", "topic": 2, "question": "An organization needs to maintain non-discoverable attributes, such as warranty expiration dates, for hardware CIs. These attributes are not updated by automated discovery tools. What method ensures these attributes are accurately maintained for all CIs?", "options": [{"id": "A", "text": "Create a new CI class specifically for non-discoverable attributes"}, {"id": "B", "text": "Use the CMDB Reconciliation Engine to update the attributes"}, {"id": "C", "text": "Use a scheduled data import to update the attributes from an external source"}], "correct": ["C"], "sourceLabel": "official", "sourceUrl": "https://www.examtopics.com/discussions/_/view/984797"}, {"id": "q51", "originalNumber": 51, "title": "Question #13 Topic 2", "topic": 2, "question": "When integrating data into the CMDB using import sets and transform maps, which type of script is added to ensure the data is processed through the IRE?", "options": [{"id": "A", "text": "onBefore"}, {"id": "B", "text": "onComplete"}, {"id": "C", "text": "onStart"}, {"id": "D", "text": "onAfter"}], "correct": ["A"], "sourceLabel": "official", "sourceUrl": "https://www.examtopics.com/discussions/_/view/984799"}, {"id": "q52", "originalNumber": 52, "title": "Question #14 Topic 2", "topic": 2, "question": "The following Reconciliation Rules were configured for ServiceNow, Altiris, and SCCM:Which are true? (Choose two.)", "options": [{"id": "A", "text": "Data collected with a discovery source of SCCM can update any record in the Windows Server [cmdb_ci_win_server] table because it has the highest priority number."}, {"id": "B", "text": "Data collected with a discovery source of ServiceNow can insert new records into the Windows Server [cmdb_ci_win_server] table, but cannot update records created by Altiris or SCCM."}, {"id": "C", "text": "Data collected with a discovery source of Altiris can update records inserted by SCCM into the Windows Server [cmdb_ci_win_server] table."}, {"id": "D", "text": "Data collected with a discovery source of SCCM can be inserted as new records in the Windows Server [cmdb_ci_win_server] table."}], "correct": ["C", "D"], "sourceLabel": "official", "sourceUrl": "https://www.examtopics.com/discussions/_/view/984800"}, {"id": "q53", "originalNumber": 53, "title": "Question #15 Topic 2", "topic": 2, "question": "A CMDB Administrator has installed a Service Graph Connector and customized a script transform. What will happen on subsequent upgrades if the default definition of the script transform is updated?", "options": [{"id": "A", "text": "A skipped change is created and no change is made the script transform definition."}, {"id": "B", "text": "The Service Graph Connector upgrade refuses to start."}, {"id": "C", "text": "The upgrade stops and reports an error."}], "correct": ["A"], "sourceLabel": "official", "sourceUrl": "https://www.examtopics.com/discussions/_/view/984801"}, {"id": "q54", "originalNumber": 54, "title": "Question #16 Topic 2", "topic": 2, "question": "A Windows server is reclassified from the Server table [cmdb_ci_server] to the Windows Server table [cmdb_ci_win_server] when processed through the Identification and Reconciliation Engine (IRE). Which process occurred?", "options": [{"id": "A", "text": "Class Change"}, {"id": "B", "text": "Class Switch"}, {"id": "C", "text": "Class Downgrade"}, {"id": "D", "text": "Class Upgrade"}], "correct": ["D"], "sourceLabel": "official", "sourceUrl": "https://www.examtopics.com/discussions/_/view/992323"}, {"id": "q56", "originalNumber": 56, "title": "Question #18 Topic 2", "topic": 2, "question": "An organization utilizes multiple data sources to update its CMDB, each assigned a different priority level. A high-priority data source is scheduled to update server records weekly. However, due to an integration issue, the high-priority data source stops updating the records. Which configuration can be used to allow a lower-priority data source to update records after a specified period of inactivity from the higher-priority source?", "options": [{"id": "A", "text": "Data Refresh Rules"}, {"id": "B", "text": "Reconciliation Rules"}, {"id": "C", "text": "Health Inclusion Rules"}, {"id": "D", "text": "Identification Rules"}], "correct": ["A"], "sourceLabel": "official", "sourceUrl": "https://www.examtopics.com/discussions/_/view/992325"}, {"id": "q57", "originalNumber": 57, "title": "Question #19 Topic 2", "topic": 2, "question": "A CMDB Administrator has imported data into the ServiceNow CMDB from a third-party source using a Service Graph Connector. The Administrator wants to review specific field to field mappings for the import. Which feature will show that information?", "options": [{"id": "A", "text": "Integration Hub"}, {"id": "B", "text": "IntegrationHub ETL"}, {"id": "C", "text": "CMDB Integrations Dashboard"}], "correct": ["B"], "sourceLabel": "official", "sourceUrl": "https://www.examtopics.com/discussions/_/view/992326"}, {"id": "q58", "originalNumber": 58, "title": "Question #20 Topic 2", "topic": 2, "question": "What are the characteristics or functions of ServiceNow IntegrationHub ETL? (Choose two.)", "options": [{"id": "A", "text": "Integrates third-party data into the CMDB or into non-CM DB tables"}, {"id": "B", "text": "Uses the IRE to process and integrate data"}, {"id": "C", "text": "Imports Microsoft SCCM/Intune data into the CMDB"}, {"id": "D", "text": "Performs discovery data collection and updates the CMDB"}], "correct": ["A", "B"], "sourceLabel": "official", "sourceUrl": "https://www.examtopics.com/discussions/_/view/992327"}, {"id": "q59", "originalNumber": 59, "title": "Question #21 Topic 2", "topic": 2, "question": "A CMDB Administrator needs to ingest relevant data from Microsoft SCCM into the CMDB. Which ingestion method brings the fastest time to value?", "options": [{"id": "A", "text": "Import Sets"}, {"id": "B", "text": "Service Graph Connectors"}, {"id": "C", "text": "Agent Client Collector"}, {"id": "D", "text": "IntegrationHub ETL"}], "correct": ["B"], "sourceLabel": "official", "sourceUrl": "https://www.examtopics.com/discussions/_/view/992328"}, {"id": "q60", "originalNumber": 60, "title": "Question #22 Topic 2", "topic": 2, "question": "A CMDB Administrator changes the query for the SCCM Service Graph Connector. What is the impact of this change?", "options": [{"id": "A", "text": "Any Scheduled Jobs for the SCCM Service Graph Connector will need to be configured."}, {"id": "B", "text": "Any updates for the SCCM Service Graph Connector will be skipped during the upgrade."}, {"id": "C", "text": "The Data Source for the SCCM Service Graph Connector will be marked as Inactive."}], "correct": ["B"], "sourceLabel": "official", "sourceUrl": "https://www.examtopics.com/discussions/_/view/992329"}, {"id": "q61", "originalNumber": 61, "title": "Question #23 Topic 2", "topic": 2, "question": "A CMDB Administrator needs to prevent duplicate CI creation from import sets that load data into the CMDB from vendor shipment files containing CI information. How can the Administrator do this?", "options": [{"id": "A", "text": "Set the coalesce on two mappings within the transform map"}, {"id": "B", "text": "Create comparison rules in the IRE"}, {"id": "C", "text": "Set the system property to utilize the IRE within transform maps"}, {"id": "D", "text": "Use the CMDBTransformUtil API in the transform script"}], "correct": ["D"], "sourceLabel": "official", "sourceUrl": "https://www.examtopics.com/discussions/_/view/992330"}, {"id": "q62", "originalNumber": 62, "title": "Question #24 Topic 2", "topic": 2, "question": "A ServiceNow Administrator wants to implement Service Graph Connectors to provide integrations to many third-party solutions that the company wants integrated into the CMDB. Which categories of connectors are available to the Administrator? (Choose two.)", "options": [{"id": "A", "text": "DevOps"}, {"id": "B", "text": "Cloud"}, {"id": "C", "text": "Workflow Automation"}, {"id": "D", "text": "Observability"}], "correct": ["B", "D"], "sourceLabel": "official", "sourceUrl": "https://www.examtopics.com/discussions/_/view/992331"}, {"id": "q63", "originalNumber": 63, "title": "Question #25 Topic 2", "topic": 2, "question": "The Server [cmdb_ci_server] class uses a dynamic reconciliation rule of lowest value for the Disk Space (GB) field, while the Windows Server [cmdb_ci_win_server] class uses a dynamic reconciliation rule of most reported for the Disk Space (GB) field. Given the following data sources that populate Windows Server data into the CMDB 360/Multisource CMDB:Which value would be added to the CMDB for the Disk Space (GB) field of a Windows Server [cmdb_ci_win_server] record?", "options": [{"id": "A", "text": "80"}, {"id": "B", "text": "75"}, {"id": "C", "text": "50"}], "correct": ["B"], "sourceLabel": "official", "sourceUrl": "https://www.examtopics.com/discussions/_/view/992332"}, {"id": "q64", "originalNumber": 64, "title": "Question #26 Topic 2", "topic": 2, "question": "A Configuration Manager needs to ingest third-party CIs into the CMDB. Which method minimizes the risk of technical debt?", "options": [{"id": "A", "text": "Vendor-provided integration"}, {"id": "B", "text": "Table API"}, {"id": "C", "text": "Service Graph Connector"}, {"id": "D", "text": "Import Sets and Transform Maps"}], "correct": ["C"], "sourceLabel": "official", "sourceUrl": "https://www.examtopics.com/discussions/_/view/992333"}, {"id": "q65", "originalNumber": 65, "title": "Question #27 Topic 2", "topic": 2, "question": "Which ServiceNow solutions automatically create relationships between CI Applications that are part of an Application Service? (Choose two.)", "options": [{"id": "A", "text": "IntegrationHub ETL"}, {"id": "B", "text": "Event Management"}, {"id": "C", "text": "Discovery"}, {"id": "D", "text": "Service Mapping"}, {"id": "E", "text": "Data Manager"}], "correct": ["C", "D"], "sourceLabel": "official", "sourceUrl": "https://www.examtopics.com/discussions/_/view/992334"}, {"id": "q66", "originalNumber": 66, "title": "Question #28 Topic 2", "topic": 2, "question": "A CMDB Administrator wants to leverage dynamic reconciliation rules. Which feature must be enabled?", "options": [{"id": "A", "text": "CMDB Data Manager"}, {"id": "B", "text": "CMDB 360/Multisource CMDB"}, {"id": "C", "text": "CMDB Workspace"}, {"id": "D", "text": "Reconciliation Rules"}], "correct": ["B"], "sourceLabel": "official", "sourceUrl": "https://www.examtopics.com/discussions/_/view/992335"}, {"id": "q67", "originalNumber": 67, "title": "Question #29 Topic 2", "topic": 2, "question": "A CMDB Administrator needs the fastest time to value solution for effectively ingesting, managing, and maintaining CIs and relationships. Which management tool will accomplish this to import Windows computer data from SCCM?", "options": [{"id": "A", "text": "IntegrationHub ETL connection to SCCM using Robust Transform Engine (RTE)"}, {"id": "B", "text": "Import set using JDBC data source connection to SCCM using transform maps"}, {"id": "C", "text": "SCCM Service Graph Connector"}, {"id": "D", "text": "SCCM Usage Metering Spoke"}], "correct": ["C"], "sourceLabel": "official", "sourceUrl": "https://www.examtopics.com/discussions/_/view/992336"}, {"id": "q68", "originalNumber": 68, "title": "Question #30 Topic 2", "topic": 2, "question": "A CMDB Administrator has installed a Service Graph Connector (SGC), and then made customizations to the mappings. Which is a consequence of this action?", "options": [{"id": "A", "text": "Fields populated by a customization will have a special tag associated with them in the CMDB."}, {"id": "B", "text": "The customization will prevent the SGC from executing without an approval record attached to the affected mapping record."}, {"id": "C", "text": "The customized mappings are not supported by ServiceNow, and the customer is responsible for supporting their own customized SGC."}], "correct": ["C"], "sourceLabel": "official", "sourceUrl": "https://www.examtopics.com/discussions/_/view/992337"}, {"id": "q69", "originalNumber": 69, "title": "Question #31 Topic 2", "topic": 2, "question": "A CMDB Data Owner has requested belter insights on the different data sources that make up the CMDB data set. The Platform Owner knows that the new Service Graph Connector Central plugin is just what is needed. After installing the plugin, what workspace will have the new Service Graph Connector Central tab available?", "options": [{"id": "A", "text": "Discovery Admin Workspace"}, {"id": "B", "text": "CMDB Workspace"}, {"id": "C", "text": "Service Graph Connector Workspace"}], "correct": ["B"], "sourceLabel": "official", "sourceUrl": "https://www.examtopics.com/discussions/_/view/992338"}, {"id": "q70", "originalNumber": 70, "title": "Question #1 Topic 3", "topic": 3, "question": "A CMDB Administrator would like to minimize stale CIs in the CMDB. Which CMDB Health Dashboard scorecard displays this information?", "options": [{"id": "A", "text": "Correctness"}, {"id": "B", "text": "Compliance"}, {"id": "C", "text": "Completeness"}], "correct": ["A"], "sourceLabel": "official", "sourceUrl": "https://www.examtopics.com/discussions/_/view/984802"}, {"id": "q72", "originalNumber": 72, "title": "Question #3 Topic 3", "topic": 3, "question": "A CMDB Administrator is asked to clean up the CMDB duplicates. What is the preferred way to manage this task?", "options": [{"id": "A", "text": "My Tasks in the Application Navigator"}, {"id": "B", "text": "The de-duplication task module"}, {"id": "C", "text": "The de-duplication dashboard on the CMDB workspace"}], "correct": ["C"], "sourceLabel": "official", "sourceUrl": "https://www.examtopics.com/discussions/_/view/984804"}, {"id": "q73", "originalNumber": 73, "title": "Question #4 Topic 3", "topic": 3, "question": "A CMDB Administrator identifies duplicate CIs. One was created by a manual import, and the other one was created by automated discovery. The discovered CI has the latest IP address, while the manually imported CI has an accurate relationship to a critical business application. How does the Administrator use the Duplicate CI Remediator to resolve this issue?", "options": [{"id": "A", "text": "Retain the manually imported CI, and delete the discovered CI"}, {"id": "B", "text": "Merge the two CIs automatically, retaining all attributes from the discovered CI"}, {"id": "C", "text": "Retain the discovered CI, but merge the relationship from the manually imported CI"}, {"id": "D", "text": "Retain the discovered CI, and delete the manually imported CI"}], "correct": ["C"], "sourceLabel": "official", "sourceUrl": "https://www.examtopics.com/discussions/_/view/984805"}, {"id": "q74", "originalNumber": 74, "title": "Question #5 Topic 3", "topic": 3, "question": "A CMDB Administrator wants to remove all Linux Servers in the organization that have not been updated in six months. Which recommended action does the Administrator take in Data Manager?", "options": [{"id": "A", "text": "Create a business rule"}, {"id": "B", "text": "Create an archive policy"}, {"id": "C", "text": "Create a scheduled job"}], "correct": ["B"], "sourceLabel": "official", "sourceUrl": "https://www.examtopics.com/discussions/_/view/984806"}, {"id": "q75", "originalNumber": 75, "title": "Question #6 Topic 3", "topic": 3, "question": "The CMDB Administrator group aims to display meaningful results on the CMDB Health Dashboard Compliance Scorecard for server records that are not on the latest patch. What must be configured to achieve this goal?", "options": [{"id": "A", "text": "Certification Policies, Data Filters, Scheduled Jobs"}, {"id": "B", "text": "Stale, Orphan, Duplicate"}, {"id": "C", "text": "Certification Filter, Certification Template, Audit"}, {"id": "D", "text": "Technical Service Offerings, Dynamic CI Groups, CMDB Groups"}], "correct": ["C"], "sourceLabel": "official", "sourceUrl": "https://www.examtopics.com/discussions/_/view/984807"}, {"id": "q76", "originalNumber": 76, "title": "Question #7 Topic 3", "topic": 3, "question": "A CMDB Administrator has been tasked with gathering information for a presentation to leadership. The Administrator needs to provide Duplicate CI, Orphan CI, and Stale CI metrics. Which scorecard provides this information on the CMDB Health Dashboard?", "options": [{"id": "A", "text": "Completeness"}, {"id": "B", "text": "Compliance"}, {"id": "C", "text": "Correctness"}], "correct": ["C"], "sourceLabel": "official", "sourceUrl": "https://www.examtopics.com/discussions/_/view/984808"}, {"id": "q77", "originalNumber": 77, "title": "Question #8 Topic 3", "topic": 3, "question": "What is the difference between Data Certification and Attestation policies when managing a CI?", "options": [{"id": "A", "text": "Attestation requires correcting specific attributes of a CI, while Data Certification tracks acknowledgement the CI still exists."}, {"id": "B", "text": "Attestation can be scheduled, while Data Certification cannot be scheduled."}, {"id": "C", "text": "Attestation tracks acknowledgement the CI still exists, while Data Certification requires validating specific attributes of a CI."}, {"id": "D", "text": "Attestation can be assigned to a Group or an individual, while Data Certification can only be assigned to an individual."}], "correct": ["C"], "sourceLabel": "official", "sourceUrl": "https://www.examtopics.com/discussions/_/view/984809"}, {"id": "q78", "originalNumber": 78, "title": "Question #9 Topic 3", "topic": 3, "question": "A CMDB Administrator is reviewing the health of the CMDB and notices a large percentage of the Hardware CIs are missing serial numbers. The Administrator is concerned this may cause duplicate CIs and would like to resolve the issue in a timely manner. What structured guidelines provided by ServiceNow are available to troubleshoot and resolve the issue?", "options": [{"id": "A", "text": "CMDB Health Dashboards Playbooks"}, {"id": "B", "text": "CSDM Now Create Playbooks"}, {"id": "C", "text": "CSDB Data Foundations Dashboard Playbooks"}, {"id": "D", "text": "CSDM Data Foundations Dashboard Playbooks"}], "correct": ["C"], "sourceLabel": "official", "sourceUrl": "https://www.examtopics.com/discussions/_/view/984810"}, {"id": "q79", "originalNumber": 79, "title": "Question #10 Topic 3", "topic": 3, "question": "Configuration Management needs to ensure data quality for all CIs in the CMDB. What areas of data quality for CIs are in the CMDB Health Dashboard? (Choose two.)", "options": [{"id": "A", "text": "Missing CIs"}, {"id": "B", "text": "State CIs"}, {"id": "C", "text": "Duplicate CIs"}, {"id": "D", "text": "Downgraded CIs"}, {"id": "E", "text": "Upgraded CIs"}], "correct": ["B", "C"], "sourceLabel": "official", "sourceUrl": "https://www.examtopics.com/discussions/_/view/984811"}, {"id": "q80", "originalNumber": 80, "title": "Question #11 Topic 3", "topic": 3, "question": "A CMDB Configuration Manager is reviewing the metrics on the CMDB Health Dashboard’s Correctness Scorecard for the Server class which consists of a total of 60,000 servers in the CMDB. For the Duplicate metric, it shows Healthy CIs/Evaluated as 59,000/60,000. For the Orphan metric, it shows Healthy CIs/Evaluated as 45,000/50,000. Which configuration explains the difference in the scope of Server CIs (60,000 vs.50,000) evaluated between the two metrics?", "options": [{"id": "A", "text": "The Duplicate metric has a CMDB Group configured for the Server class."}, {"id": "B", "text": "The Duplicate metric has a Health Inclusion rule configured for the Server class."}, {"id": "C", "text": "The Orphan metric has a Health Inclusion rule configured for the Server class."}, {"id": "D", "text": "The Orphan metric has a CMDB Group configured for the Server class."}], "correct": ["C"], "sourceLabel": "official", "sourceUrl": "https://www.examtopics.com/discussions/_/view/984812"}, {"id": "q81", "originalNumber": 81, "title": "Question #12 Topic 3", "topic": 3, "question": "CMDB class owners are receiving tasks under the ‘My Work’ tab in the CMDB Workspace. Which CMDB management tool is generating these tasks?", "options": [{"id": "A", "text": "CMDB Data Manager"}, {"id": "B", "text": "De-duplication templates"}, {"id": "C", "text": "CMDB Health Dashboard"}], "correct": ["A"], "sourceLabel": "official", "sourceUrl": "https://www.examtopics.com/discussions/_/view/984813"}, {"id": "q82", "originalNumber": 82, "title": "Question #13 Topic 3", "topic": 3, "question": "What ensures data volume in the CMDB manageable?", "options": [{"id": "A", "text": "Scheduled Jobs"}, {"id": "B", "text": "Archive Policies"}, {"id": "C", "text": "Business Rules"}], "correct": ["B"], "sourceLabel": "official", "sourceUrl": "https://www.examtopics.com/discussions/_/view/984814"}, {"id": "q83", "originalNumber": 83, "title": "Question #14 Topic 3", "topic": 3, "question": "A CMDB Manager wants to improve data quality using the CMDB Health Dashboard. What needs to happen to generate CMDB health scores?", "options": [{"id": "A", "text": "Nothing, CMDB health scores are calculated by default"}, {"id": "B", "text": "The plugin, CMDB health calculation, needs to be installed"}, {"id": "C", "text": "The scheduled jobs for the CMDB Health Dashboard must be activated"}], "correct": ["C"], "sourceLabel": "official", "sourceUrl": "https://www.examtopics.com/discussions/_/view/984815"}, {"id": "q84", "originalNumber": 84, "title": "Question #15 Topic 3", "topic": 3, "question": "The CMDB Configuration Manager is using the CI Class Manager to manage the group ownership of CI classes and needs to leverage the ownership value specified in the CI Class Manager. When configuring a CMDB Data Manager policy, which group reference field should be set?", "options": [{"id": "A", "text": "Change Group"}, {"id": "B", "text": "Approval Group"}, {"id": "C", "text": "Managed By Group"}, {"id": "D", "text": "Support Group"}], "correct": ["C"], "sourceLabel": "official", "sourceUrl": "https://www.examtopics.com/discussions/_/view/984816"}, {"id": "q85", "originalNumber": 85, "title": "Question #16 Topic 3", "topic": 3, "question": "The CMDB Configuration Management team wants to manage de-duplication tasks generated from data ingested into the CMDB via the Identification and Reconciliation Engine (IRE). In which area of the CMDB Workspace can they locate these de-duplication tasks?", "options": [{"id": "A", "text": "Important actions tile under the Home tab"}, {"id": "B", "text": "CMDB feature adoption tile under the Insight tab"}, {"id": "C", "text": "Total status tile under the My Work tab"}], "correct": ["A"], "sourceLabel": "official", "sourceUrl": "https://www.examtopics.com/discussions/_/view/984817"}, {"id": "q86", "originalNumber": 86, "title": "Question #17 Topic 3", "topic": 3, "question": "Which type of CMDB Data Manager policy creates tasks that allow the assigned individual to update fields on the CI record?", "options": [{"id": "A", "text": "Compliance"}, {"id": "B", "text": "Certification"}, {"id": "C", "text": "Attestation"}, {"id": "D", "text": "Audit"}], "correct": ["B"], "sourceLabel": "official", "sourceUrl": "https://www.examtopics.com/discussions/_/view/984818"}, {"id": "q89", "originalNumber": 89, "title": "Question #20 Topic 3", "topic": 3, "question": "A Configuration Manager needs to leverage a policy type to automate the creation and assignment of tasks to validate the existence of CIs. Which policy type should be used to accomplish this goal?", "options": [{"id": "A", "text": "Retire"}, {"id": "B", "text": "Certification"}, {"id": "C", "text": "Delete"}, {"id": "D", "text": "Attestation"}], "correct": ["D"], "sourceLabel": "official", "sourceUrl": "https://www.examtopics.com/discussions/_/view/984821"}, {"id": "q90", "originalNumber": 90, "title": "Question #21 Topic 3", "topic": 3, "question": "Which is a purpose or requirement of CMDB Data Manager in ServiceNow?", "options": [{"id": "A", "text": "Encrypts archived records for enhanced security"}, {"id": "B", "text": "Automates the enforcement of relationship rules between CIs in the CMDB"}, {"id": "C", "text": "Automates the archival and deletion of records based on retention policies"}], "correct": ["C"], "sourceLabel": "official", "sourceUrl": "https://www.examtopics.com/discussions/_/view/984822"}, {"id": "q91", "originalNumber": 91, "title": "Question #22 Topic 3", "topic": 3, "question": "A CMDB Data Manager needs to access the ServiceNow platform to create, publish, and manage policies that automate and govern CI lifecycle operations, ensuring the CMDB remains healthy and efficient. Where can the Data Manager do this?", "options": [{"id": "A", "text": "CMDB Workspace Management tab"}, {"id": "B", "text": "Service Operations Workspace"}, {"id": "C", "text": "CMDB Workspace CMDB 360 tab"}, {"id": "D", "text": "CI Class Manager"}], "correct": ["A"], "sourceLabel": "official", "sourceUrl": "https://www.examtopics.com/discussions/_/view/984823"}, {"id": "q92", "originalNumber": 92, "title": "Question #23 Topic 3", "topic": 3, "question": "A CMDB Administrator wants to ensure all short-lived CIs that have not been discovered in the past week are removed. After retiring the CI records, which recommended action does the CMDB Administrator take?", "options": [{"id": "A", "text": "Create a delete police"}, {"id": "B", "text": "Create a business rule"}, {"id": "C", "text": "Create a scheduled job"}], "correct": ["A"], "sourceLabel": "official", "sourceUrl": "https://www.examtopics.com/discussions/_/view/992339"}, {"id": "q93", "originalNumber": 93, "title": "Question #24 Topic 3", "topic": 3, "question": "A CMDB Administrator has taken over management of a ServiceNow instance and has determined there are multiple deficiencies in the CMDB. During review of the CMDB Data Foundations Dashboard, the Administrator sees that ServiceNow offers Remediation Playbooks. How can Playbooks assist the Administrator in resolving these issues?", "options": [{"id": "A", "text": "Playbooks can be installed in the instance to automatically fix issues."}, {"id": "B", "text": "Playbooks can help analyze and fix issues."}, {"id": "C", "text": "Playbooks can automatically track common CMDB issues and output metrics."}], "correct": ["B"], "sourceLabel": "official", "sourceUrl": "https://www.examtopics.com/discussions/_/view/992340"}, {"id": "q94", "originalNumber": 94, "title": "Question #25 Topic 3", "topic": 3, "question": "A CMDB Administrator utilizing the CMDB Data Foundations Dashboard sees an issue and wants to run a playbook. Which types of documentation can they expect to be provided in a playbook? (Choose two.)", "options": [{"id": "A", "text": "Root Cause"}, {"id": "B", "text": "Automated Remediations"}, {"id": "C", "text": "Problem Analysis"}, {"id": "D", "text": "Problem Overview"}], "correct": ["C", "D"], "sourceLabel": "official", "sourceUrl": "https://www.examtopics.com/discussions/_/view/992341"}, {"id": "q95", "originalNumber": 95, "title": "Question #26 Topic 3", "topic": 3, "question": "A CMDB Administrator is considering whether to start using the playbooks provided on the CMDB Data Foundation Dashboard. What are the benefits to support the decision to leverage this feature? (Choose two.)", "options": [{"id": "A", "text": "Offers automated scripts to resolve poorly performing metrics"}, {"id": "B", "text": "Offers insight into the downstream impacts of poorly performing metrics"}, {"id": "C", "text": "Offers remediation options to address and improve poorly performing metrics"}, {"id": "D", "text": "Offers remediation templates to improve poorly performing metrics"}], "correct": ["B", "C"], "sourceLabel": "official", "sourceUrl": "https://www.examtopics.com/discussions/_/view/992342"}, {"id": "q96", "originalNumber": 96, "title": "Question #27 Topic 3", "topic": 3, "question": "A CMDB Administrator is beginning the journey of populating the CMDB and needs to verify that any data which is no longer useful/applicable is removed. Which governance management tool will accomplish this?", "options": [{"id": "A", "text": "CI Class Manager"}, {"id": "B", "text": "CMDB and CSDM Data Foundations Dashboard"}, {"id": "C", "text": "CMDB Data Manager"}, {"id": "D", "text": "De-duplication Templates"}, {"id": "E", "text": "CMDB Health Dashboard"}], "correct": ["C"], "sourceLabel": "official", "sourceUrl": "https://www.examtopics. board's Correctness Scorecard. For the Duplicate metric in the Server class, it shows Healthy CIs/Evaluated as 59,000/60,000. What does this indicate about the scope of server records calculated under this metric?", "options": [{"id": "A", "text": "1,000 server records are in scope for this metric"}, {"id": "B", "text": "60,000 server records are in scope for this metric"}, {"id": "C", "text": "59,000 Linux and 60,000 Windows servers records are in scope for this metric"}, {"id": "D", "text": "59,000 server records are in scope for this metric"}], "correct": ["B"], "sourceLabel": "official", "sourceUrl": "https://www.examtopics.com/discussions/_/view/992362"}, {"id": "q116", "originalNumber": 116, "title": "Question #47 Topic 3", "topic": 3, "question": "A CMDB Administrator wants to start utilizing the CMDB Health Dashboard and its Key Performance Indicators. What does the Administrator do to start using the dashboard?", "options": [{"id": "A", "text": "Download the dashboard from the ServiceNow store"}, {"id": "B", "text": "Nothing, the dashboard is activated by default"}, {"id": "C", "text": "Activate the dashboard scheduled jobs"}, {"id": "D", "text": "Activate the dashboard system property"}], "correct": ["C"], "sourceLabel": "official", "sourceUrl": "https://www.examtopics.com/discussions/_/view/992363"}, {"id": "q117", "originalNumber": 117, "title": "Question #48 Topic 3", "topic": 3, "question": "Which are CMDB Data Manager end of life policy types? (Choose two.)", "options": [{"id": "A", "text": "Archive"}, {"id": "B", "text": "Retire"}, {"id": "C", "text": "Lost"}, {"id": "D", "text": "Decommission"}, {"id": "E", "text": "Disposed"}], "correct": ["A", "B"], "sourceLabel": "official", "sourceUrl": "https://www.examtopics.com/discussions/_/view/992364"}, {"id": "q118", "originalNumber": 118, "title": "Question #49 Topic 3", "topic": 3, "question": "A CMDB team has noticed that some hardware CIs are missing the serial number information, making it difficult  #5 Topic 4", "topic": 4, "question": "A healthcare provider faces a critical incident affecting its patient management system. The provider needs to determine the users impacted to mitigate disruption effectively. Which CSDM-related data should they leverage?", "options": [{"id": "A", "text": "Incident history of similar CIs"}, {"id": "B", "text": "Application Service environment attribute"}, {"id": "C", "text": "Service Offerings by Department or Location"}, {"id": "D", "text": "Affected CI [task_ci] related list"}], "correct": ["C"], "sourceLabel": "official", "sourceUrl": "https://www.examtopics.com/discussions/_/view/984828"}, {"id": "q133", "originalNumber": 133, "title": "Question #6 Topic 4", "topic": 4, "question": "A Configuration Manager wants to use the Unified Map. Where would it be accessed?", "options": [{"id": "A", "text": "CMDB Data Manager"}, {"id": "B", "text": "CI Class Manager"}, {"id": "C", "text": "CMDB Workspace"}], "correct": ["C"], "sourceLabel": "official", "sourceUrl": "https://www.examtopics.com/discussions/_/view/984829"}, {"id": "q134", "originalNumber": 134, "title": "Question #7 Topic 4", "topic": 4, "question": "A service owner is using Unified Map to understand to composition of a service but wants to filter out irrelevant information. Which options are available to the service owner from the filter panel? (Choose two.)", "options": [{"id": "A", "text": "Discovery source"}, {"id": "B", "text": "CI type"}, {"id": "C", "text": "Business critically"}, {"id": "D", "text": "Managed by group"}], "correct": ["A", "B"], "sourceLabel": "official", "sourceUrl": "https://www.examtopics.com/discussions/_/view/984830"}, {"id": "q135", "originalNumber": 135, "title": "Question #8 Topic 4", "topic": 4, "question": "A CMDB Administrator wants to create a CMDB query to find all databases located in Seattle that are connected to application services. They also want to include incidents related to those databases. Which actions does the company take : "q138", "originalNumber": 138, "title": "Question #11 Topic 4", "topic": 4, "question": "A CMDB Administrator needs insights into how their CMDB is configured according to ServiceNow recommended practice. Which should be used?", "options": [{"id": "A", "text": "CMDB Health Dashboard"}, {"id": "B", "text": "CMDB Workspace"}, {"id": "C", "text": "CMDB Data Manager"}, {"id": "D", "text": "CMDB Data Foundation Dashboard"}], "correct": ["D"], "sourceLabel": "official", "sourceUrl": "https://www.examtopics.com/discussions/_/view/992377"}, {"id": "q139", "originalNumber": 139, "title": "Question #12 Topic 4", "topic": 4, "question": "What is the value of using the CMDB in security operations? (Choose two.)", "options": [{"id": "A", "text": "Auto-resolves a vulnerability"}, {"id": "B", "text": "Identifies the IT infrastructure with a vulnerability"}, {"id": "C", "text": "Enables audits and attestations across CIs"}, {"id": "D", "text": "Allows security team to assess and remediate an incident"}], "correct": ["B", "D"], "sourceLabel": "official", "sourceUrl": "https://www.examtopics.com/discussions/_/view/992378"}, {"id": "q140", "originalNumber": 140, "title": "Question #13 Topic 4", "topic": 4, "question": "The CMDB Configuration Management team has successfully developed a healthy and trusted CMDB. They have integrated discovered infrastructure data, accurately referenced non-discoverable data (such as change and support group information), and made the CMDB service-aware using Service Mapping. How will these improvements enhance the change management process? (Choose two.)", "options": [{"id": "A", "text": "Provides insight into the potential impact of the change"}, {"id": "B", "text": "Ensures that no changes result in service downtime, regardless of planning or execution"}, {"id": "C", "text": "Automatically schedules and deploys changes without human review or approval"}, {"id": "D", "text": "Enables auto population of the assignment group field to dynamically route
