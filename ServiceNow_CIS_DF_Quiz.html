examtopics.com/discussions/_/view/992382"}, {"id": "q144", "originalNumber": 144, "title": "Question #17 Topic 4", "topic": 4, "question": "A CMDB Administrator wants to educate the team on the various actions that can be performed within the CMDB Workspace. What actions can be initiated from the CMDB Workspace? (Choose two.)", "options": [{"id": "A", "text": "Create a new CMDB class"}, {"id": "B", "text": "Execute ServiceNow Discovery"}, {"id": "C", "text": "Remediate duplicate CI records"}, {"id": "D", "text": "Create a CMDB Data Manager certification policy"}], "correct": ["B", "C"], "sourceLabel": "official", "sourceUrl": "https://www.examtopics.com/discussions/_/view/992383"}, {"id": "q145", "originalNumber": 145, "title": "Question #18 Topic 4", "topic": 4, "question": "A CMDB Administrator knows that the CMDB Data Foundation Dashboard is a resource to monitor and improve data quality. What is a benefit of this dashboard?", "options": [{"id": "A", "text": "Provides the ability to resolve certification policy tasks"}, {"id": "B", "text": "Provides the ability to configure health-related metrics"}, {"id": "C", "text": "Provides key health-related metrics to make decisions"}], "correct": ["C"], "sourceLabel": "official", "sourceUrl": "https://www.examtopics.com/discussions/_/view/992384"}, {"id": "q146", "originalNumber": 146, "title": "Question #19 Topic 4", "topic": 4, "question": "A CMDB Administrator is asked to create a query using the CMDB Query Builder that displays all operational CIs belonging to a specific application service. Which steps provide the desired outcome?", "options": [{"id": "A", "text": "1. Add the Business Application, Application Service, and Configuration Item classes to the canvas.2. Define a filter for the application service name and the operational status of the configuration items.3. Configure the relationship between the classes.4. Run the query."}, {"id": "B", "text": "1. Add the Application Service and Configuration Item classes to the canvas.2. Configure the relationship between the classes.3. Define a filter for the application service name and the operational status of the configuration items.4. Run the query."}, {"id": "C", "text": "1. Add the Application Service and Configuration Item classes to the canvas.2. Configure the relationship between the classes.3. Add the Operational Status and Name fields as columns.4. Run the query."}], "correct": ["B"], "sourceLabel": "official", "sourceUrl": "https://www.examtopics.com/discussions/_/view/992385"}, {"id": "q147", "originalNumber": 147, "title": "Question #20 Topic 4", "topic": 4, "question": "A Configuration Manager wants to explore ServiceNow CMDB 360 saved queries to see if the reports can assist with managing of CMDB data. What insights are gained from CMDB 360 queries? (Choose two.)", "options": [{"id": "A", "text": "Gaps in attribute data from different data sources"}, {"id": "B", "text": "Unique CIs created from different data sources"}, {"id": "C", "text": "Different attribute values from different data sources"}, {"id": "D", "text": "Orphan CIs created from different data sources"}, {"id": "E", "text": "Duplicate configuration items from different data sources"}], "correct": ["A", "C"], "sourceLabel": "official", "sourceUrl": "https://www.examtopics.com/discussions/_/view/992386"}, {"id": "q148", "originalNumber": 148, "title": "Question #21 Topic 4", "topic": 4, "question": "A CMDB Administrator wants to leverage the CMDB Data Foundations Dashboard. What are benefits of using this application?", "options": [{"id": "A", "text": "Checks that important data is valid and properly configured"}, {"id": "B", "text": "Has a framework to create custom metrics for the CMDB"}, {"id": "C", "text": "Provides playbooks to assist in the remediation of potential risks"}, {"id": "D", "text": "Uses automation to remediate potential risks"}], "correct": ["A", "C"], "sourceLabel": "official", "sourceUrl": "https://www.examtopics.com/discussions/_/view/992387"}, {"id": "q149", "originalNumber": 149, "title": "Question #22 Topic 4", "topic": 4, "question": "A Service Owner needs to view related items, such as Active Incidents and Planned Changes, directly on the home node of the Unified Map. Which work area would allow the Service Owner to meet this goal?", "options": [{"id": "A", "text": "Map"}, {"id": "B", "text": "Tool box"}, {"id": "C", "text": "Content controls"}, {"id": "D", "text": "Contextual side panel"}], "correct": ["D"], "sourceLabel": "official", "sourceUrl": "https://www.examtopics.com/discussions/_/view/992388"}, {"id": "q150", "originalNumber": 150, "title": "Question #23 Topic 4", "topic": 4, "question": "A CMDB Administrator wants to use the CMDB and CSDM Data Foundations Dashboard. Where can the Administrator obtain the dashboard?", "options": [{"id": "A", "text": "It is a free application on the ServiceNow Innovation Lab."}, {"id": "B", "text": "It is active by default."}, {"id": "C", "text": "It is a free application on the ServiceNow Store."}, {"id": "D", "text": "It is a paid application on the ServiceNow Store."}], "correct": ["C"], "sourceLabel": "official", "sourceUrl": "https://www.examtopics.com/discussions/_/view/992389"}, {"id": "q151", "originalNumber": 151, "title": "Question #24 Topic 4", "topic": 4, "question": "A Configuration Manager working in the CMDB Workspace wants to see how CIs are connected to each other. Which tool can be used?", "options": [{"id": "A", "text": "Relationship Map"}, {"id": "B", "text": "Business Service Map"}, {"id": "C", "text": "Unified Map"}], "correct": ["C"], "sourceLabel": "official", "sourceUrl": "https://www.examtopics.com/discussions/_/view/992390"}, {"id": "q152", "originalNumber": 152, "title": "Question #25 Topic 4", "topic": 4, "question": "An organization is using CMDB Query Builder to find all application services with a database that has incidents and all infrastructure in those application services. Which steps does the organization take to build this query? (Choose two.)", "options": [{"id": "A", "text": "Use a CMDB Query to include application services and their related infrastructure"}, {"id": "B", "text": "Use a Service Mapping Query to find all incidents related to the database"}, {"id": "C", "text": "Use a Service Mapping Query to include non-CMDB tables like the Incident table"}, {"id": "D", "text": "Add a non-CMDB table to the query"}], "correct": ["A", "D"], "sourceLabel": "official", "sourceUrl": "https://www.examtopics.com/discussions/_/view/992391"}, {"id": "q153", "originalNumber": 153, "title": "Question #1 Topic 5", "topic": 5, "question": "In a company there is a need to understand the CSDM maturity level needed. Different stakeholders listed a number of use cases that they expect over time. Which use case requires information objects?", "options": [{"id": "A", "text": "The Event Operations team wants to automate their events into incident for operational actions."}, {"id": "B", "text": "The Business Service Management team wants to understand the operational impact for their consumer parties."}, {"id": "C", "text": "The Customer Service team wants to onboard pro-active case management."}, {"id": "D", "text": "The SecOps team wants to understand the operational risk in the Business Application context."}, {"id": "E", "text": "The Asset Management wants to understand to asset life cycle compliancy in a Business Application context."}], "correct": ["D"], "sourceLabel": "official", "sourceUrl": "https://www.examtopics.com/discussions/_/view/984832"}, {"id": "q154", "originalNumber": 154, "title": "Question #2 Topic 5", "topic": 5, "question": "A Platform Owner is collaborating with stakeholders in the manufacturing industry to align their CIs with the CSDM 5 framework. They need to map production line monitoring systems to the appropriate CSDM domain. Which CSDM 5 domain does the Platform Owner use?", "options": [{"id": "A", "text": "Build and Integration (Build)"}, {"id": "B", "text": "Service Delivery (Manage Technical)"}, {"id": "C", "text": "Service Consumption (Sell/Consume)"}, {"id": "D", "text": "Design and Planning (Design)"}, {"id": "E", "text": "Foundation"}], "correct": ["B"], "sourceLabel": "official", "sourceUrl": "https://www.examtopics.com/discussions/_/view/984833"}, {"id": "q155", "originalNumber": 155, "title": "Question #3 Topic 5", "topic": 5, "question": "A development team is working on a project and an application will be deployed to many servers. There will be several security requirements that must be checked to adhere to lawful compliance because the application will be holding customer personal data (PII and PCI). Where in the CSDM does the development team look to store the information that will be used to satisfy the audits?", "options": [{"id": "A", "text": "Technology Management Service Offerings (Technical Service Offerings) and Dynamic CI Groups"}, {"id": "B", "text": "Business Applications and Information Objects"}, {"id": "C", "text": "Customer Service Offerings and Databases"}], "correct": ["B"], "sourceLabel": "official", "sourceUrl": "https://www.examtopics.com/discussions/_/view/984834"}, {"id": "q156", "originalNumber": 156, "title": "Question #4 Topic 5", "topic": 5, "question": "A customer’s CMDB is aligned to the CSDM Walk stage. What benefit is provided by the CMDB?", "options": [{"id": "A", "text": "Enables impact assessments for incident, problem, and change on Business Services"}, {"id": "B", "text": "Improves the implementation velocity of APM Foundation for future business application rationalization"}, {"id": "C", "text": "Allows for additional stratification of Technical team’s support structure along the lines of OLAs and commitments"}], "correct": ["C"], "sourceLabel": "official", "sourceUrl": "https://www.examtopics.com/discussions/_/view/984835"}, {"id": "q158", "originalNumber": 158, "title": "Question #6 Topic 5", "topic": 5, "question": "A CMDB Administrator wants to improve data quality related to the CSDM. Which action should the Administrator take to meet this goal?", "options": [{"id": "A", "text": "Use the default configured CMDB Health Dashboard"}, {"id": "B", "text": "Start the ServiceNow Health Scan"}, {"id": "C", "text": "Use the CSDM Data Foundation Dashboard"}], "correct": ["C"], "sourceLabel": "official", "sourceUrl": "https://www.examtopics.com/discussions/_/view/984837"}, {"id": "q159", "originalNumber": 159, "title": "Question #7 Topic 5", "topic": 5, "question": "According to the Common Service Data Model (CSDM), a server team is requesting a catalog item be created for infrastructure upgrade requests. Which role is involved in initiating the request and defining requirements?", "options": [{"id": "A", "text": "Enterprise Architecture"}, {"id": "B", "text": "Technology Service Owners"}, {"id": "C", "text": "Application Service Owners"}], "correct": ["B"], "sourceLabel": "official", "sourceUrl": "https://www.examtopics.com/discussions/_/view/984838"}, {"id": "q160", "originalNumber": 160, "title": "Question #8 Topic 5", "topic": 5, "question": "A CMDB Administrator is evaluating whether to monitor the metrics provided on the CMDB Foundation Dashboard. Which benefits support the decision to continually monitor the results on this dashboard? (Choose two.)", "options": [{"id": "A", "text": "Provides a list of all CIs that failed health audits"}, {"id": "B", "text": "Provides metrics for CIs Processed by the IRE"}, {"id": "C", "text": "Provides metrics on active CIs updated in the last 90 days"}, {"id": "D", "text": "Reports on all orphan CIs in the CMDB"}], "correct": ["B", "C"], "sourceLabel": "official", "sourceUrl": "https://www.examtopics.com/discussions/_/view/984839"}, {"id": "q161", "originalNumber": 161, "title": "Question #9 Topic 5", "topic": 5, "question": "The Configuration Manager is preparing the justification to utilize the CMDB Data Foundations Dashboard. Which benefits align with the usage of this dashboard? (Choose two.)", "options": [{"id": "A", "text": "It enables monitoring and tracking of CMDB health over time."}, {"id": "B", "text": "It provides actionable insights to improve data quality and completeness."}, {"id": "C", "text": "It helps detect and eliminate duplicate records in the CMDB."}, {"id": "D", "text": "It automates the approval process for change management."}], "correct": ["A", "B"], "sourceLabel": "official", "sourceUrl": "https://www.examtopics.com/discussions/_/view/984840"}, {"id": "q162", "originalNumber": 162, "title": "Question #10 Topic 5", "topic": 5, "question": "A Change Manager wants to gain value from CSDM. How will the Change Management process benefit from CSDM? (Choose two.)", "options": [{"id": "A", "text": "Identify blackout windows for the change"}, {"id": "B", "text": "Determine the root cause of the change issue"}, {"id": "C", "text": "Understand the impact of the change on services"}, {"id": "D", "text": "Route the change dynamically"}], "correct": ["C", "D"], "sourceLabel": "official", "sourceUrl": "https://www.examtopics.com/discussions/_/view/984841"}, {"id": "q163", "originalNumber": 163, "title": "Question #11 Topic 5", "topic": 5, "question": "Which are business values of CMDB? (Choose two.)", "options": [{"id": "A", "text": "Collecting and managing financial data"}, {"id": "B", "text": "Streaming incident and change management"}, {"id": "C", "text": "Strengthening operational resiliency"}, {"id": "D", "text": "Automating maintenance for CI relationships"}], "correct": ["B", "C"], "sourceLabel": "official", "sourceUrl": "https://www.examtopics.com/discussions/_/view/984842"}, {"id": "q164", "originalNumber": 164, "title": "Question #12 Topic 5", "topic": 5, "question": "A CMDB Administrator is implementing a Vulnerability Response or Security Incident Response and needs to ensure customers have enough context to estimate risk and set task priorities. Which Get Well Playbook from the CSDM Data Foundation Dashboard helps with this?", "options": [{"id": "A", "text": "Locations without a Parent Location"}, {"id": "B", "text": "Named Product Models without Product Owners"}, {"id": "C", "text": "Percentage of Custom Status Values for CI Life Cycle Stages"}, {"id": "D", "text": "Application Services with Business Application Relationships"}], "correct": ["D"], "sourceLabel": "official", "sourceUrl": "https://www.examtopics.com/discussions/_/view/984843"}, {"id": "q165", "originalNumber": 165, "title": "Question #13 Topic 5", "topic": 5, "question": "A CMDB Administrator wants to run the Services Have Owners Identified playbook to remediate the issues shown in the CMDB Data Foundations Dashboard. Which remediation plays would be used? (Choose two.)", "options": [{"id": "A", "text": "Govern Data"}, {"id": "B", "text": "Fix Data"}, {"id": "C", "text": "Report Data"}, {"id": "D", "text": "Analyze Data"}], "correct": ["B", "D"], "sourceLabel": "official", "sourceUrl": "https://www.examtopics.com/discussions/_/view/984844"}, {"id": "q166", "originalNumber": 166, "title": "Question #14 Topic 5", "topic": 5, "question": "A Configuration Management Governance team is transitioning from utilizing legacy CMDB status fields to CSDM life cycle status fields. Which table can be modified?", "options": [{"id": "A", "text": "Life Cycle Stages [life_cycle_stage]"}, {"id": "B", "text": "Life Cycle Mapping [life_cycle_mapping]"}, {"id": "C", "text": "Life Cycle Controls [life_cycle_control]"}, {"id": "D", "text": "Life Cycle Stage Status [life_cycle_stage_status]"}], "correct": ["B"], "sourceLabel": "official", "sourceUrl": "https://www.examtopics.com/discussions/_/view/984845"}, {"id": "q167", "originalNumber": 167, "title": "Question #15 Topic 5", "topic": 5, "question": "A CMDB Administrator, viewing the CMDB Data Foundations Dashboard, notices the Unique Locations Result percentage low. What is the recommended process from the associated playbook to correct this issue?", "options": [{"id": "A", "text": "Review both locations, update CIs with the correct location and delete the duplicate location"}, {"id": "B", "text": "Retain the location that matches the organization’s standard naming convention, and delete the duplicate without further validation"}, {"id": "C", "text": "Keep both locations as either can be used as a valid alternate location"}, {"id": "D", "text": "Use the Duplicate CI Remediator the merge the duplicate location records"}], "correct": ["A"], "sourceLabel": "official", "sourceUrl": "https://www.examtopics.com/discussions/_/view/984846"}, {"id": "q169", "originalNumber": 169, "title": "Question #17 Topic 5", "topic": 5, "question": "A Configuration Manager is planning the implementation of the CMDB. Which is the prescribed CSDM rollout order?", "options": [{"id": "A", "text": "Architecture, Business, Technical, Governance"}, {"id": "B", "text": "Initiate, Plan, Execute, Deliver, Close"}, {"id": "C", "text": "Foundation, Crawl, Walk, Run, Fly"}, {"id": "D", "text": "Initial, Developing, Defined, Managed"}], "correct": ["C"], "sourceLabel": "official", "sourceUrl": "https://www.examtopics.com/discussions/_/view/984848"}, {"id": "q170", "originalNumber": 170, "title": "Question #18 Topic 5", "topic": 5, "question": "A customer wants to model their business applications and would like to capture different types of data that includes Personally Identifiable Information (PII) data. Based on these requirements, which CMDB class needs to be leveraged to achieve this?", "options": [{"id": "A", "text": "API Component"}, {"id": "B", "text": "Information Object"}, {"id": "C", "text": "Business Capability"}, {"id": "D", "text": "Data Classification"}], "correct": ["B"], "sourceLabel": "official", "sourceUrl": "https://www.examtopics.com/discussions/_/view/992392"}, {"id": "q171", "originalNumber": 171, "title": "Question #19 Topic 5", "topic": 5, "question": "A CSDM Data Manager needs metrics on the alignment of product models, locations, and business units with best practices. Which tab in the CSDM Data Foundations Dashboard provides this information?", "options": [{"id": "A", "text": "Fly"}, {"id": "B", "text": "Crawl"}, {"id": "C", "text": "Foundation"}, {"id": "D", "text": "Run"}, {"id": "E", "text": "Walk"}], "correct": ["C"], "sourceLabel": "official", "sourceUrl": "https://www.examtopics.com/discussions/_/view/992393"}, {"id": "q172", "originalNumber": 172, "title": "Question #20 Topic 5", "topic": 5, "question": "A Service Portfolio Manager wants to know what Application Services their Business Service Offerings depend on. What stage of CSDM would map this relationship?", "options": [{"id": "A", "text": "Foundation"}, {"id": "B", "text": "Fly"}, {"id": "C", "text": "Run"}, {"id": "D", "text": "Walk"}, {"id": "E", "text": "Crawl"}], "correct": ["C"], "sourceLabel": "official", "sourceUrl": "https://www.examtopics.com/discussions/_/view/992394"}, {"id": "q173", "originalNumber": 173, "title": "Question #21 Topic 5", "topic": 5, "question": "An Enterprise Architect of a financial services company is working across the enterprise and wants to track their capabilities. Which CSDM 5 domain is used?", "options": [{"id": "A", "text": "Build and Integration (Build)"}, {"id": "B", "text": "Design and Planning (Design)"}, {"id": "C", "text": "Service Delivery (Manage Technical)"}, {"id": "D", "text": "Service Consumption (Sell/Consume)"}, {"id": "E", "text": "Foundation"}], "correct": ["B"], "sourceLabel": "official", "sourceUrl": "https://www.examtopics.com/discussions/_/view/992395"}, {"id": "q177", "originalNumber": 177, "title": "Question #25 Topic 5", "topic": 5, "question": "A health organization must track certain data (for example, regulated patient information) and its relation to Business Applications. Which action does CSDM recommend to meet this goal?", "options": [{"id": "A", "text": "Create fields on the Business Application record to mark the Business Application as containing patient information, and then ask the Business Application owner to mark the application as having patient information or not."}, {"id": "B", "text": "Work with the Database administration team to classify the data on each database that holds patient information, and then use Relationships to map that back to the Business Application."}, {"id": "C", "text": "Create an information Object to represent the patient information, and then link it through a relationship to the Business Application after consulting with the Application owner."}], "correct": ["C"], "sourceLabel": "official", "sourceUrl": "https://www.examtopics.com/discussions/_/view/992399"}, {"id": "q178", "originalNumber": 178, "title": "Question #26 Topic 5", "topic": 5, "question": "A CMDB Architect intends to populate the CMDB using the CSDM guidance. Which key stakeholders from the organization should be involved in decisions regarding population of the CMDB using the CSDM Crawl Stage?", "options": [{"id": "A", "text": "Business Service Manager, Technology Service Owner"}, {"id": "B", "text": "Application Owner, Application Service Owner"}, {"id": "C", "text": "Customer Service Manager, Infrastructure Manager"}], "correct": ["B"], "sourceLabel": "official", "sourceUrl": "https://www.examtopics.com/discussions/_/view/992400"}, {"id": "q179", "originalNumber": 179, "title": "Question #27 Topic 5", "topic": 5, "question": "A hospital has received a new CT Scanner. The inventory management team has created a catalog item doctors can use to schedule patients for scans. What CSDM domain should the inventory management team map the catalog item to?", "options": [{"id": "A", "text": "Foundation"}, {"id": "B", "text": "Design and Planning (Design)"}, {"id": "C", "text": "Service Delivery (Manage Technical Service)"}, {"id": "D", "text": "Service Consumption (Sell/Consume)"}, {"id": "E", "text": "Build and Integration (Build)"}], "correct": ["D"], "sourceLabel": "official", "sourceUrl": "https://www.examtopics.com/discussions/_/view/992401"}, {"id": "q180", " const SKIPPED = [{"number": 2, "title": "Question #2 Topic 1", "question": "DRAG DROP -Drag and drop the application service type to the best description.", "link": "https://www.examtopics.com/discussions/_/view/984775"}, {"number": 50, "title": "Question #12 Topic 2", "question": "DRAG DROP -ServiceNow provides a suite of CMDB management tools designed to effectively ingest, manage, and maintain CIs and relationships. Drag and drop the design architecture to its management tool. Some options may not apply.", "link": "https://www.examtopics.com/discussions/_/view/984798"}, {"number": 55, "title": "Question #17 Topic 2", "question": "DRAG DROP -Drag and drop the product to its description.", "link": "https://www.examtopics.com/discussions/_/view/992324"}, {"number": 71, "title": "Question #2 Topic 3", "question": "DRAG DROP -Drag and drop the CMDB Health Dashboard metric to the description.", "link": "https://www.examtopics.com/discussions/_/view/984803"}, {"number": 87, "title": "Question #18 Topic 3", "question": "DRAG DROP -A new ServiceNow customer is assembling a Configuration Management team to support their CMDB. Drag each role to its corresponding job description.", "link": "https://www.examtopics.com/discussions/_/view/984819"}, {"number": 88, "title": "Question #19 Topic 3", "question": "DRAG DROP -A CMDB Administrator seeks to understand the available tools for preventing, addressing, and remediating duplicate CIs. Drag and drop each feature with the corresponding outcome. Some options may not apply.", "link": "https://www.examtopics.com/discussions/_/view/984820"}, {"number": 101, "title": "Question #32 Topic 3", "question": "DRAG DROP -Drag and drop the CMDB Health Dashboard metric to the description.", "link": "https://www.examtopics.com/discussions/_/view/992348"}, {"number": 102, "title": "Question #33 Topic 3", "question": "DRAG DROP -The CMDB Health Dashboard is based on three Key Performance Indicators (KPIs): Correctness, Compliance, and Completeness. Each KPI includes several sub-metrics. Drag the sub-metrics to the KPI. Some options may not apply.", "link": "https://www.examtopics.com/discussions/_/view/992349"}, {"number": 128, "title": "Question #1 Topic 4", "question": "DRAG DROP -A manufacturing organization has implemented Incident Management in ServiceNow and wants to integrate additional products to enhance its functionality. Drag each ServiceNow product to the value it brings to supporting Incident Management.", "link": "https://www.examtopics.com/discussions/_/view/984824"}, {"number": 157, "title": "Question #5 Topic 5", "question": "DRAG DROP -Some steps need to be taken to transition from using different status attributes in the CMDB to life cycle objects. Drag and drop the objectives/attributes to the description.", "link": "https://www.examtopics.com/discussions/_/view/984836"}, {"number": 168, "title": "Question #16 Topic 5", "question": "DRAG DROP -A CMDB Owner starts on the CSDM journey and needs to become familiar with the CSDM domains. Drag the CMDB objects to the correct CSDM domains.", "link": "https://www.examtopics.com/discussions/_/view/984847"}, {"number": 174, "title": "Question #22 Topic 5", "question": "DRAG DROP -Given a list of Service types in the platform. Drag the appropriate service to its definition.", "link": "https://www.examtopics.com/discussions/_/view/992396"}, {"number": 175, "title": "Question #23 Topic 5", "question": "DRAG DROP -A Platform Owner is building the governance team to support the CSDM. Drag the domain to the roles that make up the governance team.", "link": "https://www.examtopics.com/discussions/_/view/992397"}, {"number": 176, "title": "Question #24 Topic 5", "question": "DRAG DROP -An Enterprise Architect needs to help the CMDB owner understand the benefits of CSDM. Drag the CSDM domains to the respective benefits.", "link": "https://www.examtopics.com/discussions/_/view/992398"}];
const BLOCK_SIZE = 60;
const STORAGE_KEY = "cis_df_quiz_v1_178";

let questionShuffle = true;
let optionShuffle = true;
let order = [];
let optionOrders = {};
let currentIndex = 0;
let state = loadState();

function loadState() {
  try {
    const saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || "{}");
    return saved && typeof saved === "object" ? saved : {};
  } catch {
    return {};
  }
}
function saveState() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
}

function shuffleArray(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function rebuildOrder(preserveCurrent = true) {
  const currentId = order[currentIndex]?.id;
  order = questionShuffle ? shuffleArray(QUESTIONS) : [...QUESTIONS];
  optionOrders = {};
  for (const q of QUESTIONS) {
    optionOrders[q.id] = optionShuffle ? shuffleArray(q.options) : [...q.options];
  }
  if (preserveCurrent && currentId) {
    const idx = order.findIndex(q => q.id === currentId);
    currentIndex = idx >= 0 ? idx : 0;
  } else {
    currentIndex = 0;
  }
  render();
}

function currentBlockIndex() {
  return Math.floor(currentIndex / BLOCK_SIZE);
}
function blockStart() {
  return currentBlockIndex() * BLOCK_SIZE;
}
function blockEnd() {
  return Math.min(blockStart() + BLOCK_SIZE, order.length);
}

function getQState(qid) {
  if (!state[qid]) state[qid] = { selected: [], confirmed: false, correct: false };
  return state[qid];
}

function displayLetter(index) {
  return String.fromCharCode(65 + index);
}

function render() {
  const q = order[currentIndex];
  if (!q) return;
  const qs = getQState(q.id);
  const opts = optionOrders[q.id] || q.options;
  const inBlock = currentIndex - blockStart() + 1;
  const blockLen = blockEnd() - blockStart();
  const totalBlocks = Math.ceil(order.length / BLOCK_SIZE);
  const bidx = currentBlockIndex();

  document.getElementById("blockIndicator").textContent = `Block ${bidx + 1} / ${totalBlocks}`;
  document.getElementById("qHead").textContent = `Question ${inBlock} / ${blockLen} (this block)`;
  document.getElementById("meta").textContent = `Original Excel question #${q.originalNumber}${q.topic ? " • Topic " + q.topic : ""}`;

  const selectCount = q.correct.length;
  const note = selectCount > 1 ? ` <span class="choose-note">Select ${selectCount}</span>` : "";
  document.getElementById("question").innerHTML = escapeHtml(q.question) + note;

  const optionsEl = document.getElementById("options");
  optionsEl.innerHTML = "";
  opts.forEach((opt, idx) => {
    const isSelected = qs.selected.includes(opt.id);
    const isCorrectOpt = q.correct.includes(opt.id);
    let extraClass = isSelected ? " selected" : "";
    if (qs.confirmed && isCorrectOpt) extraClass += " correct";
    if (qs.confirmed && isSelected && !isCorrectOpt) extraClass += " wrong";

    const row = document.createElement("label");
    row.className = "option" + extraClass;

    const input = document.createElement("input");
    input.type = selectCount > 1 ? "checkbox" : "radio";
    input.name = "answer";
    input.value = opt.id;
    input.checked = isSelected;
    input.disabled = qs.confirmed;

    input.addEventListener("change", () => {
      if (qs.confirmed) return;
      if (selectCount === 1) {
        qs.selected = input.checked ? [opt.id] : [];
      } else {
        if (input.checked) {
          if (!qs.selected.includes(opt.id)) qs.selected.push(opt.id);
          if (qs.selected.length > selectCount) {
            qs.selected = qs.selected.filter(x => x !== opt.id);
            input.checked = false;
            document.getElementById("error").textContent = `Select exactly ${selectCount} answers.`;
          } else {
            document.getElementById("error").textContent = "";
          }
        } else {
          qs.selected = qs.selected.filter(x => x !== opt.id);
        }
      }
      saveState();
      render();
    });

    const text = document.createElement("div");
    text.className = "option-label";
    text.textContent = `${displayLetter(idx)}. ${opt.text}`;
    row.append(input, text);
    optionsEl.appendChild(row);
  });

  document.getElementById("confirm").disabled = qs.confirmed;
  document.getElementById("clear").disabled = qs.confirmed || qs.selected.length === 0;

  const feedback = document.getElementById("feedback");
  feedback.className = "feedback";
  feedback.innerHTML = "";
  if (qs.confirmed) {
    const correctTexts = opts
      .map((o, i) => (q.correct.includes(o.id) ? `${displayLetter(i)}. ${escapeHtml(o.text)}` : null))
      .filter(Boolean);
    const source = q.sourceUrl
      ? `<div class="source">Source from spreadsheet: <a href="${escapeAttr(q.sourceUrl)}" target="_blank" rel="noopener noreferrer">open discussion</a></div>`
      : "";
    if (qs.correct) {
      feedback.className = "feedback show good";
      feedback.innerHTML = `<strong>Correct.</strong><div>Answer: ${correctTexts.join(" &nbsp; / &nbsp; ")}</div>${source}`;
    } else {
      feedback.className = "feedback show bad";
      feedback.innerHTML = `<strong>Incorrect.</strong><div>Correct answer: ${correctTexts.join(" &nbsp; / &nbsp; ")}</div>${source}`;
    }
  }

  updateScore();
  updateButtons();
}

function confirmAnswer() {
  const q = order[currentIndex];
  const qs = getQState(q.id);
  const required = q.correct.length;
  document.getElementById("error").textContent = "";
  if (qs.selected.length !== required) {
    document.getElementById("error").textContent =
      required === 1 ? "Please select one answer." : `Please select exactly ${required} answers.`;
    return;
  }
  const selectedSorted = [...qs.selected].sort().join("");
  const correctSorted = [...q.correct].sort().join("");
  qs.confirmed = true;
  qs.correct = selectedSorted === correctSorted;
  saveState();
  render();
}

function clearSelection() {
  const q = order[currentIndex];
  const qs = getQState(q.id);
  if (qs.confirmed) return;
  qs.selected = [];
  document.getElementById("error").textContent = "";
  saveState();
  render();
}

function updateScore() {
  const slice = order.slice(blockStart(), blockEnd());
  let correct = 0, answered = 0;
  for (const q of slice) {
    const s = state[q.id];
    if (s?.confirmed) {
      answered++;
      if (s.correct) correct++;
    }
  }
  document.getElementById("correctCount").textContent = `Block correct count: ${correct}`;
  document.getElementById("answeredCount").textContent = `Answered: ${answered} / ${slice.length}`;
}

function updateButtons() {
  const b = currentBlockIndex();
  const totalBlocks = Math.ceil(order.length / BLOCK_SIZE);
  document.getElementById("prevBlock").disabled = b === 0;
  document.getElementById("nextBlock").disabled = b >= totalBlocks - 1;
  document.getElementById("prevQuestion").disabled = currentIndex === 0;
  document.getElementById("nextQuestion").disabled = currentIndex >= order.length - 1;
}

function escapeHtml(s) {
  return String(s)
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");
}
function escapeAttr(s) {
  return escapeHtml(s);
}

document.getElementById("confirm").addEventListener("click", confirmAnswer);
document.getElementById("clear").addEventListener("click", clearSelection);
document.getElementById("prevQuestion").addEventListener("click", () => {
  if (currentIndex > 0) { currentIndex--; render(); window.scrollTo({top:0, behavior:"smooth"}); }
});
document.getElementById("nextQuestion").addEventListener("click", () => {
  if (currentIndex < order.length - 1) { currentIndex++; render(); window.scrollTo({top:0, behavior:"smooth"}); }
});
document.getElementById("prevBlock").addEventListener("click", () => {
  const target = Math.max(0, blockStart() - BLOCK_SIZE);
  currentIndex = target; render(); window.scrollTo({top:0, behavior:"smooth"});
});
document.getElementById("nextBlock").addEventListener("click", () => {
  const target = Math.min(order.length - 1, blockStart() + BLOCK_SIZE);
  currentIndex = target; render(); window.scrollTo({top:0, behavior:"smooth"});
});
document.getElementById("reshuffle").addEventListener("click", () => rebuildOrder(true));

document.getElementById("shuffleQuestions").addEventListener("change", e => {
  questionShuffle = e.target.checked;
  rebuildOrder(true);
});
document.getElementById("shuffleOptions").addEventListener("change", e => {
  optionShuffle = e.target.checked;
  const currentId = order[currentIndex]?.id;
  for (const q of QUESTIONS) {
    optionOrders[q.id] = optionShuffle ? shuffleArray(q.options) : [...q.options];
  }
  const idx = order.findIndex(q => q.id === currentId);
  if (idx >= 0) currentIndex = idx;
  render();
});

document.getElementById("resetProgress").addEventListener("click", () => {
  if (confirm("Reset all saved quiz answers and scores?")) {
    state = {};
    localStorage.removeItem(STORAGE_KEY);
    render();
  }
});

document.addEventListener("keydown", e => {
  if (e.key === "ArrowLeft" && currentIndex > 0) {
    currentIndex--; render();
  } else if (e.key === "ArrowRight" && currentIndex < order.length - 1) {
    currentIndex++; render();
  } else if (e.key === "Enter") {
    const q = order[currentIndex], qs = getQState(q.id);
    if (!qs.confirmed) confirmAnswer();
  }
});

const skippedList = document.getElementById("skippedList");
for (const item of SKIPPED) {
  const li = document.createElement("li");
  li.append(document.createTextNode(`#${item.number} — ${item.question} `));
  if (item.link && /^https?:\/\//i.test(item.link)) {
    const a = document.createElement("a");
    a.href = item.link; a.target = "_blank"; a.rel = "noopener noreferrer";
    a.textContent = "source";
    li.append(a);
  }
  skippedList.appendChild(li);
}

rebuildOrder(false);
</script>
